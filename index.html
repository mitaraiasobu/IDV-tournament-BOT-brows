<!doctype html>
<html lang="ja" class="stage">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トーナメント表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+JP:wght@500;800;900&family=Yuji+Boku&display=swap">
<style>
  :root {
    --bg: #12141a; --panel: #1b1f29; --panel2: #232836; --text: #eceff6; --sub: #98a1b5;
    --line: #3a4258; --accent: #ffb020; --win: #2ecc71; --lose: #6b7387; --hot: #ff5c7a;
    --ext: #b388ff; --warn: #ffb020;
    --chip: #2c3345; --champbg: #3a2c0a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
               font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif; }
  /* 表示は2種類：stage＝横長の画面（OBSの1920x1080など）。1920x1080の固定ステージを、画面に合わせて拡縮する（スクロールなし）
                  flow＝縦長・狭い画面（スマホなど）。画面の幅に合わせて文字の大きさ・並びが変わり、縦に並べて、スクロールできる */
  html.stage, html.stage body { height: 100%; overflow: hidden; }
  html[data-bg="transparent"], html[data-bg="transparent"] body { background: transparent; }

  /* ════════ 配信用：1920x1080 固定ステージ（ウィンドウに合わせて拡縮） ════════ */
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0;
           display: flex; flex-direction: column; padding: 34px 60px 26px; overflow: hidden;
           background-repeat: no-repeat; background-position: center; background-size: 100% 100%; }

  .top { height: 92px; flex: none; display: flex; align-items: center; justify-content: space-between; }
  .top h1 { margin: 0; font-size: 56px; letter-spacing: .06em; border-left: 10px solid var(--accent); padding-left: 22px; }
  .top .sub { font-size: 22px; color: var(--sub); letter-spacing: .22em; }

  .tabs { flex: none; display: flex; gap: 12px; margin: 0 0 10px; }
  .tabs.hidden { display: none; }
  .tabs button { font: inherit; font-size: 22px; padding: 6px 22px; border-radius: 999px; border: 2px solid var(--line);
                 background: transparent; color: var(--sub); cursor: pointer; }
  .tabs button.on { color: var(--text); border-color: var(--accent); background: var(--panel); }
  .round .rnote { font-size: 15px; color: var(--sub); margin: -2px 0 6px; line-height: 1.35; min-height: 20px; }
  /* 試合カードの上の段：開始予定の時間を、大きく書く（ラウンド名・試合形式は、列の見出しにあるので、カードごとには書かない） */
  .mtimebig { font-size: 26px; font-weight: 800; color: var(--text); letter-spacing: .04em; line-height: 1.2; }
  .round.dense .mtimebig { font-size: 17px; }
  html.flow .mtimebig { font-size: 1.3em; }
  .bracket { --rw: 460px; flex: 1; min-height: 0; display: flex; gap: 40px; }
  .round { display: flex; flex-direction: column; width: var(--rw); flex: none; }
  .round.champ { width: 300px; }
  .bracket.wide .round.champ { width: 260px; }
  .round h2 { margin: 0; height: 44px; font-size: 24px; color: var(--sub); font-weight: 600; letter-spacing: .1em;
              display: flex; gap: 12px; align-items: center; }
  .round h2 small { font-size: 15px; padding: 1px 10px; border: 1px solid var(--line); border-radius: 999px; }
  .col { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .group { flex: 1; display: flex; flex-direction: column; position: relative; min-height: 0; }
  .group::after { content: ""; position: absolute; right: -20px; width: 20px; top: 25%; bottom: 25%;
                  border: 3px solid var(--line); border-left: 0; pointer-events: none; }
  .slot { flex: 1; display: flex; align-items: center; padding: 6px 0; min-height: 0; }

  .match { position: relative; width: 100%; background: var(--panel); border: 2px solid var(--line);
           border-radius: 14px; overflow: hidden; }
  .round:not(.first) .match::before, .round.champ .box::before {
    content: ""; position: absolute; left: -22px; width: 22px; top: 50%; border-top: 3px solid var(--line); }
  .round.final .match::after { content: ""; position: absolute; right: -22px; width: 22px; top: 50%;
                               border-top: 3px solid var(--line); }
  /* ラウンド1が5試合以上（9〜16チーム）のときは、その列だけカードを小さくする */
  .round.dense .slot { padding: 3px 0; }
  .round.dense .mhead { padding: 2px 12px; font-size: 12px; }
  .round.dense .badge { font-size: 11px; padding: 0 8px; }
  .round.dense .team { padding: 3px 12px; font-size: 19px; }
  .round.dense .team .score { font-size: 22px; }
  .round.dense .mfoot { display: none; }
  .round.dense .dqtag { font-size: 11px; }
  /* ラウンド1が9試合以上（17〜32チーム）：カード1枚を約45pxにする（試合ヘッダーは省く） */
  .round.xdense .slot { padding: 2px 0; }
  .round.xdense .match { border-width: 1px; border-radius: 8px; }
  .round.xdense .mhead { display: none; }
  .round.xdense .team { padding: 2px 10px; font-size: 15px; line-height: 1.15; gap: 6px; }
  .round.xdense .team .score { font-size: 16px; min-width: 18px; }
  .round.xdense .abbr { display: none; }
  .round.xdense .team.win .tname::after { content: ""; }
  /* 17試合以上（33チーム〜）：さらに小さく */
  .round.xxdense .slot { padding: 1px 0; }
  .round.xxdense .team { padding: 0 6px; font-size: 10px; line-height: 1.1; gap: 4px; }
  .round.xxdense .team .score { font-size: 11px; min-width: 12px; }
  /* キャスターの名前：遠くからでも読めるように、大きく・太く（試合が多いラウンドでは、カードに収まる範囲で、できるだけ大きく） */
  .mcast { padding: 6px 16px 9px; font-size: 20px; color: var(--sub); border-top: 1px solid var(--line); letter-spacing: .03em; }
  .mcast b { color: var(--text); font-weight: 800; font-size: 26px; }
  .round.dense .mcast { padding: 2px 12px 4px; font-size: 15px; }
  .round.dense .mcast b { font-size: 19px; }
  .round.xdense .mcast, .round.xxdense .mcast { padding: 0 10px 1px; font-size: 12px; }
  .round.xdense .mcast b, .round.xxdense .mcast b { font-size: 14px; }
  .mhead { display: flex; justify-content: space-between; align-items: center; padding: 6px 16px;
           font-size: 16px; color: var(--sub); background: var(--panel2); letter-spacing: .05em; }
  .badge { padding: 2px 12px; border-radius: 999px; font-size: 15px; font-weight: 700; white-space: nowrap;
           background: var(--chip); color: var(--sub); }
  .st-in_progress { border-color: rgba(255,92,122,.55); }
  .st-in_progress .badge { background: rgba(255,92,122,.2); color: var(--hot); }
  .st-in_progress .badge::before { content: "● "; animation: blink 1.2s infinite; }
  .st-extension .badge { background: rgba(179,136,255,.2); color: var(--ext); }
  .st-undecided .badge { background: rgba(255,176,32,.2); color: var(--warn); }
  .st-finished .badge { background: rgba(46,204,113,.18); color: var(--win); }
  .by-dq .badge { background: rgba(255,92,122,.2); color: var(--hot); }
  @keyframes blink { 50% { opacity: .2; } }

  .team { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line);
          font-size: 27px; font-weight: 700; }
  .mhead + .team { border-top: 0; }
  .team .tname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .team .score { font-size: 34px; line-height: 1.1; font-variant-numeric: tabular-nums; min-width: 30px; text-align: right; }
  .team.win { background: linear-gradient(90deg, rgba(46,204,113,.24), transparent 80%); box-shadow: inset 6px 0 0 var(--win); }
  .team.win .tname::after { content: " ✔"; color: var(--win); }
  .team.lose { color: var(--lose); opacity: .5; }
  .team.tbd .tname { color: var(--sub); font-weight: 400; font-style: italic; }
  .team.dq .tname { text-decoration: line-through; }
  .team.bye .tname { color: var(--sub); font-weight: 400; font-style: italic; }
  .st-finished.is-bye { border-style: dashed; }
  .abbr { font-size: .62em; font-weight: 600; color: var(--sub); letter-spacing: .06em; margin-left: 6px; }
  .dqtag { font-size: 15px; font-weight: 700; background: var(--hot); color: #fff; padding: 1px 10px; border-radius: 6px; }
  .mfoot { min-height: 34px; padding: 6px 16px 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
           border-top: 1px dashed var(--line); font-size: 15px; color: var(--sub); }
  .chip { padding: 1px 9px; border-radius: 6px; background: var(--chip); color: var(--sub); font-variant-numeric: tabular-nums; }
  .chip b { color: var(--text); }
  .chip.wip { background: transparent; border: 1px dashed var(--line); }
  .chip.ext { background: rgba(179,136,255,.18); color: var(--ext); font-weight: 700; }
  .chip.adm { background: rgba(255,176,32,.18); color: var(--warn); font-weight: 700; }

  .champ .box { position: relative; text-align: center; padding: 36px 16px; border-radius: 16px; width: 100%;
                border: 2px solid var(--accent); background: linear-gradient(160deg, var(--champbg), var(--panel)); }
  .champ .box .trophy { font-size: 72px; line-height: 1; }
  .champ .box .label { font-size: 16px; color: var(--accent); letter-spacing: .3em; margin: 10px 0; }
  .champ .box .cname { font-size: 34px; font-weight: 800; word-break: break-all; }
  .champ .box .clogo { display: block; width: 110px; height: 110px; object-fit: contain; margin: 4px auto 6px; filter: drop-shadow(0 0 3px rgba(0,0,0,.8)); }
  .champ .box .cplayers { margin-top: 16px; font-size: 21px; line-height: 1.5; color: var(--sub); font-weight: 500; }
  .champ .box .cplayers span { display: block; word-break: break-all; }
  .champ .box.empty { border-color: var(--line); background: var(--panel); color: var(--sub); }
  .champ .box.empty .label { color: var(--sub); }

  .nowbar { height: 64px; flex: none; margin-top: 10px; display: flex; gap: 16px; align-items: center;
            background: var(--panel); border: 2px solid var(--line); border-radius: 12px; padding: 0 22px;
            font-size: 24px; overflow: hidden; white-space: nowrap; }
  .nowbar .lbl { font-weight: 800; letter-spacing: .12em; color: var(--hot); }
  .nowbar .item { display: flex; gap: 10px; align-items: baseline; }
  .nowbar .item + .item { padding-left: 20px; border-left: 2px solid var(--line); }
  .nowbar .next { color: var(--sub); font-size: 20px; }
  .nowbar .delay { margin-left: auto; font-weight: 800; color: var(--hot); white-space: nowrap; }
  .nowbar.idle .delay { margin-left: 0; }
  .mtimebig .shifttag { font-size: .55em; font-weight: 700; letter-spacing: 0; margin-left: .5em; white-space: nowrap; }
  .mtimebig .shifttag.late { color: var(--hot); }
  .mtimebig .shifttag.early { color: var(--win); }
  .team .tlogo { flex: none; width: 1.1em; height: 1.1em; object-fit: contain; margin-right: .35em; filter: drop-shadow(0 0 1px rgba(0,0,0,.9)); }
  .nowbar.champion { border-color: var(--accent); color: var(--accent); font-weight: 800; justify-content: center; }
  .nowbar.idle { color: var(--sub); justify-content: center; }
  .nowbar.hidden { display: none; }

  .msg { padding: 120px 0; text-align: center; color: var(--sub); font-size: 28px; width: 100%; }

  /* チーム登録受付中（抽選前） */
  .regboard { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 26px; padding-top: 14px; }
  .regboard .count { font-size: 44px; font-weight: 800; letter-spacing: .06em; }
  .regboard .count b { color: var(--accent); font-size: 96px; font-variant-numeric: tabular-nums; margin: 0 8px; }
  .regboard .hint { font-size: 24px; color: var(--sub); }
  .teamgrid { width: 100%; display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .teamcell { border: 2px solid var(--line); border-radius: 12px; background: var(--panel); padding: 12px 18px;
              display: flex; align-items: center; gap: 12px; height: 66px; font-size: 26px; font-weight: 700; overflow: hidden; }
  .teamcell .ab { font-size: .7em; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 0 8px; }
  .teamcell .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .teamcell.empty { border-style: dashed; color: var(--lose); font-weight: 400; font-style: italic; justify-content: center; }

  /* ════════ 詳細ページ（?view=details）：通常のスクロール表示 ════════ */
  html.stage body.details { overflow: auto; }
  body.details #stage { display: none; }
  body:not(.details) #detailsPage { display: none; }
  #detailsPage { max-width: 1100px; margin: 0 auto; padding: 20px 20px 60px; }
  #detailsPage h1 { font-size: 26px; margin: 0 0 6px; }
  .dcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; overflow: hidden; }
  .dcard > .dhead { padding: 10px 14px; background: var(--panel2); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .dhead .dtitle { font-weight: 700; }
  .dhead .dsub { color: var(--sub); font-size: 12px; }
  .dbody { padding: 6px 14px 12px; }
  .dset { margin-top: 10px; }
  .dset .sh { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-weight: 700; }
  .dset .sh .res { font-weight: 600; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--chip); color: var(--sub); }
  .dset .sh .res.w { background: rgba(46,204,113,.16); color: var(--win); }
  .dset .sh .tot { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--sub); font-weight: 400; }
  .tag-ext { color: var(--ext); font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 4px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--sub); font-weight: 500; font-size: 11px; }
  td.num { font-variant-numeric: tabular-nums; }
  .none { color: var(--sub); font-size: 13px; }
  .reason { color: var(--sub); font-size: 12px; margin-top: 8px; }
  .layoutbtn { position: fixed; z-index: 50; right: 8px; bottom: 8px; font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px;
               border: 1px solid var(--line); background: rgba(27,31,41,.85); color: var(--text); }
  .layoutbtn[hidden] { display: none; }
  /* ════════ flow：縦長・狭い画面（スマホなど）。ラウンドを縦に並べ、幅に合わせて文字を大きくし、スクロールできる ════════ */
  html.flow { font-size: clamp(15px, 1.5vw, 30px); }
  @media (max-width: 900px) { html.flow { font-size: clamp(15px, 4vw, 20px); } }
  html.flow, html.flow body { min-height: 100%; overflow-x: hidden; overflow-y: auto; }
  html.flow #stage { position: relative; left: auto !important; top: auto !important; width: auto; height: auto;
                     transform: none !important; display: block; padding: .8em; overflow: visible; background-image: none !important; }
  html.flow .top { height: auto; flex-wrap: wrap; gap: .3em .8em; padding: .3em 0 .6em; }
  html.flow .top h1 { font-size: 1.7em; padding-left: .5em; border-left-width: .25em; overflow-wrap: anywhere; }
  html.flow .top .sub { font-size: .7em; letter-spacing: .15em; }
  html.flow .bracket { display: flex; flex-direction: column; gap: 1.2em; }
  html.flow .round, html.flow .round.champ, html.flow .bracket.wide .round.champ { width: 100%; }
  html.flow .round h2 { height: auto; font-size: 1.1em; margin-bottom: .4em; }
  html.flow .round h2 small { font-size: .7em; }
  html.flow .col, html.flow .group { display: block; flex: none; }
  html.flow .group::after, html.flow .round .match::before, html.flow .round .match::after,
  html.flow .round.champ .box::before { display: none !important; }
  html.flow .round .slot { display: block; padding: .25em 0 !important; }
  html.flow .round .match { border-width: 2px !important; border-radius: .7em !important; }
  html.flow .round .mhead { display: flex !important; padding: .35em .8em !important; font-size: .8em !important; }
  html.flow .round .badge { font-size: .8em !important; padding: .1em .7em !important; }
  html.flow .round .team { font-size: 1.05em !important; padding: .45em .8em !important; line-height: 1.3 !important; gap: .5em !important; }
  html.flow .round .team .score { font-size: 1.3em !important; min-width: 1.2em !important; }
  html.flow .round .team .tname { white-space: normal; overflow-wrap: anywhere; }
  html.flow .round .abbr { display: inline !important; }
  html.flow .round .dqtag { font-size: .7em !important; }
  html.flow .round .mfoot { display: flex !important; padding: .4em .8em !important; min-height: 0; font-size: .8em !important; }
  html.flow .champ .box { padding: 1em; }
  html.flow .champ .box .trophy { font-size: 3em; }
  html.flow .champ .box .label { font-size: .8em; }
  html.flow .champ .box .cname { font-size: 1.4em; }
  html.flow .nowbar { height: auto; white-space: normal; flex-wrap: wrap; font-size: 1em; padding: .6em .8em; margin: .8em 0; }
  html.flow .nowbar .next { font-size: .8em; }
  html.flow .nowbar .item + .item { padding-left: .8em; }
  html.flow .msg { padding: 3em 0; font-size: 1.1em; }
  html.flow .regboard { padding-top: 0; gap: .8em; }
  html.flow .regboard .count { font-size: 1.3em; text-align: center; }
  html.flow .regboard .count b { font-size: 2.4em; }
  html.flow .regboard .hint { font-size: .9em; }
  html.flow .teamgrid { grid-template-columns: repeat(auto-fill, minmax(11em, 1fr)) !important; gap: .5em; }
  html.flow .teamcell { height: auto !important; font-size: 1em !important; padding: .5em .8em; }
  html.flow body:not(.details) #detailsPage { display: block; }
  html.flow #detailsPage { padding: .5em .8em 3em; }
  html.flow #detailsPage h1 { font-size: 1.2em; }
  html.flow .dcard { overflow-x: auto; }
  html.flow table { font-size: .85em; }
  /* ═══════════════ ロック：トーナメント表（BAN/PICK配信ページの「ロック」と同じ雰囲気。名前・数字だけロックのフォントで、選手・チーム名は読みやすいまま） ═══════════════ */
  @font-face { font-family: "Edo SZ"; src: url("assets/rock/edosz.ttf") format("truetype"); font-display: swap; }
  @font-face { font-family: "851Kana"; src: url("assets/rock/851chikara-dzuyoku-kanaA.ttf") format("truetype");
               unicode-range: U+3040-309F, U+30A0-30FF, U+31F0-31FF, U+FF66-FF9F; font-display: swap; }
  html[data-design="rock"] { --disp: "Edo SZ", "851Kana", "Yuji Boku", "Yu Gothic UI", sans-serif; --cond: "Anton", "Noto Sans JP", "Yu Gothic UI", "Hiragino Sans", sans-serif;
    --ink: color-mix(in srgb, var(--bg) 55%, black); --red: #e0485a;
    --rock-grad: linear-gradient(160deg, color-mix(in srgb, var(--accent) 84%, white), var(--accent) 45%, color-mix(in srgb, var(--accent) 62%, var(--bg)));
    --grunge: url(assets/rock/darkgrunge.webp); }
  html[data-design="rock"] #stage::before { content: ""; position: absolute; inset: 0; background: var(--rock-grad); opacity: .8; pointer-events: none;
    -webkit-mask: url(assets/rock/scratch_alpha.webp) center / cover no-repeat; mask: url(assets/rock/scratch_alpha.webp) center / cover no-repeat; }
  html[data-bg="transparent"] #stage::before { display: none; }
  html[data-design="rock"] #stage > * { position: relative; z-index: 1; }
  html[data-design="rock"] .top h1 { font-family: var(--disp); font-weight: 400; text-shadow: .06em .06em 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  html[data-design="rock"] .top .sub, html[data-design="rock"] .round h2, html[data-design="rock"] .nowbar .lbl, html[data-design="rock"] .champ .box .label { font-family: var(--cond); font-weight: 800; }
  html[data-design="rock"] .match, html[data-design="rock"] .teamcell, html[data-design="rock"] .nowbar, html[data-design="rock"] .champ .box {
    border: 0; border-radius: 0; background-color: var(--ink); background-image: var(--grunge); background-size: cover; background-position: 60% 50%; background-blend-mode: screen;
    box-shadow: inset 5px 0 0 var(--accent); }
  html[data-design="rock"] .champ .box.empty { box-shadow: inset 5px 0 0 var(--line); }
  html[data-design="rock"] .st-in_progress { box-shadow: inset 5px 0 0 var(--hot); }
  html[data-design="rock"] .st-extension { box-shadow: inset 5px 0 0 var(--ext); }
  html[data-design="rock"] .st-finished { box-shadow: inset 5px 0 0 var(--win); }
  html[data-design="rock"] .mhead { background: color-mix(in srgb, var(--accent) 20%, var(--ink)); font-family: var(--cond); font-weight: 800; }
  html[data-design="rock"] .badge, html[data-design="rock"] .chip, html[data-design="rock"] .dqtag { border-radius: 0; }
  html[data-design="rock"] .team .score, html[data-design="rock"] .regboard .count b { font-family: var(--cond); font-weight: 400; }
  html[data-design="rock"] .champ .box .cname { font-family: var(--disp); font-weight: 400; }
  /* ═══════════════ ファンタジー：トーナメント表（画像の背景・背景の枠。見出し・数字＝反逆、名前の表示＝黒薔薇ゴシック＋刻明朝。選手・チーム名は読みやすいまま） ═══════════════ */

    --lace-t: radial-gradient(circle at 50% 100%, transparent 4px, var(--gold) 4.3px 5.4px, transparent 5.7px) top left / 12px 6px repeat-x;

<body>
<script>window.TOURNAMENT_DATA_BASE = "https://idv-tournament-bot-realtime-default-rtdb.asia-southeast1.firebasedatabase.app/tournament/";</script>

<div id="stage">
  <div class="top">
    <h1 id="title">トーナメント表</h1>
    <div class="sub" id="sub">SINGLE ELIMINATION</div>
  </div>
  <div id="tabs" class="tabs hidden"></div>
  <div id="bracket" class="bracket"></div>
  <div id="nowbar" class="nowbar idle"></div>
</div>

<div id="detailsPage">
  <h1 id="dtitle">試合結果の詳細</h1>
  <div class="reason" id="updated"></div>
  <div id="details"></div>
</div>

<!-- Botが自動出力する tournament.js（window.TOURNAMENT_DATA）を3秒おきに読み直す -->
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var DETAILS = params.get("view") === "details";
  if (DETAILS) document.body.classList.add("details");
  if (params.get("bg") === "transparent") document.documentElement.setAttribute("data-bg", "transparent");
  var POLL_MS = 3000, last = null;
  // 配信画面（live.html）が、最後のトーナメント表として、このページを埋め込むとき（?embed=1）：優勝チームの欄に、ロゴと全選手の名前を足す（選手名は、公開データには無いので、埋め込んだ側から、受け取る）
  var EMBED = params.get("embed") === "1", champPlayers = [];
  if (EMBED) {
    window.addEventListener("message", function (e) {
      if (e.origin !== location.origin || !e.data || e.data.type !== "champion_players" || !Array.isArray(e.data.players)) return;
      champPlayers = e.data.players.filter(function (x) { return typeof x === "string"; }).slice(0, 30).map(function (x) { return x.slice(0, 40); });
      last = null;
      if (curData) render(curData);
    });
  }
  var tab = params.get("tab") === "plan" ? "plan" : "reg";      // チーム登録受付中（抽選前）の表示：reg＝登録状況／plan＝予定のトーナメント表
  var curData = null;
  var BADGE = { pending: "対戦相手待ち", ready: "未試合", in_progress: "試合中", extension: "延長戦",
                undecided: "判断待ち", finished: "勝敗確定" };
  var ROUNDS = 3;   // 現在の大会のラウンド数（render で更新）

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  // ── 1920x1080 を表示領域いっぱいに拡縮（OBSが1920x1080なら等倍） ──
  // 縦長・狭い画面（スマホなど）は、横長の表を90°回して画面いっぱいに出す（スマホを横にして見る）。「縦に並べる」で、縦に並べる表示（flow）にもできる
  var LAYOUT_KEY = "tournament_mobile_layout";
  function getLayout() { try { return localStorage.getItem(LAYOUT_KEY) === "flow" ? "flow" : "rotate"; } catch (e) { return "rotate"; } }
  function setLayout(v) { try { localStorage.setItem(LAYOUT_KEY, v); } catch (e) { /* 保存できなくても、このまま表示する */ } }
  function layoutButton(show, flow) {
    var b = document.getElementById("layoutBtn");
    if (!b) {
      b = el("button", "layoutbtn");
      b.id = "layoutBtn"; b.type = "button";
      b.addEventListener("click", function () { setLayout(getLayout() === "flow" ? "rotate" : "flow"); fit(); });
      document.body.appendChild(b);
    }
    b.hidden = !show;
    b.textContent = flow ? "↻ 横向きの表で見る" : "☰ 縦に並べて見る";
  }
  function fit() {
    if (DETAILS) return;
    var st = document.getElementById("stage");
    var W = window.innerWidth, H = window.innerHeight;
    var portrait = W / Math.max(1, H) < 1.25;
    var flowNow = portrait && getLayout() === "flow";
    document.documentElement.className = flowNow ? "flow" : "stage";
    layoutButton(portrait, flowNow);
    if (flowNow) {
      st.style.transform = ""; st.style.left = ""; st.style.top = "";
      return;
    }
    if (portrait) {                                              // 90°回す：画面の縦（H）が表の横（1920）、画面の横（W）が表の縦（1080）
      var r = Math.min(H / 1920, W / 1080);
      st.style.left = "0px"; st.style.top = "0px";
      st.style.transform = "translate(" + ((W + 1080 * r) / 2) + "px," + ((H - 1920 * r) / 2) + "px) rotate(90deg) scale(" + r + ")";
      return;
    }
    var s = Math.min(W / 1920, H / 1080);
    st.style.transform = "scale(" + s + ")";
    st.style.left = Math.max(0, (W - 1920 * s) / 2) + "px";
    st.style.top = Math.max(0, (H - 1080 * s) / 2) + "px";
  }
  window.addEventListener("resize", fit);
  fit();

  // ── 大会のテーマカラー：ベース色（背景）とアクセント色から、パネル・線・文字の色を作る（未設定なら標準の色） ──
  function hex2rgb(h) { var n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgb2css(c) { return "rgb(" + c.map(function (v) { return Math.round(v); }).join(",") + ")"; }
  function mix(a, b, t) { return [0, 1, 2].map(function (i) { return a[i] + (b[i] - a[i]) * t; }); }
  function lum(c) {
    var f = c.map(function (v) { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
    return 0.2126 * f[0] + 0.7152 * f[1] + 0.0722 * f[2];
  }
  var THEME_VARS = ["--bg", "--panel", "--panel2", "--text", "--sub", "--line", "--accent", "--lose", "--chip", "--champbg"];
  function applyTheme(th) {
    var root = document.documentElement.style;
    THEME_VARS.forEach(function (p) { root.removeProperty(p); });
    if (!th || !th.base || !th.accent) return;
    var base = hex2rgb(th.base), acc = hex2rgb(th.accent);
    var text = lum(base) > 0.45 ? [22, 26, 38] : [236, 239, 246];            // 明るい背景なら暗い文字、暗い背景なら明るい文字
    root.setProperty("--bg", th.base);
    root.setProperty("--panel", rgb2css(mix(base, text, 0.07)));
    root.setProperty("--panel2", rgb2css(mix(base, text, 0.13)));
    root.setProperty("--line", rgb2css(mix(base, text, 0.30)));
    root.setProperty("--chip", rgb2css(mix(base, text, 0.16)));
    root.setProperty("--text", rgb2css(text));
    root.setProperty("--sub", rgb2css(mix(base, text, 0.62)));
    root.setProperty("--lose", rgb2css(mix(base, text, 0.50)));
    root.setProperty("--accent", th.accent);
    root.setProperty("--champbg", rgb2css(mix(base, acc, 0.28)));
  }

  function sideName(m, side) { var t = m["team_" + side]; return t ? t.name : "未定"; }

  // ── チームのロゴの画像：ロゴを使う大会は、データの logos（置き場所の12文字と版）から、画像をまとめて読む（版が変わったときだけ）。
  //    承認されたロゴのあるチームだけ、チーム名の左に、文字と同じ大きさで出す（無ければ、これまでどおり、何も出さない）。
  var logoMap = {}, logosVer = null, logosLoading = false, lastRendered = null;
  function ensureLogos(lg) {
    if (!lg || !lg.key || !window.TOURNAMENT_DATA_BASE) { if (logosVer !== null) { logoMap = {}; logosVer = null; } return; }
    if (lg.ver === logosVer || logosLoading) return;
    logosLoading = true;
    fetch(window.TOURNAMENT_DATA_BASE + lg.key + ".json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        logoMap = (d && d.logos) || {};
        logosVer = lg.ver;
        logosLoading = false;
        if (lastRendered) render(lastRendered);                          // 画像がそろったので、描き直す
      })
      .catch(function () { logosLoading = false; });
  }
  function logoSrc(t) { return t && t.logo ? logoMap[String(t.id)] || null : null; }

  // ── 予定の時間と、遅延・繰り上げ ──
  // もとの予定の時間に、「（20:00に遅延中）」「（19:30に繰り上げ予定）」を足す（ずれた先の時刻。日付が違うときは、日付も）
  function shiftTag(base, now, shift) {
    if (!base || !now || !shift) return "";
    var b = String(base).replace("T", " "), n = String(now).replace("T", " ");
    var when = b.slice(0, 10) === n.slice(0, 10) ? n.slice(11, 16) : fmtDT(now);
    return "（" + when + (shift > 0 ? "に遅延中）" : "に繰り上げ予定）");
  }
  // 「いま」の表示に書く、いまの遅延・早まり：「⏱ 遅延 15分」「⏱ 15分 早まり」
  function delayChip(min) {
    if (!min) return null;
    return el("span", "delay", min > 0 ? "⏱ 遅延 " + min + "分" : "⏱ " + (-min) + "分 早まり");
  }

  // ── ステージ（配信用） ──
  function teamRow(m, side) {
    var t = m["team_" + side];
    var cls = "team";
    if (!t) cls += " tbd";
    else if (t.bye) cls += " bye";
    else if (m.winner === side) cls += " win";
    else if (m.winner) cls += " lose";
    if (t && t.dq) cls += " dq";
    var row = el("div", cls);
    var nm = el("span", "tname", t ? t.name : "未定");
    if (t && !t.bye && t.abbr) nm.appendChild(el("span", "abbr", t.abbr));
    var lsrc = t && !t.bye ? logoSrc(t) : null;                       // 承認されたロゴがあれば、チーム名の左に（文字と同じ大きさで）出す
    if (lsrc) { var li = el("img", "tlogo"); li.src = lsrc; li.alt = ""; row.appendChild(li); }
    row.appendChild(nm);
    if (t && t.dq) row.appendChild(el("span", "dqtag", "失格"));
    var showScore = t && !t.bye && m.team_a && m.team_b && !m.bye;
    row.appendChild(el("span", "score", showScore ? String(m.set_wins[side]) : ""));
    return row;
  }

  function chip(cls, a, b, winSide) {
    var c = el("span", "chip " + cls);
    var x = el(winSide === "a" ? "b" : "span", null, String(a));
    var y = el(winSide === "b" ? "b" : "span", null, String(b));
    c.appendChild(x); c.appendChild(document.createTextNode("-")); c.appendChild(y);
    return c;
  }

  // 割り当てられたキャスター：「🎙 キャスター 名前」（2人は「名前・名前」）。実況・解説の区別は書かない。割り当てが無ければ、何も出さない
  function casterLine(m) {
    var c = m.casters;
    if (!c || m.bye) return null;
    var f = document.createDocumentFragment();
    f.appendChild(document.createTextNode("🎙 "));
    f.appendChild(document.createTextNode("キャスター "));                      // 実況・解説の区別は書かない。名前だけ（2人は「・」でつなぐ）
    var names = [c.live, c.commentary].filter(function (x) { return x; }).concat(c.more || []);        // 2人（3人以上のときは、全員）を「・」でつなぐ
    names.forEach(function (n, i) {
      if (i) f.appendChild(document.createTextNode("・"));
      f.appendChild(el("b", null, n));
    });
    return f;
  }

  function matchCard(m) {
    var card = el("div", "match st-" + m.status + (m.by_dq ? " by-dq" : "") + (m.bye ? " is-bye" : ""));
    card.appendChild(el("span", "orn", "✧"));                       // ゴシックのデザインのときだけ見える飾り
    var head = el("div", "mhead");
    var label = m.round === ROUNDS ? "決勝" : m.round_name + " #" + (m.index + 1);
    if (m.time && !m.bye) {                                                                       // 開始予定の時間（大きく）。遅れ・繰り上げのときは、もとの予定の時間に、ずれた先の時刻を足す
      var tspan = el("span", "mtimebig", fmtDT(m.time_base || m.time));
      var tag = m.time_base ? shiftTag(m.time_base, m.time, m.shift) : "";
      if (tag) tspan.appendChild(el("small", "shifttag" + (m.shift > 0 ? " late" : " early"), tag));
      head.appendChild(tspan);
    }
    else head.appendChild(el("span", null, m.bye ? label : label + " · " + m.format));            // 時間が決まっていない試合だけ、ラウンド名・試合形式を書く
    head.appendChild(el("span", "badge", m.bye && m.status === "finished" ? "不戦勝" :
                                         m.by_dq && m.status === "finished" ? "失格勝ち" : BADGE[m.status]));
    card.appendChild(head);
    card.appendChild(teamRow(m, "a"));
    card.appendChild(teamRow(m, "b"));
    var cast = casterLine(m);
    if (cast) { var cl = el("div", "mcast"); cl.appendChild(cast); card.appendChild(cl); }
    if (m.team_a && m.team_b && !m.bye && (m.sets.length || m.extension_needed || m.status === "undecided")) {
      var f = el("div", "mfoot");
      m.sets.forEach(function (s) {
        if (s.complete) {
          var c = chip("", s.points.a, s.points.b, s.result === "draw" ? null : s.result);
          c.insertBefore(document.createTextNode("S" + s.set_no + "　"), c.firstChild);
          f.appendChild(c);
        } else {
          f.appendChild(el("span", "chip wip", "S" + s.set_no + "　…"));
        }
      });
      if (m.extension_needed) {
        var ex = m.extension || {};
        f.appendChild(el("span", "chip ext", "延長戦" + (ex.winner ? " ✔" : "")));
      }
      if (m.status === "undecided") f.appendChild(el("span", "chip adm", "管理者判断待ち"));
      else if (m.decided_by_admin && !m.by_dq) f.appendChild(el("span", "chip adm", "管理者判断"));
      card.appendChild(f);
    }
    return card;
  }

  function slot(node) { var s = el("div", "slot"); s.appendChild(node); return s; }
  function group(nodes) { var g = el("div", "group"); nodes.forEach(function (n) { g.appendChild(slot(n)); }); return g; }
  function fmtDT(iso) { var d = String(iso).replace("T", " "); return d.slice(5, 16).replace("-", "/"); }
  // ラウンドの進行方法と開始予定：「同時進行（実況・解説なし）・10/24 16:00 開始予定」
  function roundNote(rd) {
    var parts = [];
    if (rd.concurrent === true) parts.push("同時進行（実況・解説なし）");
    else if (rd.concurrent === false) parts.push("順番に進行");
    if (rd.start) parts.push(fmtDT(rd.start_base || rd.start) + " 開始予定" + (rd.start_base ? shiftTag(rd.start_base, rd.start, rd.shift) : ""));
    return parts.join("・");
  }
  function roundCol(cls, title, fmt, body, note) {
    var c = el("section", "round " + cls);
    var h = el("h2", null, title);
    if (fmt) h.appendChild(el("small", null, fmt));
    c.appendChild(h);
    if (note !== undefined) c.appendChild(el("div", "rnote", note));
    var col = el("div", "col");
    body.forEach(function (b) { col.appendChild(b); });
    c.appendChild(col);
    return c;
  }

  function renderNow(data) {
    var bar = document.getElementById("nowbar");
    bar.replaceChildren();
    var live = data.matches.filter(function (m) {
      return m.team_a && m.team_b && !m.bye && (m.status === "in_progress" || m.status === "extension" || m.status === "undecided");
    });
    if (data.phase === "registration") {
      bar.className = "nowbar hidden";                 // 登録受付中の「◯ / ◯ チーム」は、ページの真ん中に大きく出ているので、ここでは重ねて出さない
    } else if (data.champion) {
      bar.className = "nowbar champion";
      bar.textContent = "🏆 優勝　" + data.champion.name;
    } else if (live.length) {
      bar.className = "nowbar";
      bar.appendChild(el("span", "lbl", "NOW"));
      live.slice(0, 3).forEach(function (m) {
        var it = el("span", "item");
        it.appendChild(el("span", null, sideName(m, "a") + " vs " + sideName(m, "b")));
        var nx = m.status === "undecided" ? "管理者判断待ち" : (m.next ? "次：" + m.next : "");
        if (nx) it.appendChild(el("span", "next", nx));
        bar.appendChild(it);
      });
      var dc = delayChip(data.delay_min);                              // いま、遅れている（早まっている）ときは、何分かを書く
      if (dc) bar.appendChild(dc);
    } else {
      bar.className = "nowbar idle";
      bar.textContent = "次の試合をお待ちください";
      var dc2 = delayChip(data.delay_min);
      if (dc2) { bar.appendChild(document.createTextNode("　")); bar.appendChild(dc2); }
    }
  }

  // ── 詳細ページ ──
  function halfRow(h) {
    var tr = el("tr");
    tr.appendChild(el("td", null, h.half_label));
    tr.appendChild(el("td", null, h.hunter.name));
    tr.appendChild(el("td", "num", h.hangs + "吊り　" + h.hunter_points + "pt"));
    tr.appendChild(el("td", null, h.survivor.name));
    tr.appendChild(el("td", "num", h.escapes + "逃げ　" + h.survivor_points + "pt"));
    tr.appendChild(el("td", "num", h.time || ""));
    return tr;
  }
  function halvesTable(halves) {
    var t = el("table"), thead = el("thead"), hr = el("tr");
    ["", "ハンター", "吊り", "サバイバー", "逃げ", "時間"].forEach(function (x) { hr.appendChild(el("th", null, x)); });
    thead.appendChild(hr); t.appendChild(thead);
    var tb = el("tbody");
    halves.forEach(function (h) { tb.appendChild(halfRow(h)); });
    t.appendChild(tb);
    return t;
  }
  function detailCard(m) {
    var c = el("div", "dcard");
    var head = el("div", "dhead");
    head.appendChild(el("span", "dtitle", m.round_name + "　" + sideName(m, "a") + " vs " + sideName(m, "b")));
    head.appendChild(el("span", "dsub", m.format + " · " + m.status_label));
    if (m.winner) head.appendChild(el("span", "dsub", "勝者：" + sideName(m, m.winner) + "（" + m.reason + "）"));
    var cast = casterLine(m);
    if (cast) { var cs = el("span", "dsub"); cs.appendChild(cast); head.appendChild(cs); }
    c.appendChild(head);
    var body = el("div", "dbody");
    m.sets.forEach(function (s) {
      var box = el("div", "dset"), sh = el("div", "sh");
      sh.appendChild(el("span", null, "第" + s.set_no + "セット"));
      if (s.complete) {
        var res = s.result === "draw" ? "引き分け" : sideName(m, s.result) + " 勝利";
        sh.appendChild(el("span", "res" + (s.result === "draw" ? "" : " w"), res));
        sh.appendChild(el("span", "tot", sideName(m, "a") + " " + s.points.a + " - " + s.points.b + " " + sideName(m, "b")));
      } else {
        sh.appendChild(el("span", "res", "前半戦のみ"));
      }
      box.appendChild(sh);
      box.appendChild(halvesTable(s.halves));
      body.appendChild(box);
    });
    if (m.extension) {
      var eb = el("div", "dset"), eh = el("div", "sh");
      eh.appendChild(el("span", "tag-ext", "延長戦"));
      if (m.extension.winner) eh.appendChild(el("span", "res w", sideName(m, m.extension.winner) + " 勝利"));
      else if (m.extension.undecided) eh.appendChild(el("span", "res", "時間まで同一・管理者判断待ち"));
      else if (m.extension.need_time) eh.appendChild(el("span", "res", "時間の入力待ち"));
      eb.appendChild(eh);
      if (m.extension.halves.length) eb.appendChild(halvesTable(m.extension.halves));
      if (m.extension.reason) eb.appendChild(el("div", "reason", m.extension.reason));
      body.appendChild(eb);
    }
    if (!m.sets.length && !m.extension) body.appendChild(el("div", "none", m.by_dq ? "失格により確定（結果の登録なし）" : "まだ結果は登録されていません。"));
    c.appendChild(body);
    return c;
  }

  // チーム登録受付中（抽選前）の画面
  function renderRegistration(data, bracket) {
    bracket.className = "regboard";
    var count = el("div", "count");
    count.appendChild(document.createTextNode("チーム登録受付中"));
    count.appendChild(el("b", null, String(data.registered_teams)));
    count.appendChild(document.createTextNode("/ " + data.team_count + " チーム"));
    bracket.appendChild(count);
    bracket.appendChild(el("div", "hint", "全チームがそろうと、組み合わせを抽選します"));
    var grid = el("div", "teamgrid");
    // 多いチームでも1画面に収まるよう、7行までに収まる列数にする（16チーム以下は4列のまま）
    var cols = Math.max(4, Math.ceil(data.team_count / 7));
    grid.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    var cellH = cols <= 5 ? 66 : cols <= 8 ? 46 : 32;
    var fs = cols <= 5 ? 26 : cols <= 8 ? 19 : 14;
    for (var i = 0; i < data.team_count; i++) {
      var t = data.teams[i];
      var cell = el("div", "teamcell" + (t ? "" : " empty"));
      cell.style.height = cellH + "px";
      cell.style.fontSize = fs + "px";
      cell.appendChild(el("span", "orn", "✧"));
      if (t) { cell.appendChild(el("span", "ab", t.abbr)); cell.appendChild(el("span", "tn", t.name)); }
      else cell.textContent = "募集中";
      grid.appendChild(cell);
    }
    bracket.appendChild(grid);
  }

  // トーナメント表（ラウンド数・試合数は大会ごとに変わる）
  function renderBracket(data, bracket) {
    var rounds = data.rounds;
    ROUNDS = rounds.length;
    var byRound = {};
    data.matches.forEach(function (m) { (byRound[m.round] = byRound[m.round] || []).push(m); });
    bracket.className = "bracket" + (ROUNDS >= 4 ? " wide" : "");
    // ラウンドが増えるほど列を細くして、1920px（余白を除いて1800px）に収める。5ラウンド＝17〜32チーム、6ラウンド＝33〜64チーム
    var champW = ROUNDS >= 4 ? 260 : 300, gap = ROUNDS >= 6 ? 24 : 40;
    var colW = Math.floor((1800 - champW - gap * ROUNDS) / ROUNDS);
    bracket.style.gap = gap + "px";
    bracket.style.setProperty("--rw", (ROUNDS <= 2 ? 560 : Math.min(460, colW)) + "px");
    rounds.forEach(function (rd) {
      var ms = byRound[rd.round] || [];
      var isFinal = rd.round === ROUNDS;
      var body = [];
      if (isFinal) {
        ms.forEach(function (m) { body.push(slot(matchCard(m))); });
      } else {
        for (var i = 0; i < ms.length; i += 2) {
          body.push(group(ms.slice(i, i + 2).map(matchCard)));      // 2試合ずつ束ねて次のラウンドへ線をつなぐ
        }
      }
      var cls = "r" + rd.round + (rd.round === 1 ? " first" : "") + (isFinal ? " final" : "") +
                (ms.length > 16 ? " dense xdense xxdense" : ms.length > 8 ? " dense xdense" : ms.length > 4 ? " dense" : "");
      bracket.appendChild(roundCol(cls, isFinal ? "決勝" : rd.name, rd.format, body, roundNote(rd)));
    });
    var box = el("div", "box" + (data.champion ? "" : " empty"));
    box.appendChild(el("span", "orn", "✧"));
    box.appendChild(el("div", "trophy", "🏆"));
    box.appendChild(el("div", "label", "CHAMPION"));
    var csrc = data.champion ? logoSrc(data.champion) : null;                 // CHAMPIONの文字の下に、優勝チームのロゴ
    if (csrc) { var cl = el("img", "clogo"); cl.src = csrc; cl.alt = ""; box.appendChild(cl); }
    box.appendChild(el("div", "cname", data.champion ? data.champion.name : "未定"));
    if (EMBED && data.champion && champPlayers.length) {
      var cps = el("div", "cplayers");
      champPlayers.forEach(function (n) { cps.appendChild(el("span", null, n)); });
      box.appendChild(cps);
    }
    bracket.appendChild(roundCol("champ", "優勝", "", [slot(box)], ""));
  }

  // チーム登録受付中（抽選前）だけ、「登録状況」と「予定のトーナメント表」を、タブで切り替える
  function renderTabs(data) {
    var box = document.getElementById("tabs");
    box.replaceChildren();
    if (data.phase !== "registration") { box.className = "tabs hidden"; return; }
    box.className = "tabs";
    [["reg", "👥 登録状況"], ["plan", "📋 予定のトーナメント表"]].forEach(function (p) {
      var b = el("button", p[0] === tab ? "on" : "", p[1]);
      b.type = "button";
      b.addEventListener("click", function () { tab = p[0]; last = null; if (curData) render(curData); });
      box.appendChild(b);
    });
  }

  function render(data) {
    if (!data) return;
    document.getElementById("updated").textContent = "更新 " + (data.generated_at || "").replace("T", " ").slice(0, 19);
    curData = data;
    lastRendered = data;
    ensureLogos(data.logos);
    var sig = JSON.stringify([data.phase, data.title, data.matches, data.teams, data.champion, data.theme, data.design, data.rounds, data.delay_min, data.logos, logosVer, tab, champPlayers]);
    if (sig === last) return;
    last = sig;
    applyTheme(data.theme);
    document.documentElement.setAttribute("data-design", data.design || "rock");
    var title = data.title || "トーナメント表";
    document.getElementById("title").textContent = title;
    document.getElementById("dtitle").textContent = title + "　試合結果の詳細";
    document.title = title;
    document.getElementById("sub").textContent =
      data.team_count ? "SINGLE ELIMINATION · " + data.team_count + " TEAMS" : "SINGLE ELIMINATION";

    var bracket = document.getElementById("bracket");
    bracket.replaceChildren();
    var det = document.getElementById("details");
    det.replaceChildren();

    if (data.phase === "none" || !data.rounds || !data.rounds.length) {
      bracket.className = "bracket";
      bracket.appendChild(el("div", "msg", "大会の準備中です"));
      document.getElementById("nowbar").className = "nowbar idle";
      document.getElementById("nowbar").textContent = "";
      det.appendChild(el("div", "none", "現在の大会はまだありません。"));
      return;
    }
    renderTabs(data);
    if (data.phase === "registration" && tab !== "plan") renderRegistration(data, bracket);
    else renderBracket(data, bracket);                       // 抽選前でも、「予定のトーナメント表」タブなら、対戦カード未定のまま、予定の表を見せる
    renderNow(data);
    if (data.phase === "registration" && tab === "plan") {
      var nb = document.getElementById("nowbar");
      nb.className = "nowbar idle"; nb.textContent = "📋 予定の表です（対戦カードは、抽選のあとに決まります）";
    }

    var any = false;
    data.matches.forEach(function (m) {
      if (m.bye) return;
      if (m.sets.length || m.extension || m.by_dq) { det.appendChild(detailCard(m)); any = true; }
    });
    if (!any) det.appendChild(el("div", "none", "まだ登録された結果はありません。"));
  }
  // Firebase Realtime Database は、空の配列・null・空の値を保存しない（読み出すと項目ごと消える）ので、
  // 外部のデータ置き場から読んだデータは、描画の前に「あるはずの項目」を補ってから使う。
  function normalize(d) {
    d.teams = d.teams || []; d.rounds = d.rounds || []; d.matches = d.matches || [];
    if (d.champion === undefined) d.champion = null;
    if (d.theme === undefined) d.theme = null;
    function fillHalf(h) {
      ["hunter", "survivor", "hunter_side", "time_sec", "time"].forEach(function (k) { if (h[k] === undefined) h[k] = null; });
    }
    d.matches.forEach(function (m) {
      ["team_a", "team_b", "winner", "winner_id", "extension", "next", "casters"].forEach(function (k) { if (m[k] === undefined) m[k] = null; });
      ["by_dq", "bye", "decided_by_admin", "extension_needed"].forEach(function (k) { if (m[k] === undefined) m[k] = false; });
      m.sets = m.sets || [];
      m.set_wins = m.set_wins || { a: 0, b: 0 };
      m.total_points = m.total_points || { a: 0, b: 0 };
      if (m.reason === undefined) m.reason = "";
      m.sets.forEach(function (s) {
        s.halves = s.halves || [];
        if (s.points === undefined) s.points = null;
        if (s.result === undefined) s.result = null;
        s.halves.forEach(fillHalf);
      });
      if (m.extension) {
        m.extension.halves = m.extension.halves || [];
        if (m.extension.winner === undefined) m.extension.winner = null;
        m.extension.halves.forEach(fillHalf);
      }
    });
    return d;
  }
  function load() {
    // 公開サイト用：ページのURLの ?t=（大会ごとの12文字）を見て、その大会のデータだけを外部のJSONから読む（window.TOURNAMENT_DATA_BASE）。
    // 12文字以外（空・短い・記号入り）は、読みに行かない。大会の一覧は存在しない。
    var dataUrl = window.TOURNAMENT_DATA_URL || null;
    if (window.TOURNAMENT_DATA_BASE) {
      var key = params.get("t") || "";
      if (!/^[A-Za-z0-9]{12}$/.test(key)) {
        if (last === null) {
          document.getElementById("bracket").replaceChildren(el("div", "msg", "このページは、大会のURL（主催者から案内されたもの）から開いてください。"));
        }
        return;
      }
      dataUrl = window.TOURNAMENT_DATA_BASE + key + ".json";
    }
    if (dataUrl) {
      var u = dataUrl;
      fetch(u + (u.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (data) { if (data) render(normalize(data)); })
        .catch(function () {
          if (last === null) {
            document.getElementById("bracket").replaceChildren(el("div", "msg", "大会のデータを読み込めませんでした。しばらくしてからもう一度開いてください。"));
          }
        });
      return;
    }
    var s = document.createElement("script");
    s.src = "tournament.js?t=" + Date.now();
    s.onload = function () { render(window.TOURNAMENT_DATA); s.remove(); };
    s.onerror = function () {
      s.remove();
      if (last === null) {
        var b = document.getElementById("bracket");
        b.replaceChildren(el("div", "msg", "大会のデータがまだありません。しばらくしてからもう一度開いてください（管理者の方：Botを起動して、Discordで大会を作成すると自動で作られます）。"));
      }
    };
    document.head.appendChild(s);
  }

  load();
  setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
