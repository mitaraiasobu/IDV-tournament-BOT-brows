<header><div class="hd"><div class="tt"><div class="sm" id="title">大会ルール</div><div class="now" id="now"></div></div>
  <div class="bt"><button type="button" id="entrybtn" hidden aria-label="エントリー">📝<span class="lb"> エントリー</span></button><button type="button" id="sharebtn" hidden aria-label="共有">🔗<span class="lb"> 共有</span></button><button type="button" id="themebtn" aria-label="ライトモード・ダークモード" title="ライトモード・ダークモード">☀</button><button type="button" id="menubtn" hidden aria-label="メニュー">☰ メニュー</button></div></div></header>
<main id="main"><div class="msg" id="msg">読み込んでいます…</div></main>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<script src="rbfmt.js"></script>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search), key = params.get("t") || "";
  var D = null, TAB = 0, SIG = "", Q = "";
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } return null; }
  function hash(s) { var h = 0; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
  function toast(t) { var b = document.getElementById("toast"); b.textContent = t; b.hidden = false; clearTimeout(toast.tm); toast.tm = setTimeout(function () { b.hidden = true; }, 3000); }

  // ── ライト・ダーク ──
  function applyTheme(t) { if (t === "light") document.documentElement.setAttribute("data-theme", "light"); else document.documentElement.removeAttribute("data-theme"); document.getElementById("themebtn").textContent = t === "light" ? "🌙" : "☀"; }
  var THEME = store("rc_theme") === "light" ? "light" : "dark"; applyTheme(THEME);
  document.getElementById("themebtn").addEventListener("click", function () { THEME = THEME === "light" ? "dark" : "light"; applyTheme(THEME); store("rc_theme", THEME); });

  // ── 読んだ印（この端末に。中身が変わったら、もう一度未読） ──
  function isRead(s) { return RBF.isRead(key, s); }                                   // 読んだ印は、エントリーのページと共通（rbfmt.js）
  function setRead(s, v) { RBF.setRead(key, s, v); }
  function allProg() { return RBF.progress(key, D); }
  function entryAttn() { try { return parseInt(localStorage.getItem("rc_attn:" + key) || "0", 10) || 0; } catch (e) { return 0; } }       // エントリーのページの！の数（エントリーのページが、書いておく）
  function tabFlag(t) {                                                              // そのタブに！：読んでいない（変わった）セクション・まだ見ていない変更
    if (t.builtin === "bp" || t.builtin === "bracket") return !!RBF.attention(key, D).kinds[t.builtin];
    var c = counts(t); return c[1] > 0 && c[0] < c[1];
  }
  function badge() {                                                                 // 右上の「☰ メニュー」に！（どれかのタブ・エントリーのページに、見るものがある）
    var any = D && (RBF.attention(key, D).any || entryAttn() > 0), b = document.getElementById("menubtn");
    b.textContent = "☰ メニュー" + (any ? " ❗" : "");
  }
  function bang() { var e = el("span", "bang", "❗"); return e; }
  function dateText(iso) { var d = new Date(iso); return isNaN(d) ? "" : (d.getMonth() + 1) + "/" + d.getDate() + " " + ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
  function changeBox(kind, title) {                                                  // BAN/PICK・トーナメント表のタブ：最近の変更（変更前と変更後）。まだ見ていないものを、目立たせる
    var list = RBF.kindChanges(D, kind), seen = RBF.seenId(key, kind), box = el("div", "chgbox");
    if (!list.length) return null;
    box.appendChild(el("div", "t", "📝 " + title + "の最近の変更"));
    list.slice().reverse().forEach(function (c) {
      var d = el("details", "chgitem"), isNew = c.id > seen; d.open = isNew;
      var sm = el("summary"); if (isNew) sm.appendChild(bang()); sm.appendChild(el("span", "", " " + c.label + "　" + dateText(c.at)));
      d.appendChild(sm);
      d.appendChild(el("div", "cl", "変更前")); var b0 = el("div", "cb"); b0.appendChild(mdRender(c.before || "（なし）")); d.appendChild(b0);
      d.appendChild(el("div", "cl", "変更後")); var b1 = el("div", "cb"); b1.appendChild(mdRender(RBF.markChanges(c.before, c.after) || "（なくなりました）")); d.appendChild(b1);
      box.appendChild(d);
    });
    return box;
  }
  function allRead() { var p = allProg(); return p.total > 0 && p.read >= p.total; }
  function backUrl() {                                                                // エントリーのページから来たとき：戻る先（同じサイトの、エントリーのページだけ）
    try { var b = localStorage.getItem("rb_back:" + key); if (!b) return ""; var u = new URL(b, location.href); return u.origin === location.origin && /\/recruit\.html$/.test(u.pathname) ? u.href : ""; } catch (e) { return ""; }
  }
  function showReady() {                                                              // 全部読み終わった：エントリーできる状態になりました！
    var old = document.getElementById("ready"); if (old) old.remove();
    var w = el("div"); w.id = "ready"; var b = el("div", "bx");
    b.appendChild(el("div", "big", "🎉 エントリーできる状態になりました！"));
    b.appendChild(el("div", "sm", "大会ルールを、すべて読みました。"));
    var r = el("div", "btns"), bu = backUrl();
    if (bu) { var go = el("button", "go", "エントリーに進む"); go.type = "button"; go.addEventListener("click", function () { location.href = bu; }); r.appendChild(go); }
    var cl = el("button", "", bu ? "もう少し見る" : "閉じる"); cl.type = "button"; cl.addEventListener("click", function () { w.remove(); }); r.appendChild(cl);
    b.appendChild(r); w.appendChild(b); document.body.appendChild(w);
  }
  function allBar() {                                                                 // 全体の読み終わり具合（エントリーの条件）
    var p = allProg(), box = el("div", "allbar");
    if (!p.total) return box;
    if (p.read >= p.total) {
      var seenK = "rb_ready_seen:" + key, seen = false;                                // 一度だけ出して、あとは、出さない
      try { seen = localStorage.getItem(seenK) === "1"; if (!seen) localStorage.setItem(seenK, "1"); } catch (e) { /* そのまま */ }
      if (seen) return box;
      box.className = "allbar ok"; box.appendChild(el("div", "t", "✓ すべて読みました。エントリーできる状態です。"));
      var bu = backUrl(); if (bu) { var g = el("button", "go", "エントリーに進む"); g.type = "button"; g.addEventListener("click", function () { location.href = bu; }); box.appendChild(g); }
    } else {
      box.appendChild(el("div", "t", "エントリーするには、すべてのルールを「既読」にしてください　全体：" + p.read + " / " + p.total));
      var bar = el("div", "pb"), fill = el("div", "pf"); fill.style.width = Math.round(p.read * 100 / p.total) + "%"; bar.appendChild(fill); box.appendChild(bar);
    }
    return box;
  }
  function tabs() { return (D && D.tabs) || []; }
  function counts(t) { var n = 0, r = 0; (t.sections || []).forEach(function (s) { n++; if (isRead(s)) r++; }); return [r, n]; }

  // ── 本文：書き方（記号）から、見た目を（rbfmt.js）。[[タブの名前]]は、そのタブへのリンク ──
  function goTabByName(name) {
    var n = String(name).trim(), ts = tabs(), i;
    for (i = 0; i < ts.length; i++) if (ts[i].title === n) return goTab(i);
    for (i = 0; i < ts.length; i++) if (ts[i].title.indexOf(n) >= 0) return goTab(i);
    toast("「" + n + "」のタブは見つかりません。");
  }
  function mdRender(text) { return RBF.render(text, { tabLink: goTabByName }); }
  function paint() {                                                                  // ページの色（背景色・装飾色）。決めていなければ、いつもの色（ライト・ダークも選べる）
    var t = RBF.applyTheme(document.documentElement, D && D.theme), custom = !!t;
    document.documentElement.style.colorScheme = t ? (t.dark ? "dark" : "light") : "";
    document.getElementById("themebtn").hidden = custom;
    if (custom) document.documentElement.removeAttribute("data-theme"); else applyTheme(THEME);
  }

  // ── メニュー（タブ・検索） ──
  function closeMenu() { document.getElementById("menu").hidden = true; }
  function drawMenu() {
    var mw = document.getElementById("menu"); mw.textContent = "";
    var pn = el("div", "pn"), ph = el("div", "ph"); ph.appendChild(el("span", "", "☰ 大会ルールの目次"));
    var x = el("button", "", "✕"); x.type = "button"; x.setAttribute("aria-label", "閉じる"); x.addEventListener("click", closeMenu); ph.appendChild(x); pn.appendChild(ph);
    var q = el("input"); q.type = "search"; q.placeholder = "🔍 ルールを検索（例：遅刻、延長戦）"; q.value = Q; pn.appendChild(q);
    var hits = el("div", "hits"); pn.appendChild(hits);
    function search() {
      hits.textContent = ""; var w = Q.trim(); if (!w) return;
      var n = 0;
      tabs().forEach(function (t, ti) {
        (t.sections || []).forEach(function (s, si) {
          var txt = (s.title || "") + "\n" + (s.body || ""), p = txt.indexOf(w);
          if (p < 0 || n >= 30) return; n++;
          var b = el("button"); b.type = "button"; b.appendChild(el("div", "", t.title + " ＞ " + s.title));
          var a = Math.max(0, p - 20); b.appendChild(el("div", "w", (a > 0 ? "…" : "") + txt.slice(a, p + w.length + 30).replace(/\n/g, " ") + "…"));
          b.addEventListener("click", function () { goTab(ti, si); }); hits.appendChild(b);

        card.appendChild(el("div", "ftm", fhm(c.d) + dayLb(c.d, base))); if (e.cat) card.appendChild(el("div", "fcat", e.cat));
        card.appendChild(el("div", "fmain", e.main)); if (e.sub) card.appendChild(el("div", "fsub", e.sub)); if (e.dur) card.appendChild(el("div", "fdur", "⏱ " + e.dur));
        var w = el("div", "who"); (e.who || "").split("").forEach(function (k) { w.appendChild(el("span", k, { t: "チーム", c: "キャスター", m: "モデレーター" }[k])); }); if (w.childNodes.length) card.appendChild(w);
        cells[main].appendChild(card);
        (e.who || "").split("").forEach(function (k) { if (k === main || !cells[k]) return; var ref = el("div", "fref"); ref.appendChild(el("b", "", fhm(c.d))); ref.appendChild(el("span", "", " " + e.main)); cells[k].appendChild(ref); });
      });
    });
    box.appendChild(f);
  }

  // ── 表示 ──
  function render(openIdx) {
    var main = document.getElementById("main"), ts = tabs();
    document.getElementById("title").textContent = ((ts[TAB] || {}).builtin === "home" && D.title ? D.title + "｜" : "") + "大会ルール";          // 大会名は、ホームだけに出す
    document.title = (D.title ? D.title + "｜" : "") + "大会ルール";
    document.getElementById("menubtn").hidden = false; document.getElementById("sharebtn").hidden = false; document.getElementById("entrybtn").hidden = !entryHref();
    main.textContent = "";
    if (!ts.length) { main.appendChild(el("div", "msg", "まだ、大会ルールはありません。")); document.getElementById("now").textContent = ""; return; }
    if (TAB >= ts.length) TAB = 0;
    var t = ts[TAB];
    main.style.maxWidth = t.builtin === "bracket" || t.builtin === "flow" ? "1600px" : "";                     // トーナメント表は、横に広く（大きいまま）
    document.getElementById("now").textContent = t.title;
    badge();
    main.appendChild(allBar());
    navButtons(main);                                                                  // ◀ 戻る・次へ ▶ は、上にも
    if (t.builtin === "bp" || t.builtin === "bracket") {                             // BAN/PICK（このページの中に描く）・トーナメント表（大きいまま、枠なしで中に）
      var lastId = 0; RBF.kindChanges(D, t.builtin).forEach(function (c) { if (c.id > lastId) lastId = c.id; }); if (lastId) RBF.setSeen(key, t.builtin, lastId);          // 見たので、次からは！をつけない（この表示では、まだ目立つ）
      if (t.builtin === "bp") { var bw = el("div", "bpw"); main.appendChild(bw); drawBp(bw); }
      else {
        var kw = el("div", "bkw");                                                     // 上：予定の表／下：登録状況（チーム登録受付中だけ。タブにせず、上下に並べる）
        [["a", "plan", "📋 予定の表"], ["b", "reg", "👥 登録状況"]].forEach(function (x) {
          var f = el("iframe"); f.src = "index.html?t=" + encodeURIComponent(key) + "&inbook=1&tab=" + x[1] + "&fid=" + x[0]; f.title = x[2]; f.setAttribute("scrolling", "no");
          f.setAttribute("data-fid", x[0]); f.style.height = (BK_H[x[0]] || 600) + "px"; if (x[0] === "b" && BK_PH && BK_PH !== "registration") f.style.display = "none"; kw.appendChild(f);
        });
        main.appendChild(kw);
      }
      navButtons(main); return;
    }
    if (t.builtin === "home") { drawHome(main, t.home); return; }
    if (t.builtin === "flow") { var fw = el("div", "flw"); main.appendChild(fw); drawFlow(fw, t.flow || {}); navButtons(main); return; }
    var secs = t.sections || [], c = counts(t);
    var tl = el("div", "tools"); tl.appendChild(el("span", "prog", secs.length ? (c[0] === c[1] ? "✓ このタブは全部読みました" : "読んだ：" + c[0] + " / " + c[1]) : ""));
    var oa = el("button", "", "すべて開く"); oa.type = "button"; oa.addEventListener("click", function () { main.querySelectorAll("details.sec").forEach(function (d) { d.open = true; }); });
    var ca = el("button", "", "すべてたたむ"); ca.type = "button"; ca.addEventListener("click", function () { main.querySelectorAll("details.sec").forEach(function (d) { d.open = false; }); });
    tl.appendChild(oa); tl.appendChild(ca);
    if (c[0]) { var rs = el("button", "", "未読に戻す"); rs.type = "button"; rs.addEventListener("click", function () { if (!confirm("このタブのルールを、すべて未読に戻しますか？")) return; secs.forEach(function (s) { setRead(s, false); }); render(); }); tl.appendChild(rs); }
    main.appendChild(tl);
    if (!secs.length) main.appendChild(el("div", "msg", "このタブには、まだ何も書かれていません。"));
    var firstUnread = -1; secs.forEach(function (s, i) { if (firstUnread < 0 && !isRead(s)) firstUnread = i; });
    secs.forEach(function (s, i) {
      var rd = isRead(s), d = el("details", "sec" + (rd ? " read" : "")); d.id = "sec" + i;
      var chg = rd ? null : RBF.changeFor(D, t, s);                                       // 読んでいない・変わったところ：赤い下線と、変更前の文章
      d.open = openIdx != null ? openIdx === i : (rd || secs.length <= 3 || i === firstUnread || !!chg);   // 未読の最初の1つ・変わったところを開いておく（少なければ、未読は全部）
      var sm = el("summary"); sm.appendChild(el("span", "arw", "▶")); sm.appendChild(el("span", "st", s.title));
      if (chg) sm.appendChild(el("span", "rd chgb", "❗ 変更あり"));
      sm.appendChild(el("span", "rd " + (rd ? "ok" : "new"), rd ? "✓ 読んだ" : "未読"));
      d.appendChild(sm);
      var bd = el("div", "body"); if (s.prizes) bd.appendChild(prizeCards()); if (s.body || chg) bd.appendChild(mdRender(chg ? RBF.markChanges(chg.before, chg.after) : s.body));
      if (chg) {
        var bf = el("details", "chgitem"); bf.appendChild(el("summary", "", "📝 変更前の文章を見る（" + dateText(chg.at) + " に変更）"));
        var bb = el("div", "cb"); bb.appendChild(mdRender(chg.before || "（この見出しは、新しく足されました）")); bf.appendChild(bb); bd.appendChild(bf);
      }
      var dn = el("div", "done"), db = el("button", rd ? "" : "go", rd ? "たたむ" : "✓ 読み終わった（たたむ）"); db.type = "button";
      db.addEventListener("click", function () {
        var wasAll = allRead(); setRead(s, true); var nx = -1; for (var j = i + 1; j < secs.length; j++) if (!isRead(secs[j])) { nx = j; break; }
        render(nx >= 0 ? nx : -1);
        var tgt = document.getElementById("sec" + (nx >= 0 ? nx : i)); if (tgt) tgt.scrollIntoView({ behavior: "smooth", block: "start" });
        var tabDone = false;
        if (nx < 0) { var c2 = counts(t); if (c2[0] === c2[1]) { tabDone = true; toast("✓ 「" + t.title + "」を全部読みました。" + (TAB < tabs().length - 1 ? "次のタブへ進みます。" : "")); } }
        if (!wasAll && allRead()) showReady();
        else if (tabDone && TAB < tabs().length - 1) setTimeout(function () { goTab(TAB + 1); }, 700);          // このタブを全部読んだ：自動で次のタブへ
      });
      dn.appendChild(db); bd.appendChild(dn); d.appendChild(bd); main.appendChild(d);
    });
    navButtons(main);
  }
  function navButtons(main) {                                                         // 前のタブ・次のタブ
    var ts = tabs(), nv = el("div", "nav");
    if (TAB > 0) { var p = el("button", "", "◀ 戻る"); p.title = ts[TAB - 1].title; p.type = "button"; p.addEventListener("click", function () { goTab(TAB - 1); }); nv.appendChild(p); } else nv.appendChild(el("span"));
    if (TAB < ts.length - 1) { var n = el("button", "go", "次へ ▶"); n.title = ts[TAB + 1].title; n.type = "button"; n.addEventListener("click", function () { goTab(TAB + 1); }); nv.appendChild(n); }
    main.appendChild(nv);
  }

  // ── 読み込み（ときどき読み直す。変わったら、表示し直す） ──
  var hm = /tab=(\d+)/.exec(location.hash); if (hm) TAB = parseInt(hm[1], 10) || 0;
  window.addEventListener("popstate", function () {                                    // ブラウザの「戻る」「進む」：そのときのタブを開く（前に開いていた別のサイトに戻らない）
    var m = /tab=(\d+)/.exec(location.hash); TAB = m ? (parseInt(m[1], 10) || 0) : 0;
    if (D) { closeMenu(); render(); window.scrollTo(0, 0); }
  });
  function load() {
    var base = window.TOURNAMENT_DATA_BASE;
    if (!base) { document.getElementById("msg").textContent = "データの場所が設定されていません。"; return; }
    if (!/^[A-Za-z0-9]{12}$/.test(key)) { document.getElementById("msg").textContent = "このページは、大会のURL（主催者から案内されたもの）から開いてください。"; return; }
    function tick() {
      fetch(base + key + "/rulebook.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        if (!d || !d.tabs) { if (!D) document.getElementById("msg").textContent = "まだ、大会ルールはありません。"; return; }
        var sg = JSON.stringify(d); if (sg === SIG) return; SIG = sg; BP = null;
        var first = !D; D = d; paint();
        if (first) { var nm = /name=([^&]+)/.exec(location.hash); if (nm) { var want = decodeURIComponent(nm[1]); (d.tabs || []).some(function (t, i) { if (String(t.title || "").indexOf(want) >= 0) { TAB = i; return true; } return false; }); } }   // 大会設定ブラウザの「実際のページを見る」：そのタブを開く
        if (first || !document.getElementById("menu").hidden || !document.querySelector("iframe")) render();   // 中に出したトーナメント表は、開き直さない
      }).catch(function () { if (!D) document.getElementById("msg").textContent = "データを読み込めませんでした。しばらくしてからもう一度開いてください。"; });
    }
    tick(); setInterval(tick, 10000);                                                  // ルールを直したら、すぐ反映（10秒おき・変わった通知・開き直したとき）
    document.addEventListener("visibilitychange", function () { if (!document.hidden) tick(); });
    window.addEventListener("focus", function () { tick(); badge(); });
    try { var es = new EventSource(base + key + "/rulebook.json"); var nu = function () { tick(); }; es.addEventListener("put", nu); es.addEventListener("patch", nu); } catch (e) { /* 使えないときは、10秒おきだけ */ }
  }
  if (window.RULEBOOK_DATA_EMBEDDED) { D = window.RULEBOOK_DATA_EMBEDDED; paint(); render(); } else load();
})();
