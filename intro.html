<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>紹介動画</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  @font-face { font-family: "GName"; src: url("Fantasy/ki_kokumin/font_1_kokumr_1.00_rls.ttf") format("truetype"); }
  @font-face { font-family: "GName"; src: url("Fantasy/MODI_kurobara-gothic_2018_1102/kurobara-gothic-heavy.ttf") format("truetype");
               unicode-range: U+3005-3006, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF; }
  @font-face { font-family: "GBody"; src: url("Fantasy/MODI_kurobara-gothic_2018_1102/kurobara-gothic-regular.ttf") format("truetype");
               unicode-range: U+3005-3006, U+3400-4DBF, U+4E00-9FFF, U+F900-FAFF; }
  @font-face { font-family: "Hangyaku"; src: url("Fantasy/hangyaku-font/Hangyaku-0vRGR.ttf") format("truetype"); }
  :root { --bg:#2f253c; --accent:#4229ff; --gold: color-mix(in srgb, var(--accent) 78%, white); --cream:#f3e9f6; --red:#ff6b8a;
          --fa:"Hangyaku","GName","Yu Mincho",serif; --fh:"GName","Yu Mincho",serif; --fb:"GBody","GName","Yu Mincho",serif; }   /* GBody＝漢字だけ細く（かなは、下の GName の刻明朝に任せる）／fa＝タイトル・数字／fh＝見出し・ラベル（太い）／fb＝ふつうの文（漢字を、かなに合わせて細く） */
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#05030a; overflow:hidden; cursor:none; }
  #stage { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; overflow:hidden; color:var(--cream); font-family:var(--fb); }
  #bg { position:absolute; inset:-60px; background:url("Gothic/background.png") center/cover; animation:drift 60s ease-in-out infinite alternate; }
  @keyframes drift { from{transform:scale(1.02) translate(0,0)} to{transform:scale(1.12) translate(-30px,-14px)} }
  #shade { position:absolute; inset:0; background:radial-gradient(ellipse at 50% 45%, rgba(20,10,40,.35), rgba(5,2,12,.88) 100%), linear-gradient(color-mix(in srgb,var(--accent) 14%,transparent),color-mix(in srgb,var(--accent) 14%,transparent)); }
  #mist { position:absolute; left:-20%; right:-20%; bottom:-10%; height:45%; background:radial-gradient(ellipse at 50% 100%, rgba(200,170,255,.22), transparent 70%); animation:mist 9s ease-in-out infinite alternate; filter:blur(20px); }
  @keyframes mist { from{transform:translateX(-4%)} to{transform:translateX(4%)} }
  #stars { position:absolute; inset:0; }
  .sp { position:absolute; width:8px; height:8px; background:#fff; border-radius:50%; box-shadow:0 0 14px 4px color-mix(in srgb,var(--gold) 70%,white); opacity:0; animation:tw var(--d) ease-in-out infinite; animation-delay:var(--l); }
  @keyframes tw { 0%,100%{opacity:0;transform:translateY(0) scale(.4)} 50%{opacity:.9;transform:translateY(-30px) scale(1)} }
  .bat { position:absolute; width:46px; height:20px; background:#000; opacity:.8; clip-path:polygon(0 30%,18% 0,32% 40%,50% 20%,68% 40%,82% 0,100% 30%,80% 100%,50% 55%,20% 100%); animation:fly var(--t) linear infinite; animation-delay:var(--l); }
  @keyframes fly { from{transform:translate(-120px,var(--y0)) scale(var(--s))} to{transform:translate(2040px,var(--y1)) scale(var(--s))} }
  #vig { position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 260px 40px #000; }

  /* 場面：全部重ねて、出る場面だけ見せる */
  .scene { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; padding:56px 90px 60px; opacity:0; visibility:hidden; }
  .scene.center { justify-content:center; padding-top:0; }
  .scene.on { visibility:visible; animation:sceneIn 1.1s ease forwards; }
  .scene.out { animation:sceneOut .9s ease forwards; }
  @keyframes sceneIn { from{opacity:0;filter:blur(14px)} to{opacity:1;filter:blur(0)} }
  @keyframes sceneOut { from{opacity:1;filter:blur(0)} to{opacity:0;filter:blur(14px)} }
  .body { flex:1; min-height:0; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding-bottom:10px; }

  .ornament { font-family:var(--fa); color:var(--gold); letter-spacing:.5em; text-shadow:0 0 18px color-mix(in srgb,var(--accent) 80%,transparent); }
  .gold { color:var(--gold); }
  .rule { width:900px; height:50px; background:url("Gothic/line.png") center/contain no-repeat; filter:drop-shadow(0 0 8px var(--accent)); flex:none; }
  .hd { text-align:center; flex:none; }
  .hd .ornament { font-size:30px; }
  .hd h2 { font-family:var(--fa); font-weight:400; font-size:86px; line-height:1.15; margin:4px 0 0; color:#fff; text-shadow:0 0 24px var(--accent), 0 0 50px var(--accent), 0 3px 0 #000; letter-spacing:.1em; }
  .rise { opacity:0; transform:translateY(26px); }
  .on .rise { animation:rise 1s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:var(--a,0s); }
  @keyframes rise { to{opacity:1;transform:none} }
  .zoom { opacity:0; transform:scale(.86); }
  .on .zoom { animation:zoom 1.6s cubic-bezier(.2,.8,.2,1) forwards; animation-delay:var(--a,0s); }
  @keyframes zoom { to{opacity:1;transform:none} }

  /* 枠のパネル（コウモリの羽根の枠）。画像の外側は透明なので、中身は内側に収める */
  .panel { position:relative; width:var(--w,1280px); height:var(--h,820px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:60px 200px 70px; }
  .panel::before { content:""; position:absolute; inset:0; background:url("Gothic/banner.png") center/100% 100% no-repeat; filter:drop-shadow(0 0 28px color-mix(in srgb,var(--accent) 70%,transparent)); }
  .panel > * { position:relative; }

  /* かざり枠のカード（レースの縁・二重線） */
  .card { position:relative; text-align:center; padding:34px 26px; background:linear-gradient(180deg,rgba(30,18,50,.92),rgba(12,6,24,.94)); border:3px double var(--gold); box-shadow:0 0 36px color-mix(in srgb,var(--accent) 55%,transparent), inset 0 0 40px rgba(0,0,0,.6); }
  .card::before,.card::after { content:""; position:absolute; left:0; right:0; height:9px; background:radial-gradient(circle at 50% 100%,transparent 6px,var(--gold) 6.5px 8px,transparent 8.5px) left top/18px 9px repeat-x; }
  .card::before { top:5px; } .card::after { bottom:5px; transform:scaleY(-1); }
  .card h3 { font-family:var(--fa); font-weight:400; font-size:48px; margin:6px 0 14px; color:#fff; text-shadow:0 0 18px var(--accent); letter-spacing:.06em; line-height:1.25; }
  .card p { margin:0; font-size:38px; line-height:1.6; }
  .card p.s { font-size:32px; color:color-mix(in srgb,var(--cream) 80%,transparent); }
  .tag { display:inline-block; font-family:var(--fh); font-size:36px; color:#fff; border:2px solid var(--gold); padding:0 20px; margin-bottom:12px; background:color-mix(in srgb,var(--accent) 35%,transparent); }
  .tag.red { border-color:var(--red); background:rgba(255,107,138,.22); }
  .row { display:flex; gap:26px; width:100%; justify-content:center; align-items:stretch; }
  .col { display:flex; flex-direction:column; gap:22px; width:100%; align-items:center; }
  b.hl { color:var(--gold); font-weight:400; font-family:var(--fh); }
  .big { font-family:var(--fa); color:#fff; text-shadow:0 0 30px var(--accent), 0 0 60px var(--accent); line-height:1; }

  /* 1 タイトル */
  .title { font-family:var(--fa); font-weight:400; font-size:130px; line-height:1.15; margin:8px 0 0; color:#fff; text-shadow:0 0 30px var(--accent), 0 0 70px var(--accent), 0 4px 0 #000; letter-spacing:.06em; }
  .sub { font-size:40px; margin-top:12px; letter-spacing:.2em; color:var(--gold); }
  .by { font-size:34px; margin-top:10px; letter-spacing:.2em; }

  /* 3 数 */
  .stat { text-align:center; } .stat b { display:block; font-family:var(--fa); font-weight:400; font-size:230px; line-height:1; color:#fff; text-shadow:0 0 30px var(--accent), 0 0 60px var(--accent); }
  .stat span { font-size:46px; letter-spacing:.25em; color:var(--gold); }
  .times { font-family:var(--fa); font-size:80px; color:var(--gold); padding-bottom:70px; }

  /* トーナメント表（ライブブラウザの開会と同じ動き：1カードずつ出て、カメラが追い、線が決勝へ伸びて、優勝のマークが輝く） */
  .bktag { position:absolute; left:70px; top:46px; z-index:5; font-family:var(--fa); font-size:60px; letter-spacing:.1em; color:#fff; text-shadow:0 0 22px var(--accent), 0 3px 0 #000; }
  .bktag::before { content:"✠ "; color:var(--gold); font-size:40px; }
  .op-br { position:absolute; left:0; top:0; transform-origin:0 0; transition:transform 1.2s cubic-bezier(.45,0,.2,1); will-change:transform; }
  .pc { position:absolute; display:flex; align-items:center; gap:12px; padding:0 14px 0 12px; opacity:0; transform:translateY(16px) scale(.94); transition:opacity .3s ease, transform .35s cubic-bezier(.2,.9,.2,1);
        background:linear-gradient(180deg,rgba(30,18,50,.94),rgba(12,6,24,.95)); border:2px solid var(--gold); border-left-width:7px; box-shadow:0 8px 22px rgba(0,0,0,.5), 0 0 18px color-mix(in srgb,var(--accent) 40%,transparent); }
  .pc.on { opacity:1; transform:none; }
  .pc .pn { font-family:var(--fa); color:var(--gold); flex:none; margin:0 auto; text-shadow:0 0 12px var(--accent); }
  .pc.bye { border-color:color-mix(in srgb,var(--gold) 35%,transparent); box-shadow:none; background:rgba(20,10,40,.55); }
  .ph { position:absolute; top:0; text-align:center; opacity:0; transform:translateY(-14px); transition:opacity .45s ease, transform .5s cubic-bezier(.2,.9,.2,1); }
  .ph.on { opacity:1; transform:none; }
  .ph .nm { font-family:var(--fa); font-size:44px; color:var(--gold); letter-spacing:.08em; text-shadow:0 0 16px var(--accent); }
  .ph .dt { font-family:var(--fa); font-size:78px; line-height:1.05; color:#fff; text-shadow:0 0 24px var(--accent), 0 0 48px var(--accent), 0 3px 0 #000; white-space:nowrap; }
  .ph .dt small { font-size:.42em; color:var(--gold); margin-left:6px; }
  .ph .tm { font-family:var(--fh); font-size:36px; color:var(--cream); margin-top:2px; }
  .ph .fm { display:inline-block; margin-top:8px; font-family:var(--fa); font-size:34px; color:#fff; border:2px solid var(--gold); padding:0 18px; }
  .ph .live { font-size:26px; }
  .op-lines { position:absolute; left:0; top:0; overflow:visible; }
  .op-ln { stroke-dasharray:9999; stroke-dashoffset:9999; fill:none; stroke:var(--gold); stroke-width:7; stroke-linecap:round; stroke-linejoin:round; filter:drop-shadow(0 0 8px var(--accent)); }
  .op-troph { position:absolute; width:300px; height:380px; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; opacity:0; transform:scale(.4); transition:opacity 1s ease, transform 1.3s cubic-bezier(.2,1.4,.3,1); }
  .op-troph.on { opacity:1; transform:none; }
  .op-troph .rays { position:absolute; left:50%; top:220px; width:560px; height:560px; margin:-280px 0 0 -280px; border-radius:50%; background:radial-gradient(circle, rgba(255,210,63,.5), transparent 65%); }
  .op-troph .cup { position:relative; font-size:190px; line-height:1; filter:drop-shadow(0 0 34px rgba(255,210,63,.95)); animation:pulse 1.7s ease-in-out infinite; }
  .op-troph .lbl { position:relative; font-family:var(--fa); font-size:40px; letter-spacing:.4em; color:#ffd23f; text-shadow:0 0 18px rgba(255,210,63,.8); margin-top:8px; }

  /* 参加チーム */
  .stat { text-align:center; } .stat b { display:block; font-family:var(--fa); font-weight:400; font-size:230px; line-height:1; color:#fff; text-shadow:0 0 30px var(--accent), 0 0 60px var(--accent); }
  .stat span { font-size:46px; letter-spacing:.25em; color:var(--gold); }
  .live { display:inline-block; font-family:var(--fa); font-size:30px; color:#fff; background:#d4204a; padding:0 16px; letter-spacing:.2em; box-shadow:0 0 18px rgba(255,60,100,.7); animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50%{opacity:.55} }
  .fit { width:100%; display:flex; flex-direction:column; align-items:center; transform-origin:50% 50%; }

  /* 大会ルールの「BAN/PICK」タブと同じ中身（全試合共通のルール・ラウンドごと） */
  .rc { width:100%; text-align:left; padding:26px 34px; background:linear-gradient(180deg,rgba(30,18,50,.92),rgba(12,6,24,.94)); border:3px double var(--gold); box-shadow:0 0 36px color-mix(in srgb,var(--accent) 50%,transparent), inset 0 0 40px rgba(0,0,0,.6); }
  .rc h4 { margin:0 0 14px; font-family:var(--fa); font-weight:400; font-size:42px; color:#fff; text-shadow:0 0 16px var(--accent); letter-spacing:.06em; }
  .rw { display:flex; gap:22px; align-items:flex-start; padding:12px 0; border-top:1px solid color-mix(in srgb,var(--gold) 35%,transparent); }
  .rw:first-of-type { border-top:0; }
  .rw .lb { flex:none; min-width:250px; font-family:var(--fh); font-size:32px; color:var(--gold); line-height:1.4; }
  .rw .lb.ban { color:var(--red); } .rw .lb.req { color:#9fe6c4; }
  .rw .tx { font-size:32px; line-height:1.5; }
  .bgrid { display:flex; gap:14px; flex-wrap:wrap; }
  .bc { font-size:30px; padding:2px 18px; border:2px solid var(--gold); background:rgba(20,10,40,.85); white-space:nowrap; }
  .bc b { font-family:var(--fa); font-weight:400; font-size:44px; color:#fff; margin:0 6px; text-shadow:0 0 12px var(--accent); }
  .cc { display:flex; flex-wrap:wrap; gap:12px 22px; align-items:center; }
  .cp { display:inline-flex; align-items:center; gap:10px; padding:5px 18px 5px 6px; border:2px solid var(--gold); background:rgba(20,10,40,.85); border-radius:60px; font-size:30px; }
  .cp.ban { border-color:var(--red); background:rgba(255,107,138,.18); } .cp.req { border-color:#9fe6c4; } .cp.allow { border-color:#b79bff; }
  .cp small { font-size:24px; color:var(--gold); }
  .plus { font-family:var(--fa); font-size:36px; color:var(--gold); margin:0 2px; }
  .combo { display:inline-flex; align-items:center; gap:8px; }
  .face { position:relative; flex:none; width:64px; height:64px; border-radius:50%; overflow:hidden; background:#241838; border:2px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:var(--fh); font-size:28px; }
  .face img { position:absolute; height:100%; left:50%; top:0; transform:translateX(-50%); } .face img.fit { transform:none; }
  .hero { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; margin-bottom:22px; }
  .hi { font-family:var(--fh); font-size:36px; padding:4px 26px; border:2px solid var(--gold); background:rgba(20,10,40,.85); }
  .hi.nm { font-family:var(--fa); font-size:48px; color:#fff; background:color-mix(in srgb,var(--accent) 40%,transparent); text-shadow:0 0 14px var(--accent); }
  .hi.live { color:#fff; background:#d4204a; border-color:#ff7a99; animation:none; font-size:34px; letter-spacing:.1em; }
  .cols { display:flex; gap:28px; width:100%; align-items:flex-start; }
  .steps { margin:0; padding:0; list-style:none; counter-reset:st; }
  .steps li { counter-increment:st; display:flex; gap:16px; align-items:center; padding:8px 0; font-size:32px; line-height:1.4; }
  .steps li::before { content:counter(st); flex:none; width:46px; height:46px; line-height:42px; text-align:center; font-family:var(--fa); font-size:30px; border:2px solid var(--gold); background:color-mix(in srgb,var(--accent) 40%,transparent); color:#fff; }
  .steps li.h::before { border-color:var(--red); background:rgba(255,107,138,.25); } .steps li.s::before { border-color:#b79bff; background:rgba(120,90,255,.3); }

  /* 賞品（賞品タブと同じカード） */
  .pzg { display:grid; grid-template-columns:repeat(2,730px); gap:24px; justify-content:center; width:100%; }
  .pzc { position:relative; padding:22px 28px; border:3px double var(--pz); background:linear-gradient(180deg,rgba(30,18,50,.92),rgba(12,6,24,.94)); box-shadow:0 0 34px color-mix(in srgb,var(--pz) 45%,transparent), inset 0 0 40px rgba(0,0,0,.6); text-align:left; }
  .pzc.k1 { --pz:#f5c542; grid-column:1 / -1; } .pzc.k2 { --pz:#c4cfe0; } .pzc.kany { --pz:#6fc3ff; } .pzc.kmvp { --pz:#c48bff; } .pzc.wide { grid-column:1 / -1; }
  .pzc .top { display:flex; align-items:center; gap:18px; margin-bottom:10px; }
  .pzc .medal { flex:none; width:76px; height:76px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:46px; border:3px solid var(--pz); background:color-mix(in srgb,var(--pz) 22%,transparent); }
  .pzc .plb { font-family:var(--fa); font-size:52px; color:var(--pz); text-shadow:0 0 16px color-mix(in srgb,var(--pz) 60%,transparent); letter-spacing:.06em; }
  .pzc .it { display:flex; align-items:center; gap:18px; padding:10px 14px; margin-top:8px; background:rgba(255,255,255,.05); }
  .pzc .it .ic { flex:none; font-size:42px; }
  .pzc .who { font-family:var(--fh); font-size:28px; color:var(--gold); }
  .pzc .gift { font-size:40px; line-height:1.35; color:#fff; overflow-wrap:anywhere; }
  /* 日程（ラウンドの日時だけを大きく） */
  .tl { display:flex; gap:20px; width:100%; justify-content:center; }
  .tl .card { padding:40px 14px 34px; }
  .tl .d { font-family:var(--fa); font-size:124px; line-height:1; color:#fff; text-shadow:0 0 24px var(--accent), 0 0 48px var(--accent); }
  .tl .w { font-size:46px; color:var(--gold); margin-top:8px; letter-spacing:.15em; }
  .tl .t { font-family:var(--fa); font-size:64px; margin-top:6px; color:#fff; }
  .tl .l { margin-top:22px; font-size:44px; line-height:1.4; font-family:var(--fh); }
  .tl .l small { display:block; font-size:30px; color:color-mix(in srgb,var(--cream) 78%,transparent); margin-top:6px; }

  .end-title { font-family:var(--fa); font-size:120px; margin:12px 0 0; color:#fff; text-shadow:0 0 34px var(--accent),0 0 90px var(--accent),0 4px 0 #000; letter-spacing:.06em; line-height:1.3; text-align:center; }
  .end-sub { font-size:48px; margin-top:22px; letter-spacing:.3em; color:var(--gold); }
  #bar { position:absolute; left:0; bottom:0; height:4px; width:0; background:var(--gold); opacity:.55; box-shadow:0 0 12px var(--accent); }
  #fade { position:absolute; inset:0; background:#000; opacity:1; pointer-events:none; transition:opacity 1.6s ease; }
</style>

<body>
<script>window.TOURNAMENT_DATA_BASE = "https://idv-tournament-bot-realtime-default-rtdb.asia-southeast1.firebasedatabase.app/tournament/"; window.PAGE_KIND = "intro";</script>
<!-- 大会の紹介動画（公開ページ）。BOTが書いた intro.json（core/intro_video.py）だけを見て、場面を並べる。
     URLの ?t=（公開用の12文字）で、window.TOURNAMENT_DATA_BASE ＋ その12文字 /intro.json を読む。映すだけ（1920x1080・自動で最後まで流れて、くりかえす）。
     クリック／スペースで最初から。#once で1回だけ。画像・フォントは、公開サイトの Gothic・Fantasy フォルダ（配信ページのゴシックと同じ）。 -->
<div id="stage">
  <div id="bg"></div><div id="shade"></div><div id="mist"></div><div id="stars"></div><div id="bats"></div><div id="vig"></div>
  <div id="scenes"></div>
  <div id="msg" style="position:absolute;left:0;right:0;top:480px;text-align:center;font-size:40px;color:var(--gold)"></div>
  <div id="bar"></div>
  <div id="fade"></div>
</div>
<script>
(function () {
  "use strict";
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  var D = null, els = [], plan = [], timers = [], t0 = 0, TOTAL = 1, ONCE = /[#&?]once/.test(location.href);
  var key = ((/[?&]t=([A-Za-z0-9]+)/.exec(location.search) || [])[1] || "");

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function fmt(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b class="hl">$1</b>'); }                       // **強調** だけ
  function pd(s) { var m = /(\d+)-(\d+)-(\d+)T(\d+):(\d+)/.exec(s || ""); if (!m) return null;
    return { m: +m[2], d: +m[3], w: WD[new Date(+m[1], +m[2] - 1, +m[3]).getDay()], hm: m[4] + ":" + m[5], key: (+m[2]) + "/" + (+m[3]) }; }
  function A(i, base) { return ((base == null ? .6 : base) + i * .4).toFixed(2) + "s"; }
  function head(orn, h) { return '<section class="scene"><div class="hd"><div class="ornament rise" style="--a:.1s">' + orn + '</div><h2 class="rise" style="--a:.25s">' + esc(h) + '</h2><div class="rule rise" style="--a:.5s;margin:0 auto"></div></div>'; }

    from = from || 0; clearAll(); build();
    var fade = document.getElementById("fade"); fade.style.opacity = 1; t0 = performance.now();
    timers.push(setTimeout(function () { fade.style.opacity = 0; }, 100));
    var at = 300;
    plan.forEach(function (s, i) {
      if (i < from) return;
      var e = els[i];
      timers.push(setTimeout(function () { e.className += " on"; if (s[3]) s[3](e); }, at));
      timers.push(setTimeout(function () { e.className += " out"; }, at + s[0] - 900));
      at += s[0];
    });
    timers.push(setTimeout(function () { fade.style.opacity = 1; }, at - 1200));
    timers.push(setTimeout(function () { if (ONCE) return; load(); }, at + 800));              // 終わったら、最新のデータを読み直して、最初から
  }
  function load() {
    function go(d) { if (d && d.title) { D = d; document.getElementById("msg").textContent = ""; play(); } else if (!D) document.getElementById("msg").textContent = "まだ、紹介動画の内容がありません。"; else play(); }
    if (window.INTRO_DATA_EMBEDDED) return go(window.INTRO_DATA_EMBEDDED);
    var base = window.TOURNAMENT_DATA_BASE;
    if (!base) { document.getElementById("msg").textContent = "データの場所が設定されていません。"; return; }
    if (!/^[A-Za-z0-9]{12}$/.test(key)) { document.getElementById("msg").textContent = "このページは、大会のURL（主催者から案内されたもの）から開いてください。"; return; }
    fetch(base + key + "/intro.json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(go)
      .catch(function () { if (D) play(); else document.getElementById("msg").textContent = "データを読み込めませんでした。しばらくしてからもう一度開いてください。"; });
  }
  // 背景のかざり
  (function () {
    var st = document.getElementById("stars"), i, e;
    for (i = 0; i < 46; i++) { e = document.createElement("i"); e.className = "sp"; e.style.left = (Math.random() * 100) + "%"; e.style.top = (Math.random() * 100) + "%";
      e.style.setProperty("--d", (4 + Math.random() * 6).toFixed(1) + "s"); e.style.setProperty("--l", (-Math.random() * 10).toFixed(1) + "s");
      e.style.width = e.style.height = (3 + Math.random() * 7).toFixed(1) + "px"; st.appendChild(e); }
    var bt = document.getElementById("bats");
    for (i = 0; i < 7; i++) { e = document.createElement("i"); e.className = "bat"; e.style.left = 0; e.style.top = 0; var y0 = 80 + Math.random() * 500;
      e.style.setProperty("--y0", y0 + "px"); e.style.setProperty("--y1", (y0 - 120 + Math.random() * 240) + "px"); e.style.setProperty("--s", (.5 + Math.random() * 1.1).toFixed(2));
      e.style.setProperty("--t", (16 + Math.random() * 14).toFixed(1) + "s"); e.style.setProperty("--l", (-Math.random() * 26).toFixed(1) + "s"); bt.appendChild(e); }
  })();
  function fit() { var s = Math.min(innerWidth / 1920, innerHeight / 1080), st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")"; st.style.left = ((innerWidth - 1920 * s) / 2) + "px"; st.style.top = ((innerHeight - 1080 * s) / 2) + "px"; }
  addEventListener("resize", fit); fit();
  (function tick() { var b = document.getElementById("bar"); b.style.width = Math.min(100, (performance.now() - t0) / (TOTAL + 1100) * 100) + "%"; requestAnimationFrame(tick); })();
  addEventListener("click", function () { play(); });
  addEventListener("keydown", function (e) { if (e.code === "Space" || e.key === "Enter") { e.preventDefault(); play(); } });
  window.__intro = { play: play, start: function (n) { D = window.INTRO_DATA_EMBEDDED; play(n); } };                                                                      // 確認用（場面の番号から流す）
  load();
})();
</script>
</body>
</html>
