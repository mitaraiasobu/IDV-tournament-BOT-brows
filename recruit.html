<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メンバー募集</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: https://cdn.discordapp.com https://media.discordapp.net; connect-src https:; base-uri 'none'; form-action 'none'">
<!--
  メンバー募集のページ（どの大会にも共通の1枚）。
  ・URLの ?t=（募集用の12文字）で、window.TOURNAMENT_DATA_BASE ＋ その12文字 .json（BOTが書いた、募集中のチーム）を読む。
  ・エントリーパネルの「🙋 メンバー応募」で出る本人用のURLは、# のあとに「ユーザー番号.閲歴.陣営.サバイバーの段位.ハンターの段位.本人の印」が入る。
    本人の印で、データの中の「本人ごとの様子」（応募・所属・リーダーのチーム）を見る（データには、Discordの番号を入れない）。
  ・リーダー：チーム情報（チーム名・略称・カラー・ロゴ・メンバー・リーダーを譲る）と、応募情報（募集の内容。制限は、決めなければ「制限なし」）。チームの選手：脱退できる。それ以外：応募（第一希望〜第三希望）・取り消し・希望の並べ替え。
  ・送った依頼は、受け箱へ（BOTが処理して、結果を書き戻す）。
-->
<style>
  :root { color-scheme: dark; --bg: #12141b; --panel: #1b1e28; --panel2: #232838; --text: #e8eaf2; --sub: #9aa1b5; --line: #2c3142; --accent: #6f95ff; --ok: #45c07c; --ng: #ff7070; --warn: #ffb020;
          --link: #ffd54a; --hit: #ffd54a; --hit-bg: rgba(255,213,74,.12); }                  /* 基本はダーク */
  :root[data-theme="light"] { color-scheme: light; --bg: #f6f7fb; --panel: #ffffff; --panel2: #eef1f8; --text: #1d2130; --sub: #5e6478; --line: #dde1ec; --accent: #3b6ee8; --ok: #1f9d55; --ng: #d64545; --warn: #b26b00;
          --link: #1a56c4; --hit: #b38f00; --hit-bg: rgba(230,184,0,.15); }
  a { color: var(--link); font-weight: 700; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", system-ui, sans-serif; }
  header { padding: 18px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 18px 0 8px; }
  .lead { color: var(--sub); font-size: 13px; line-height: 1.6; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .grid .card { cursor: pointer; } .grid .card:hover { border-color: var(--accent); }
  .card.nofit { opacity: .55; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .team { font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { flex: none; font-weight: 800; color: var(--accent); }
  .badges { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; flex: 0 1 auto; max-width: 78%; }
  .top .team { min-width: 4em; }
  .badge { font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 999px; white-space: nowrap; border: 1px solid; }
  .badge.beg { color: var(--ok); border-color: var(--ok); } .badge.ext { color: var(--warn); border-color: var(--warn); } .badge.lock { color: var(--sub); border-color: var(--line); }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: auto; padding-top: 4px; }
  .mem-n { font-size: 12px; font-weight: 800; color: var(--accent); }
  .card.match { border: 2px solid var(--hit); } .badge.hit { color: var(--hit); border-color: var(--hit); background: var(--hit-bg); }
  .chips label.hit { border-color: var(--hit); box-shadow: 0 0 0 1px var(--hit); }
  details.more { grid-column: 1 / -1; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; } details.more summary { cursor: pointer; font-weight: 800; }
  details.more .frm { margin-top: 8px; }
  .chips.sm label { font-size: 12px; padding: 2px 8px; }
  .modes { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 8px; }
  .modes button { padding: 18px 12px; font-size: 17px; font-weight: 800; line-height: 1.5; } .modes button small { display: block; font-size: 12px; font-weight: 400; color: var(--sub); margin-top: 4px; }
  .modes button.go small { color: #eef; }
  @media (max-width: 640px) { .modes { grid-template-columns: 1fr; } }
  details.sec { margin-top: 18px; } details.sec > summary { cursor: pointer; list-style: none; display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; color: var(--sub); padding: 6px 0; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: ""; flex: 1; border-top: 2px solid var(--line); }
  details.sec > summary .cnt { font-size: 12px; font-weight: 700; } details.sec > summary .arw { font-size: 12px; }
  details.sec > .grid { margin-top: 8px; }
  .nmem { flex: none; font-size: 12px; font-weight: 800; color: var(--accent); border: 1px solid var(--accent); border-radius: 6px; padding: 0 6px; margin-right: 6px; }
  .top .tl { display: flex; align-items: baseline; min-width: 0; }
  .top1 { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; } .top1 .badges { max-width: none; justify-content: flex-start; flex: 1; }
  .tname { font-weight: 800; font-size: 15px; overflow-wrap: anywhere; line-height: 1.4; }
  a.btnlink { display: inline-block; background: var(--accent); color: #fff !important; font-weight: 800; padding: 10px 22px; border-radius: 8px; text-decoration: none; font-size: 17px; }
  .wants { font-size: 12px; color: var(--text); overflow-wrap: anywhere; }
  .title { font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
  .wanted { font-size: 13px; overflow-wrap: anywhere; }
  .sum { font-size: 13px; color: var(--sub); white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .lim { font-size: 12px; color: var(--sub); }
  .tag { font-size: 12px; font-weight: 800; } .tag.ok { color: var(--ok); } .tag.ng { color: var(--ng); } .tag.warn { color: var(--warn); }
  .empty { color: var(--sub); padding: 30px 0; text-align: center; }
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .dlg { background: var(--panel); color: var(--text); border-radius: 14px; max-width: 600px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; border: 1px solid var(--line); }
  .dlg h2 { margin: 0 0 6px; font-size: 19px; overflow-wrap: anywhere; }
  .full { white-space: pre-wrap; font-size: 14px; line-height: 1.6; margin: 8px 0; overflow-wrap: anywhere; }
  textarea, input, select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); color-scheme: light dark; }
  textarea { width: 100%; min-height: 90px; } input[type=text], input[type=password] { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 800; }
  button.danger { border-color: var(--ng); color: var(--ng); font-weight: 800; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 13px; margin-top: 8px; } .msg.ok { color: var(--ok); } .msg.ng { color: var(--ng); }
  .wish { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
  .wish b { min-width: 4.5em; } .wish .st { font-size: 13px; color: var(--sub); flex: 1; }
  .frm { display: grid; grid-template-columns: 180px 1fr; gap: 10px 14px; align-items: center; }
  .frm label { font-weight: 700; font-size: 14px; } .frm .hint { grid-column: 2; font-size: 12px; color: var(--sub); margin-top: -6px; }
  .bad { border-color: var(--ng) !important; color: var(--ng); }
  .mine-note { margin: 6px 0; padding: 6px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--warn); color: var(--warn); font-weight: 800; font-size: 13px; }
  .hdr { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .notice { background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 14px; margin-bottom: 14px; font-weight: 800; font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chips label { font-weight: 400; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
  .chips label.on { border-color: var(--accent); background: var(--panel2); font-weight: 700; }
  .guide { position: fixed; inset: 0; z-index: 40; background: rgba(0, 0, 0, .72); }       /* 案内：ほかは押せない */
  #profbtn { position: relative; } #profbtn.guide-on { z-index: 41; box-shadow: 0 0 0 4px var(--accent), 0 0 24px var(--accent); background: var(--accent); color: #fff; font-weight: 800; }
  .guide-arrow { position: fixed; font-size: 36px; color: #fff; animation: gbounce 1s infinite; }
  .guide-tip { position: fixed; max-width: 280px; background: var(--panel); color: var(--text); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 14px; font-weight: 800; font-size: 16px; }
  @keyframes gbounce { 50% { transform: translateY(-8px); } }
  .cau { font-size: 13px; } .frm .cau { grid-column: 2; } .cau summary { cursor: pointer; color: var(--warn); font-weight: 800; } .cau div { margin: 6px 0 0; line-height: 1.6; }
  .subwarn { margin: 8px 0; padding: 10px 12px; border-radius: 10px; border: 2px solid var(--ng); background: var(--panel2); color: var(--ng); font-weight: 800; font-size: 15px; }
  .kv { display: grid; grid-template-columns: 11em 1fr; gap: 6px 12px; font-size: 14px; margin: 8px 0; } .kv b { color: var(--sub); font-weight: 700; } .kv span { overflow-wrap: anywhere; white-space: pre-wrap; }
  .ask { margin: 10px 0; padding: 12px; border-radius: 10px; border: 2px solid var(--warn); font-weight: 800; color: var(--warn); }
  .logos { display: flex; gap: 16px; flex-wrap: wrap; } .logos figure { margin: 0; text-align: center; font-size: 12px; color: var(--sub); } .logos img { width: 96px; height: 96px; border-radius: 10px; border: 1px solid var(--line); display: block; margin-bottom: 4px; }
  #busy { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 60; max-width: calc(100% - 32px); padding: 14px 20px; border-radius: 12px;
          background: var(--panel); border: 3px solid var(--accent); color: var(--text); font-weight: 800; font-size: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.35); display: flex; gap: 12px; align-items: center; }
  #busy.ok { border-color: var(--ok); color: var(--ok); } #busy.ng { border-color: var(--ng); color: var(--ng); }
  #busy .spin { width: 22px; height: 22px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 0.8s linear infinite; flex: none; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .imgask { position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .imgask .box { background: var(--panel); border-radius: 14px; padding: 16px; max-width: 520px; width: 100%; text-align: center; border: 1px solid var(--line); }
  .imgask img { max-width: 100%; max-height: 60vh; border-radius: 8px; border: 1px solid var(--line); }
  .imgask .q { font-size: 18px; font-weight: 800; margin: 12px 0; } .imgask button { font-size: 17px; padding: 10px 28px; }
  .mem { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); } .mem span { flex: 1; }
  .prev { max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--line); } .badtxt { color: var(--ng); font-size: 12px; font-weight: 700; }
  @media (max-width: 640px) { .frm { grid-template-columns: 1fr; } .frm .hint, .frm .cau { grid-column: 1; } .kv { grid-template-columns: 1fr; } .kv b { margin-top: 4px; } }
</style>
</head>

<script>
(function () {

  var params = new URLSearchParams(location.search);

  var frag = (location.hash || "").replace(/^#/, "") || params.get("f") || "";

  if (frag) {

      var last = p[p.length - 1] || "", isKey = /^k[0-9a-f]{32}$/.test(last), mid = p.slice(3, p.length - 2);

  function U() { return me && D && D.users ? D.users[me.mark] || null : null; }
  var PF_SEEN = "";
  function hexb(h) { var a = new Uint8Array(h.length / 2); for (var i = 0; i < a.length; i++) a[i] = parseInt(h.substr(i * 2, 2), 16); return a; }
  function unwrapProf() {                                                            // ページのデータの中の、本人の選手情報（本人用のURLの鍵で開く。いつも、いまの基本情報）

    if (!me || !me.key) return Promise.resolve(false);

      fr1.appendChild(fs); fr1.appendChild(fc); d.appendChild(fr1);
      d.appendChild(liveMsg());
      show(); return;
    }
    if (step === "confirm" && can) {                                                   // 確認：この情報で応募するか
      d.appendChild(el("h2", "", "📋 応募の確認｜" + t.name));
      d.appendChild(el("div", "ask", "この情報でよろしいですか？必ず最新の情報にしてください！"));
      profileSummary(d);
      var q = me.prof || {}, te = q.te || {}, tc = q.tc || {};
      var pw = null;
      if (t.locked) { d.appendChild(el("div", "lead", "🔒 このチームは、パスワードつきの募集です。リーダーから聞いたパスワードを入れてください。")); pw = el("input"); pw.type = "text"; pw.maxLength = 20; d.appendChild(pw); }
      var order = act.map(function (w) { return w.team; }).concat([t.id]);
      if (act.length) {                                                                // 2つ目からは、希望の順を並べ替える（先に応募したチームが上）
        d.appendChild(el("div", "lead", "希望の順を決めてください（ふつうは、先に応募したチームが上です）。"));
        var ol = el("div"); d.appendChild(ol);
        var draw = function () {
          ol.textContent = "";
          order.forEach(function (id, i) {
            var r = el("div", "wish"); r.appendChild(el("b", "", "第" + (i + 1) + "希望")); r.appendChild(el("span", "st", teamName(id) + (id === t.id ? "（今回の応募）" : "")));
            var up = el("button", "", "↑"); up.type = "button"; up.disabled = i === 0; up.addEventListener("click", function () { var x = order[i - 1]; order[i - 1] = order[i]; order[i] = x; draw(); });
            var dn = el("button", "", "↓"); dn.type = "button"; dn.disabled = i === order.length - 1; dn.addEventListener("click", function () { var x = order[i + 1]; order[i + 1] = order[i]; order[i] = x; draw(); });
            r.appendChild(up); r.appendChild(dn); ol.appendChild(r);
          });
        };
        draw();
      }
      var rc = el("div", "row");
      var ok = el("button", "go", BUSY ? "送信中…" : "✅ OK（この内容で応募する）"); ok.type = "button"; ok.disabled = BUSY;
      ok.addEventListener("click", function () {
        if (!q.img) { setMsg("ng", "⚠ プロフィール画像が登録されていません。「✏ 編集する」から登録してください。"); return; }
        var miss = missingCustom(D.player_fields, tc).concat(missingEntry(te));
        if (miss.length) { setMsg("ng", "⚠ 入れていない項目があります（「✏ 編集する」から入れてください）：" + miss.join("、")); return; }
        ORDER = null; send({ act: "wish", team: t.id, message: te.message || "", order: act.length ? order : null, password: pw ? pw.value : "", extra_ok: t.state === "extra", custom: tc, entry: te });
      });
      var ed = el("button", "", "✏ 編集する"); ed.type = "button";
      ed.addEventListener("click", function () { BACK_TO = t.id; OPEN = null; DSTEP = null; ov.remove(); PROFOPEN = true; PF = null; openProfile(); });
      var cl0 = el("button", "", "やめる"); cl0.type = "button"; cl0.addEventListener("click", close);
      rc.appendChild(ok); rc.appendChild(ed); rc.appendChild(cl0); d.appendChild(rc);
      d.appendChild(liveMsg());
      show(); return;
    }
    d.appendChild(el("div", "count", (t.locked ? "🔒 " : "") + t.name + "　" + t.n + "/" + (t.cap || "—") + "（エントリーには" + t.min + "人から）"));
    if (t.friends) d.appendChild(el("div", "lead", "👫 友達だけの募集です。チームのリーダーから聞いたパスワードで応募できます。"));
    else { d.appendChild(el("h2", "", t.title)); d.appendChild(needBox(t, true)); }
    if ((t.wants || {}).beg) d.appendChild(el("div", "tag ok", "🔰 初心者歓迎"));
    var mt2 = matches(t); if (mt2.length) d.appendChild(el("div", "tag warn", "⭐ 条件一致：" + mt2.join("・")));
    if (!t.friends) d.appendChild(el("div", "full", t.summary || "（概要はありません）"));
    if (t.limits) d.appendChild(el("div", "lim", "制限：" + t.limits));
    var already = act.some(function (w) { return w.team === t.id; });
    var row = el("div", "row");
    if (!me && INV && (t.state === "open" || t.state === "extra")) {                   // 招待用のページ：押すと、まずDiscordに加入するようにお願いする
      var gj = el("button", "go", "このチームに応募する"); gj.type = "button"; gj.addEventListener("click", joinPrompt); row.appendChild(gj);
    }
    if (can || fOnly) {
      var go = el("button", "go", "このチームに応募する"); go.type = "button";
      go.addEventListener("click", function () { dialog(fOnly ? "faction" : t.state === "extra" ? "extra" : "confirm"); });
      row.appendChild(go);
    }
    var cl = el("button", "", "閉じる"); cl.type = "button"; cl.addEventListener("click", close);
    row.appendChild(cl); d.appendChild(row);
    if (!me && !INV) d.appendChild(el("div", "lead", "応募は、Discordのエントリーパネルの「📝 エントリー」で出る、あなた用のURLから行います。"));
    else if (already) d.appendChild(el("div", "msg ok", "このチームには、もう応募しています（上の「あなたの応募」で、様子を見られます）。"));
    else if (!u.pf_ok && !u.leader && !u.team) d.appendChild(el("div", "msg ng", "応募の前に、上の「🪪 あなたの選手情報」を確かめて、「💾 選手情報を保存」を押してください。"));
    else if (u.leader) d.appendChild(el("div", "msg ng", "チームリーダーは、ほかのチームに応募できません。"));
    else if (u.team) d.appendChild(el("div", "msg ng", "あなたは、もうチームに入っています。応募するときは、先に脱退してください。"));
    else if (!t._fit && !fOnly) d.appendChild(el("div", "msg ng", t.state === "closed" ? "このチームは、募集を締め切りました。" : t.state === "full" ? "このチームは満員です。" : t.state === "done" ? "このチームは、募集している人数がそろいました。" : !factionOk(t, me.f) ? "陣営が合いません。" : "このチームの段位・閲歴の制限に合わないため、応募できません。"));
    else if (act.length >= (D.max_wishes || 3)) d.appendChild(el("div", "msg ng", "応募できるのは、同時に" + (D.max_wishes || 3) + "チームまでです。どれかを取り消してから、応募してください。"));
    d.appendChild(liveMsg());
    show();
  }
  function load() {
    fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d) { document.getElementById("lead").textContent = "いまは、メンバー募集を受け付けていません（大会の設定・組み合わせの抽選のあとなど）。"; return; }
      D = d;
      var r = d.result;
      if (WAIT && r && r.nonce === WAIT) {
        BUSY = false; WAIT = null; ORDER = null; if (r.ok) FORM = null;
        var WASPROF = !!(PEND && PEND.kind === "prof");
        if (r.ok) { LOGO = null; TN = null; }
        if (PEND && PEND.kind === "pw") { if (r.ok) { UNLOCKED = true; PWIN = { a: "", b: "" }; PWERR = ""; try { sessionStorage.setItem("rc_ph_" + me.uid, PH); } catch (e) { /* そのまま */ } } else { PH = ""; } PEND = null; }
        if (r.ok && PEND) {
          if (PEND.kind === "prof") { var q = PEND.data; var uu = U(); if (uu) uu.pf_ok = true;
            if (BACK_TO != null) { OPEN = BACK_TO; var bt = arr(D.teams).filter(function (x) { return x.id === BACK_TO; })[0]; DSTEP = DSTEP === "fpick" && bt && bt.state === "extra" ? "extra" : "confirm"; BACK_TO = null; PROFOPEN = false; var po = document.getElementById("ov"); if (po) po.remove(); } me.prof = Object.assign({}, me.prof || {}, { n: q.n, r: q.r, g: q.g, f: q.f, sr: q.sr, hr: q.hr, sub: q.sub ? 1 : 0, why: q.why, sg: q.sg, fav: q.fav, lv: Number(q.lv), te: q._te || {}, tc: q._tc || {}, st: q.st || (me.prof || {}).st || {} });
            me.f = q.f; me.lv = Number(q.lv); me.s = q.f !== "hunter" ? rankScore(q.sr) : null; me.h = q.f !== "survivor" ? rankScore(q.hr) : null; }
          else if (PEND.kind === "img") { me.prof.img = 1; IMG = null; IMG_FAIL = false; }
          else if (PEND.kind === "imgdel") me.prof.img = 0;
          else if (PEND.kind === "delete") me.prof = null;
          LOGO = null;
          PF = null;
        }
        PEND = null;
        if (r.ok && OPEN != null && !((DSTEP === "confirm" || DSTEP === "extra") && WASPROF)) { OPEN = null; DSTEP = null; var o = document.getElementById("ov"); if (o) o.remove(); }
        IMG_FAIL = false;
        render();
        setMsg(r.ok ? "ok" : "ng", r.ok ? "✅ " + (r.note || "受け付けました。") : "⚠ " + (r.error || "できませんでした。"));
        return;
      }
      unwrapProf().then(function (changed) { if ((changed || true) && !document.getElementById("ov") && !BUSY) render(); });   // ダイアログを開いている間は、描き直さない（書いている途中を消さない）
    }).catch(function () { if (!D) document.getElementById("empty").hidden = false; });
  }
  if (!/^[A-Za-z0-9]{12}$/.test(key) || !BASE) { document.getElementById("lead").textContent = "このページは、大会のURL（エントリーパネルにあるリンク）から開いてください。"; return; }
  document.getElementById("sharebtn").addEventListener("click", sharePrompt);
  document.getElementById("profbtn").addEventListener("click", function () { endGuide(); PROFOPEN = true; PF = null; openProfile(); });
  load(); setInterval(load, 4000);
})();
</script>
