<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>メンバー募集</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https:; base-uri 'none'; form-action 'none'">
<!--
  メンバー募集のページ（どの大会にも共通の1枚）。
  ・URLの ?t=（募集用の12文字）で、window.TOURNAMENT_DATA_BASE ＋ その12文字 .json（BOTが書いた、募集中のチーム）を読む。
  ・エントリーパネルの「🙋 メンバー応募」で出る本人用のURLは、# のあとに「ユーザー番号.閲歴.陣営.サバイバーの段位.ハンターの段位.本人の印」が入る。
    本人の印で、データの中の「本人ごとの様子」（応募・所属・リーダーのチーム）を見る（データには、Discordの番号を入れない）。
  ・リーダー：募集の内容を書く（初めては、制限も含めて、すべてをまとめて）。チームの選手：脱退できる。それ以外：応募（第一希望〜第三希望）・取り消し・希望の並べ替え。
  ・送った依頼は、受け箱へ（BOTが処理して、結果を書き戻す）。
-->
<style>
  :root { --bg: #f6f7fb; --panel: #ffffff; --panel2: #eef1f8; --text: #1d2130; --sub: #5e6478; --line: #dde1ec; --accent: #3b6ee8; --ok: #1f9d55; --ng: #d64545; --warn: #c97a00; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #12141b; --panel: #1b1e28; --panel2: #232838; --text: #e8eaf2; --sub: #9aa1b5; --line: #2c3142; --accent: #6f95ff; --ok: #45c07c; --ng: #ff7070; --warn: #ffb020; } }
  :root[data-theme="dark"] { --bg: #12141b; --panel: #1b1e28; --panel2: #232838; --text: #e8eaf2; --sub: #9aa1b5; --line: #2c3142; --accent: #6f95ff; --ok: #45c07c; --ng: #ff7070; --warn: #ffb020; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: "Noto Sans JP", system-ui, sans-serif; }
  header { padding: 18px 16px 8px; max-width: 1100px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 18px; margin: 18px 0 8px; }
  .lead { color: var(--sub); font-size: 13px; line-height: 1.6; }
  main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 40px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .grid .card { cursor: pointer; } .grid .card:hover { border-color: var(--accent); }
  .card.nofit { opacity: .55; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .team { font-weight: 800; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { flex: none; font-weight: 800; color: var(--accent); }
  .title { font-size: 17px; font-weight: 800; overflow-wrap: anywhere; }
  .wanted { font-size: 13px; overflow-wrap: anywhere; }
  .sum { font-size: 13px; color: var(--sub); white-space: pre-wrap; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
  .lim { font-size: 12px; color: var(--sub); }
  .tag { font-size: 12px; font-weight: 800; } .tag.ok { color: var(--ok); } .tag.ng { color: var(--ng); } .tag.warn { color: var(--warn); }
  .empty { color: var(--sub); padding: 30px 0; text-align: center; }
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .dlg { background: var(--panel); color: var(--text); border-radius: 14px; max-width: 600px; width: 100%; max-height: 90vh; overflow: auto; padding: 18px; border: 1px solid var(--line); }
  .dlg h2 { margin: 0 0 6px; font-size: 19px; overflow-wrap: anywhere; }
  .full { white-space: pre-wrap; font-size: 14px; line-height: 1.6; margin: 8px 0; overflow-wrap: anywhere; }
  textarea, input, select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); color-scheme: light dark; }
  textarea { width: 100%; min-height: 90px; } input[type=text], input[type=password] { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  button { font: inherit; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.go { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 800; }
  button.danger { border-color: var(--ng); color: var(--ng); font-weight: 800; }
  button:disabled { opacity: .5; cursor: default; }
  .msg { font-size: 13px; margin-top: 8px; } .msg.ok { color: var(--ok); } .msg.ng { color: var(--ng); }
  .wish { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--line); }
  .wish b { min-width: 4.5em; } .wish .st { font-size: 13px; color: var(--sub); flex: 1; }
  .frm { display: grid; grid-template-columns: 180px 1fr; gap: 10px 14px; align-items: center; }
  .frm label { font-weight: 700; font-size: 14px; } .frm .hint { grid-column: 2; font-size: 12px; color: var(--sub); margin-top: -6px; }
  .bad { border-color: var(--ng) !important; color: var(--ng); }
  .mine-note { margin: 6px 0; padding: 6px 10px; border-radius: 8px; background: var(--panel2); border: 1px solid var(--warn); color: var(--warn); font-weight: 800; font-size: 13px; }
  .hdr { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .notice { background: var(--panel); border: 2px solid var(--accent); border-radius: 12px; padding: 14px; margin-bottom: 14px; font-weight: 800; font-size: 17px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; } .chips label { font-weight: 400; font-size: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 9px; cursor: pointer; }
  .chips label.on { border-color: var(--accent); background: var(--panel2); font-weight: 700; }
  .prev { max-width: 220px; max-height: 160px; border-radius: 8px; border: 1px solid var(--line); } .badtxt { color: var(--ng); font-size: 12px; font-weight: 700; }
  @media (max-width: 640px) { .frm { grid-template-columns: 1fr; } .frm .hint { grid-column: 1; } }
</style>
</head>
<body>
<script>window.TOURNAMENT_DATA_BASE = "https://idv-tournament-bot-realtime-default-rtdb.asia-southeast1.firebasedatabase.app/tournament/"; window.PAGE_KIND = "recruit";</script>
<header>
  <div class="hdr"><h1 id="ttl">メンバー募集</h1><button type="button" id="profbtn" hidden>🪪 あなたの選手情報</button></div>
  <div class="mine-note" id="minenote" hidden>🔒 このページはあなた専用です。URLを誰かに共有したりしないでください。</div>
  <div class="lead" id="lead">読み込んでいます…</div>
</header>
<main>
  <div id="mine"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>いま、メンバーを募集しているチームはありません。</div>
</main>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var key = params.get("t") || "";
  var frag = (location.hash || "").replace(/^#/, "") || params.get("f") || "";
  function decodeProf(t) {                                                           // URLに入れた、いまの選手情報（URLの # のあとは、サーバーに送られない）
    if (!t) return null;
    try { var b = atob(t.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((t.length + 3) % 4)); var o = JSON.parse(decodeURIComponent(escape(b))); return o && Object.keys(o).length ? o : null; } catch (e) { return null; }       // 名前が空でも、登録済みとして扱う
  }
  var me = null;                                                                      // 本人用のURL：ユーザー番号.閲歴.陣営.サバイバーの段位.ハンターの段位.本人の印.選手情報
  if (frag) {
    var p = frag.split(".");
    if (/^\d+$/.test(p[0] || "")) me = { uid: p[0], lv: p[1] ? Number(p[1]) : null, f: p[2] || "", s: p[3] ? Number(p[3]) : null, h: p[4] ? Number(p[4]) : null, mark: p[5] || "", prof: decodeProf(p[6] || ""), old: p.length < 7 };
  }
  var BASE = window.TOURNAMENT_DATA_BASE || "", DATA_URL = BASE + key + ".json", INBOX_URL = BASE.replace(/\/?$/, "") + "_inbox/" + key + ".json";
  var D = null, OPEN = null, BUSY = false, WAIT = null, ORDER = null, FORM = null;
  var FN = { survivor: "サバイバー", hunter: "ハンター", both: "両陣営" };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function arr(x) { return Array.isArray(x) ? x : []; }                                // 空のリストは、データ置き場（Firebase）で消えて届かない
  function U() { return me && D && D.users ? D.users[me.mark] || null : null; }
  function teamName(id) { return ((D && D.team_names) || {})[String(id)] || ("チーム" + id); }
  function needText(t) {
    var n = arr(t.need), parts = [];
    if (n[0]) parts.push("サバイバー" + n[0] + "人"); if (n[1]) parts.push("ハンター" + n[1] + "人");
    if (parts.length) return "求めている人材：" + parts.join("・") + (t.wanted ? "（" + t.wanted + "）" : "");
    if (t.state === "extra") return "余分募集：" + (FN[t.extra_faction] || "両陣営") + (t.wanted ? "（" + t.wanted + "）" : "");
    return "求めている人材：" + (t.wanted || "（人数はそろいました）");
  }
  function fits(t) {                                                                   // 自分に合うか（段位・閲歴の制限・求めている陣営）
    if (t.state !== "open" && t.state !== "extra") return false;
    if (!me) return true;
    var f = me.f || "both", n = arr(t.need);
    if (t.state === "open" && !((n[0] > 0 && (f === "survivor" || f === "both")) || (n[1] > 0 && (f === "hunter" || f === "both")))) return false;
    if (t.state === "extra" && t.extra_faction && t.extra_faction !== "both" && f !== "both" && f !== t.extra_faction) return false;
    var lv = arr(t.lv), rk = arr(t.rk);
    if ((lv[0] != null || lv[1] != null) && me.lv == null) return false;
    if (lv[0] != null && me.lv < lv[0]) return false;
    if (lv[1] != null && me.lv > lv[1]) return false;
    var mine = [];
    if (f === "survivor" || f === "both") mine.push(me.s);
    if (f === "hunter" || f === "both") mine.push(me.h);
    if (rk[0] != null || rk[1] != null) {
      for (var i = 0; i < mine.length; i++) {
        if (mine[i] == null) return false;
        if (rk[0] != null && mine[i] < rk[0]) return false;
        if (rk[1] != null && mine[i] > rk[1]) return false;
      }
    }
    return true;
  }
  function send(body, busyText) {                                                      // 受け箱へ（BOTが処理して、結果を書き戻す）
    if (BUSY || !me) return;
    BUSY = true; setMsg("", busyText || "送信中…（BOTが確認します。数秒かかります）");
    var nonce = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    WAIT = nonce; body.uid = me.uid;
    fetch(INBOX_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nonce: nonce, at: Date.now(), assignments: { _rc: body } }) })
      .then(function (r) {
        if (!r.ok) { BUSY = false; WAIT = null; setMsg("ng", "⚠ 送れませんでした（" + r.status + "）。" + (body.image ? "画像が大きすぎる可能性があります。別の画像か、小さい画像でお試しください。" : "もう一度お試しください。")); return; }
        setTimeout(function () { if (WAIT === nonce) { BUSY = false; WAIT = null; setMsg("ng", "⚠ BOTからの返事がありません。しばらくしてから、ページを開き直して確かめてください。"); } }, 60000);
      })
      .catch(function () { BUSY = false; WAIT = null; setMsg("ng", "⚠ 送れませんでした。通信を確かめて、もう一度お試しください。"); });
  }
  function setMsg(cls, text) { var ms = document.querySelectorAll(".msg.live"); for (var i = 0; i < ms.length; i++) { ms[i].className = "msg live " + cls; ms[i].textContent = text; } }
  function liveMsg() { return el("div", "msg live"); }

  // ───── リーダー：募集の内容（初めては、制限も含めて、すべてをまとめて） ─────
  var RANKS = [["", "制限なし"], ["1", "1段"], ["2", "2段"], ["3", "3段"], ["4", "4段"], ["5", "5段"], ["6", "6段"], ["7", "7段"], ["P", "最高峰"]];
  function rankCode(v) { var m = /^([1-6])-([1-5])$/.exec(v || "") || /^(7|P)\*(\d{0,4})$/.exec(v || ""); return m ? [m[1], m[2]] : ["", ""]; }
  function rankScore(v) {                                                              // 強さの順（比べるため）
    var c = rankCode(v); if (!c[0]) return null;
    if (/^[1-6]$/.test(c[0])) return (Number(c[0]) - 1) * 5 + (6 - Number(c[1]));
    return 31 + Number(c[1] || 0) / 10;
  }
  function rankOk(v) { var c = rankCode(v); if (!c[0]) return !v; if (c[0] === "P") { var n = Number(c[1]); return /^\d{2,3}$/.test(c[1]) && n >= 25; } return true; }
  function rankPick(v, put, required) {
    var c = rankCode(v), box = el("div", "row"), a = el("select");
    box.style.marginTop = "0";
    RANKS.forEach(function (r) { var o = el("option", "", r[0] ? r[1] : (required ? "選んでください" : r[1])); o.value = r[0]; if (r[0] === c[0]) o.selected = true; a.appendChild(o); });
    box.appendChild(a);
    var b;
    if (/^[1-6]$/.test(c[0])) {
      b = el("select"); [["5", "Ⅴ"], ["4", "Ⅳ"], ["3", "Ⅲ"], ["2", "Ⅱ"], ["1", "Ⅰ"]].forEach(function (x) { var o = el("option", "", x[1]); o.value = x[0]; if (x[0] === c[1]) o.selected = true; b.appendChild(o); });
      b.addEventListener("change", function () { put(c[0] + "-" + b.value); });
    } else if (c[0] === "7") {
      b = el("select"); for (var i = 0; i <= 24; i++) { var o = el("option", "", "★" + i); o.value = String(i); if (String(i) === c[1]) o.selected = true; b.appendChild(o); }
      b.addEventListener("change", function () { put("7*" + b.value); });
    } else if (c[0] === "P") {                                                          // 最高峰：星の数は、書いて入れる（25以上の2〜3桁）
      b = el("input"); b.type = "text"; b.inputMode = "numeric"; b.maxLength = 3; b.value = c[1]; b.placeholder = "★の数（25以上）"; b.style.width = "9em";
      b.addEventListener("input", function () { var d = b.value.replace(/[^0-9]/g, ""); if (d !== b.value) b.value = d; });
      b.addEventListener("change", function () { put("P*" + b.value); });
      if (!rankOk(v)) b.className = "bad";
    }
    a.addEventListener("change", function () { var d = a.value; put(!d ? "" : /^[1-6]$/.test(d) ? d + "-5" : d === "7" ? "7*0" : "P*25"); });
    if (b) box.appendChild(b);
    return box;
  }
  function leaderView(box, teamId) {
    var cur = (D.forms || {})[String(teamId)] || { first: true };
    if (!FORM || FORM._team !== teamId) {
      FORM = { _team: teamId, title: cur.title || "", wanted: cur.wanted || "", summary: cur.summary || "", need_s: cur.need_s || 0, need_h: cur.need_h || 0,
               extra: !!cur.extra, extra_faction: cur.extra_faction || "both", usepw: !!cur.lock, password: "",
               level_min: cur.level_min || "", level_max: cur.level_max || "", rank_min: cur.rank_min || "", rank_max: cur.rank_max || "" };
    }
    var c = el("div", "card");
    c.appendChild(el("h2", "", "📝 募集の内容｜" + teamName(teamId)));
    c.appendChild(el("div", "lead", cur.first ? "初めて募集の内容を書くときは、制限も含めて、すべての項目を決めてから保存してください。あとから、いつでも変えられます。"
                                              : "募集の内容は、いつでも変えられます（変えた項目だけ、まとめて保存します）。"));
    var f = el("div", "frm");
    function lab(t) { f.appendChild(el("label", "", t)); }
    function hint(t) { f.appendChild(el("div", "hint", t)); }
    function text(k, max, ph, area) { var i = el(area ? "textarea" : "input"); if (!area) i.type = "text"; i.maxLength = max; i.value = FORM[k]; if (ph) i.placeholder = ph; i.addEventListener("input", function () { FORM[k] = i.value; }); f.appendChild(i); }
    function num(k, lo, hi) { var s = el("select"); for (var n = lo; n <= hi; n++) { var o = el("option", "", n + "人"); o.value = String(n); if (Number(FORM[k]) === n) o.selected = true; s.appendChild(o); } s.addEventListener("change", function () { FORM[k] = Number(s.value); }); return s; }
    lab("募集タイトル（20字以内）"); text("title", 20, "例：初心者さん大歓迎！");
    lab("求めている人材"); var nr = el("div", "row"); nr.style.marginTop = "0"; nr.appendChild(el("span", "", "サバイバー")); nr.appendChild(num("need_s", 0, D.need_max || 10)); nr.appendChild(el("span", "", "ハンター")); nr.appendChild(num("need_h", 0, D.need_max || 10)); f.appendChild(nr);
    hint("両陣営の人が加入したら、サバイバー・ハンターの両方を、1人ずつ減らします。");
    lab("ひとこと（任意）"); text("wanted", 100, "例：VCで話せる人");
    lab("概要（任意）"); text("summary", 1000, "性別やVCの有無、使用キャラクター、バッジの有無などを制限したい場合はここに記載してください。", true);
    lab("閲歴の下限・上限"); var lr = el("div", "row"); lr.style.marginTop = "0";
    ["level_min", "level_max"].forEach(function (k, ix) {
      var i = el("input"); i.type = "text"; i.inputMode = "numeric"; i.maxLength = 4; i.value = FORM[k] == null ? "" : FORM[k]; i.placeholder = ix ? "上限（空＝なし）" : "下限（空＝なし）"; i.style.width = "11em";
      i.addEventListener("input", function () { var d = i.value.replace(/[^0-9]/g, ""); if (d !== i.value) i.value = d; FORM[k] = d; });
      lr.appendChild(i);
    });
    f.appendChild(lr);
    lab("過去最高段位の下限"); f.appendChild(rankPick(FORM.rank_min, function (v) { FORM.rank_min = v; render(); }));
    lab("過去最高段位の上限"); f.appendChild(rankPick(FORM.rank_max, function (v) { FORM.rank_max = v; render(); }));
    var bad = [];
    if (!rankOk(FORM.rank_min) || !rankOk(FORM.rank_max)) bad.push("最高峰の★の数は、25以上の2〜3桁の数字にしてください。");
    var s1 = rankScore(FORM.rank_min), s2 = rankScore(FORM.rank_max);
    if (s1 != null && s2 != null && s1 > s2) bad.push("段位の下限が、上限より高くなっています。");
    if (FORM.level_min && FORM.level_max && Number(FORM.level_min) > Number(FORM.level_max)) bad.push("閲歴の下限が、上限より大きくなっています。");
    lab("人数を超えても募集する"); var xr = el("div", "row"); xr.style.marginTop = "0";
    var xc = el("input"); xc.type = "checkbox"; xc.checked = FORM.extra; xc.addEventListener("change", function () { FORM.extra = xc.checked; render(); });
    xr.appendChild(xc); xr.appendChild(el("span", "", "求めている人材の人数を超えても募集する"));
    if (FORM.extra) { var xs = el("select"); [["survivor", "サバイバー"], ["hunter", "ハンター"], ["both", "両陣営OK"]].forEach(function (o2) { var o = el("option", "", o2[1]); o.value = o2[0]; if (FORM.extra_faction === o2[0]) o.selected = true; xs.appendChild(o); }); xs.addEventListener("change", function () { FORM.extra_faction = xs.value; }); xr.appendChild(xs); }
    f.appendChild(xr); hint("人数がそろったあとも「余分募集」として、選んだ陣営の人を募集できます（一覧では下のほうに出ます）。");
    lab("パスワード"); var pr = el("div", "row"); pr.style.marginTop = "0";
    var pc = el("input"); pc.type = "checkbox"; pc.checked = FORM.usepw; pc.addEventListener("change", function () { FORM.usepw = pc.checked; render(); });
    pr.appendChild(pc); pr.appendChild(el("span", "", "パスワードつきの募集（友人だけを招待したいとき）"));
    if (FORM.usepw) { var pw = el("input"); pw.type = "text"; pw.maxLength = 20; pw.value = FORM.password; pw.placeholder = cur.lock ? "（変えるときだけ入力）" : "4文字以上の英数字"; pw.style.width = "14em"; pw.addEventListener("input", function () { pw.value = pw.value.replace(/[^A-Za-z0-9]/g, ""); FORM.password = pw.value; }); pr.appendChild(pw); }
    f.appendChild(pr);
    c.appendChild(f);
    bad.forEach(function (t) { c.appendChild(el("div", "badtxt", "⚠ " + t)); });
    var row = el("div", "row");
    var sv = el("button", "go", "💾 募集の内容を保存"); sv.type = "button"; sv.disabled = BUSY || bad.length > 0;
