<!doctype html>
<html lang="ja" data-style="cyber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAN/PICK入力</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:; base-uri 'none'; form-action 'none'">
<!--
  BAN/PICKの入力ページ（代表者だけ。個人用のURLで開く）。IDV TEAM LABと同じ見た目・名札・顔の画像を使う。
  ・ボードの「🌐 ブラウザで入力する」ボタンを押した本人にだけ出る、個人用のURL（?t=このBAN/PICKの12文字#側.ユーザー.署名）で開く。URLは、人に教えない。
  ・window.TOURNAMENT_DATA_BASE ＋ 12文字 .json（BOTが書いた、このBAN/PICKの内容）を読む。ハンターのPICKは、試合が終わるまで入らない。
  ・名札をタップして選び、「確定」を押すと、署名つきの依頼が受け箱に届き、BOTが確かめて、いつもの確定の処理（Discordのボードの更新）を行う。
  ・管理者が /button で「Discordのボタンで進める」にすると、このページは使えなくなる（データが消える）。
-->
<style>
  :root { --bg0: #05070b; --fg0: #f2f6ff; --ac: #22d3ee; --ac-on: #03121a;                          /* LABごとに変えられる3色：背景・文字・サブカラー */
          --bg: var(--bg0); --text: var(--fg0);
          --panel: color-mix(in srgb, var(--bg0) 91%, var(--fg0)); --panel2: color-mix(in srgb, var(--bg0) 83%, var(--fg0));
          --line: color-mix(in srgb, var(--bg0) 70%, var(--fg0)); --sub: color-mix(in srgb, var(--fg0) 62%, var(--bg0));
          --h: #d8334a; --h2: #7d1b29; --s: #2f7be0; --s2: #173d73; --gold: #ffd23f; --ok: #3ecf8e; }   /* ハンターの赤・サバイバーの青は、固定 */
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; }
  #stage { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: flex; flex-direction: column; transform-origin: 0 0; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 10px 16px 6px; }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { color: var(--sub); font-size: 13px; }
  #status { margin-left: auto; font-size: 12px; color: var(--sub); }
  #status.ok { color: var(--ok); } #status.ng { color: #ff7a85; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 16px; }
  nav button { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; border-radius: 8px 8px 0 0;
               font: inherit; font-size: 14px; cursor: pointer; }
  nav button.on { background: var(--panel2); border-color: #6f84ad; border-bottom-color: var(--panel2); font-weight: 700; }
  #tabs2 button { font-size: 13px; padding: 5px 12px; }
  #notice { margin: 4px 16px; font-size: 13px; }
  #notice .bar { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; }
  #notice .bad { background: #4a1219; border: 1px solid #ff3b52; color: #ffb3bb; animation: blink 1s steps(2, start) infinite; }
  #notice .req { background: #4a3d0a; border: 1px solid var(--gold); color: #ffe48a; }
  #notice .err { background: #3a2a10; border: 1px solid #e0a030; color: #ffd28a; }
  main { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 8px 16px 12px; align-items: stretch; }
  #pal { flex: 0 0 330px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  #pal.drop-ok { outline: 2px dashed var(--sub); }
  #pal h3 { margin: 0 2px; font-size: 13px; color: var(--sub); flex: none; }
  .palhd { appearance: none; flex: none; background: none; border: 0; color: var(--sub); font: inherit; font-size: 13px; font-weight: 700; margin: 0 2px; padding: 2px 4px; cursor: pointer; text-align: left; }
  .palhd:hover { color: var(--text); } .palbox.collapsed { display: none; }
  #pal input { width: 100%; flex: none; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; }
  #pal .hint { flex: none; margin: 0; }
  .palbox { flex: 1 1 0; min-height: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; touch-action: none; scrollbar-width: none; }
  .palbox::-webkit-scrollbar { display: none; }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--ac) 65%, var(--bg0)) transparent; }                      /* スクロールバーは、デザインの色（サブカラー）に合わせる */
  *::-webkit-scrollbar { width: 9px; height: 9px; } *::-webkit-scrollbar-track { background: transparent; }
  *::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--ac) 65%, var(--bg0)); border-radius: 6px; border: 2px solid transparent; background-clip: padding-box; }
  *::-webkit-scrollbar-thumb:hover { background: var(--ac); background-clip: padding-box; }
  html[data-style="cyber"] *::-webkit-scrollbar-thumb, html[data-style="rock"] *::-webkit-scrollbar-thumb { border-radius: 0; }                                      /* スクロールバーは見せない（ホイール・指のスクロールは、できる） */     /* ハンターの名札置き場と、サバイバーの名札置き場は、別々にスクロール */
  .palbox.h { border-top: 2px solid var(--h); } .palbox.s { border-top: 2px solid var(--s); }
  .palopt { flex: none; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--sub); margin: 0 2px; cursor: pointer; user-select: none; }
  #pal .palopt input { width: auto; flex: none; padding: 0; accent-color: var(--s); }
  .palopt { white-space: nowrap; }
  .rolehd { margin: 6px 2px 3px; font-size: 12px; font-weight: 700; color: #9cc4ff; border-bottom: 1px solid var(--s2); }
  .rolehd:first-child { margin-top: 0; }
  #work { flex: 1; min-width: 0; min-height: 0; overflow-y: auto; padding-bottom: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 5px; }
  /* 名札：顔 + 名前 を、枠で囲む。ハンターは赤、サバイバーは青 */
  .tag { width: 66px; border: 2px solid; border-radius: 8px; padding: 3px 2px 2px; text-align: center; cursor: grab; user-select: none; -webkit-user-select: none;
         touch-action: pan-y; position: relative; background: var(--panel2); }
  .tag.h { border-color: var(--h); background: linear-gradient(180deg, #3a1219, var(--h2)); }
  .tag.s { border-color: var(--s); background: linear-gradient(180deg, #11274a, var(--s2)); }
  .tag .face { width: 56px; height: 56px; margin: 0 auto; border-radius: 6px; background-repeat: no-repeat; background-color: rgba(0,0,0,.35);
               display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .tag .nm { font-size: 10.5px; line-height: 1.15; margin-top: 2px; word-break: break-all; min-height: 24px; display: flex; align-items: center; justify-content: center; }
  .tag .rms { position: absolute; top: 17px; right: 3px; display: flex; flex-direction: column; align-items: flex-end; gap: 1px; z-index: 2; }       /* 縦に並べる */
  .tag .rms span { font-size: 10px; line-height: 1; padding: 1px; border-radius: 8px; background: rgba(0, 0, 0, .6); color: #fff; }
  .tag.fav.h { background: linear-gradient(180deg, #5a1d29, #a02a3d); border-color: #ff5e75; }                /* 誰かの得意キャラ：少しだけ明るく */
  .tag.fav.s { background: linear-gradient(180deg, #1c3f73, #2b62b0); border-color: #5ca2ff; }
  .tag .fstar { position: absolute; top: 1px; left: 3px; font-size: 13px; line-height: 1; color: var(--gold); text-shadow: 0 0 3px #000, 0 1px 0 #000; z-index: 2; pointer-events: none; }
  .tag { -webkit-touch-callout: none; }
  html.rot .tag { touch-action: pan-x; }                                             /* 回して表示しているとき：画面の縦（実際の横方向）に指を動かすと、名札の上でもスクロールできる */
  .tag.gray { filter: grayscale(1) brightness(.8); opacity: .7; }                                    /* 組み合わせ禁止で、選べない／選べなくなったキャラ */
  .pn.s { color: #6fb0ff; } .pn.h { color: #ff7d8d; } .pn.sh { color: #c79bff; }                    /* 選手名：サバイバー応募＝青／ハンター応募＝赤／両方＝紫 */
  html[data-tone="light"] .pn.s { color: #1f5fb4; } html[data-tone="light"] .pn.h { color: #c3213a; } html[data-tone="light"] .pn.sh { color: #7b3fc4; }
  #pcNote { position: fixed; left: 8px; right: 8px; top: 8px; z-index: 100001; background: var(--panel); color: var(--text); border: 2px solid var(--ac); border-radius: 10px; padding: 10px 14px; font-size: 3.4vw; line-height: 1.6; box-shadow: 0 6px 24px rgba(0, 0, 0, .6); }
  #pcNote b { display: block; margin-bottom: 4px; } #pcNote .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; } #pcNote .btn { font-size: 3vw; }
  #whyPop { position: fixed; z-index: 100000; max-width: 290px; background: var(--panel); color: var(--text); border: 1px solid var(--ac); border-radius: 10px; padding: 8px 12px 9px; font-size: 12.5px; line-height: 1.6; box-shadow: 0 6px 22px rgba(0,0,0,.5); }
  #whyPop b { display: block; margin-bottom: 2px; font-size: 13px; } #whyPop div + div { margin-top: 3px; }
  #gate .who { display: flex; align-items: baseline; gap: 10px; width: 100%; margin: 6px 0; padding: 11px 12px; text-align: left; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; font: inherit; font-size: 15px; cursor: pointer; }
  #gate .who:hover { border-color: var(--ac); } #gate .who .tg { font-size: 11px; color: var(--sub); margin-left: auto; }
  .tag.hl { box-shadow: 0 0 0 3px var(--gold), 0 0 16px 4px rgba(255, 210, 63, .85); transform: translateY(-2px); }              /* 空のスロットをクリックした選手の、得意キャラ */
  .tag.insL { box-shadow: 0 -5px 0 var(--ac); } .tag.insR { box-shadow: 0 5px 0 var(--ac); }                                         /* 入れる場所の目印（縦の枠：上／下） */
  .drop:not(.col) .tag.insL { box-shadow: -5px 0 0 var(--ac); } .drop:not(.col) .tag.insR { box-shadow: 5px 0 0 var(--ac); }
  .slotctl { margin-left: 8px; font-weight: 400; font-size: 12px; color: var(--sub); display: inline-flex; align-items: center; gap: 4px; }
  .slotctl .sn { color: var(--text); font-size: 13px; }
  .sbtn { appearance: none; border: 1px solid var(--line); background: var(--panel2); color: var(--text); border-radius: 6px; width: 24px; height: 22px; line-height: 1; font-size: 14px; cursor: pointer; padding: 0; }
  .sbtn:hover { border-color: var(--ac); }
  .pgrid { display: grid; gap: 6px; align-items: start; overflow-x: auto; }                                                       /* 選手の縦列（必ず横に並ぶ）× 編成パターンの行（増やすと、下へ増える） */
  .pgrid .psel, .pgrid .pname { width: 100%; font: inherit; font-size: 12px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 4px; text-align: center; }
  .pgrid .pname { color: var(--sub); background: none; border-style: dashed; }
  .drop.cell { min-height: 84px; justify-content: center; }
  .tag[data-num]::after, .drop.cell[data-num]::after, .frame::after { content: attr(data-num); position: absolute; top: -1px; right: 3px; z-index: 4; font-size: 14px; font-weight: 800; line-height: 1; color: var(--gold); text-shadow: 0 0 3px #000, 0 0 3px #000; pointer-events: none; }
  .drop.cell { position: relative; }
  .frame { position: relative; width: 66px; min-height: 78px; border: 2px dashed var(--line); border-radius: 8px; opacity: .8; flex: none; }
  .mapbar { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 4px 0 6px; font-size: 12.5px; }
  .mapbar label { display: inline-flex; align-items: center; gap: 6px; color: var(--sub); } .mapbar select { font: inherit; font-size: 12.5px; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .gbrow { display: flex; flex-wrap: wrap; gap: 3px; margin: -2px 0 4px; } .gbrow[hidden] { display: none; }
  .gbface { width: 26px; height: 26px; border-radius: 4px; background-repeat: no-repeat; background-color: rgba(0,0,0,.35); filter: grayscale(1) brightness(.85); flex: none; cursor: pointer; }
  .drop.col { flex-direction: column; flex-wrap: nowrap; align-items: center; min-height: 100px; }                                      /* キャラは、縦に並ぶ */
  .tag.sel { outline: 3px solid #fff; }
  .ghost .gcount { position: absolute; left: 50%; bottom: -8px; transform: translateX(-50%); background: var(--ac); color: var(--ac-on); font-size: 12px; font-weight: 800; padding: 1px 8px; border-radius: 10px; }
  .tag.req { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 12px 2px rgba(255,210,63,.75); }
  .tag.req .nm { color: var(--gold); font-weight: 700; }
  .tag.bad { border-color: #ff2b45; animation: blinkTag 4s step-end infinite; }                    /* 使用禁止：枠線だけ、ゆっくり点滅（フェードなし） */
  .tag.locked { cursor: default; opacity: .92; }
  .tag.dim { opacity: .35; }
  .tag .x { position: absolute; right: -6px; top: -7px; width: 18px; height: 18px; line-height: 16px; border-radius: 50%; background: #000; color: #fff; border: 1px solid #888;
            font-size: 11px; padding: 0; cursor: pointer; display: none; }
  .tag:hover .x, .tag.sel .x { display: block; }
  @media (hover: none) { .tag .x { display: block; } }
  @keyframes blink { 50% { opacity: .35; } }
  .drop.exact { border: 2px solid #2f9bff; }                                                                /* 人数がピッタリ揃ったとき：枠線に、青いライン */
  @keyframes blinkTag { 0% { border-color: #ff2b45; } 50% { border-color: #4a1219; } }
  .ghost { position: fixed; z-index: 99999; pointer-events: none; opacity: .9; transform: translate(-50%, -60%) scale(1.08); }
  .ghost.rot { transform: translate(-50%, -60%) rotate(90deg) scale(var(--gs, 1.08)); }
  /* 常用キャラ */
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; }
  .box h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .box h4 small { color: var(--sub); font-weight: 400; }
  .drop { min-height: 84px; border-radius: 8px; padding: 4px; background: rgba(255,255,255,.03); border: 1px dashed var(--line);
          display: flex; flex-wrap: wrap; gap: 5px; align-content: flex-start; }          /* 入れた名札は、横に並べる（入りきらなければ、次の段） */
  .drop.over { background: rgba(255,255,255,.12); border-color: #fff; }
  .drop.off { display: block; background: repeating-linear-gradient(45deg, #1a1f29, #1a1f29 8px, #141820 8px, #141820 16px); border-style: solid; color: var(--sub); font-size: 12px; text-align: center; padding-top: 28px; }
  .drop.empty::before { content: attr(data-hint); color: #5d6a82; font-size: 12px; align-self: center; }
  /* セット */
  #corners { display: flex; flex-direction: column; gap: 12px; }                  /* 上：サバイバー目線／下：ハンター目線 */
  .corner { background: var(--panel); border: 2px solid; border-radius: 12px; padding: 8px 10px 10px; min-width: 0; }
  .corner .chd { display: flex; align-items: center; gap: 10px; margin: 0 0 6px; } .corner .chd > h3 { margin: 0; } .swapbtn { margin-left: auto; }
  .pair { display: flex; gap: 12px; align-items: stretch; } .pair.swap { flex-direction: row-reverse; }      /* 左：自陣営／右：敵陣営（ハンター目線は入れ替えられる） */
  .side { flex: 1 1 0; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 4px 8px 8px; background: color-mix(in srgb, var(--bg0) 55%, var(--panel)); }
  .side.enemy { border-style: dashed; } .side > h5 { margin: 2px 0 0; font-size: 12px; color: var(--sub); letter-spacing: .08em; }
  .blk.eban .drop, .blk.epick .drop { background: color-mix(in srgb, var(--fg0) 4%, transparent); }
  .corner.s { border-color: var(--s); } .corner.h { border-color: var(--h); }
  .corner .chd > h3 { margin: 0 0 6px; font-size: 16px; }
  .corner.s .chd > h3 { color: #7eb4ff; } .corner.h .chd > h3 { color: #ff8896; }
  .blk { margin-top: 8px; }
  .blk h4 { margin: 0 0 4px; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .blk h4 small { color: var(--sub); font-weight: 400; font-size: 11px; }
  .blk h4 .cnt { margin-left: auto; font-weight: 400; color: var(--sub); font-size: 12px; }
  .blk h4 .cnt.over { color: #ff7a85; font-weight: 700; }
  .blk.gb .drop { background: rgba(160,120,255,.07); border-color: #6b57a8; }
  .memo { margin-top: 12px; }
  .memo textarea { width: 100%; min-height: 110px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; resize: vertical; }
  .hint { color: var(--sub); font-size: 12px; margin: 4px 0; }
  /* スマホを縦に持っているとき（画面を回して使うとき）は、縦の高さが少ないので、上の部分を小さくする */
  html.rot header { padding: 4px 12px 2px; gap: 8px; } html.rot header h1 { font-size: 15px; } html.rot header .sub { display: none; }
  html.rot nav { padding: 2px 12px; gap: 4px; } html.rot nav button { padding: 4px 10px; font-size: 12px; } html.rot #tabs2 button { font-size: 12px; padding: 3px 9px; }
  html.rot #notice { margin: 2px 12px; font-size: 12px; } html.rot #notice .bar { padding: 3px 8px; margin-bottom: 2px; }
  html.rot main { padding: 4px 12px 8px; gap: 8px; } html.rot #pal { flex-basis: 290px; padding: 6px; } html.rot #pal .hint { display: none; }
  html.rot .corner { padding: 6px 8px 8px; } html.rot .corner .chd > h3 { margin-bottom: 2px; font-size: 14px; } html.rot .blk { margin-top: 4px; } html.rot .drop { min-height: 76px; }
  html.rot .memo textarea { min-height: 70px; }
  .empty-msg { color: var(--sub); padding: 30px; text-align: center; }
  .empty-msg a, #notice .bar a { color: var(--ac); word-break: break-all; }
  /* ルール設定 */
  .rules .sec { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .rules h4 { margin: 0 0 6px; font-size: 14px; } .rules h5 { margin: 8px 0 4px; font-size: 13px; color: #9cc4ff; }
  .rules select, .rules input[type=text] { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; font: inherit; font-size: 13px; }
  .rules table { border-collapse: collapse; font-size: 13px; } .rules td, .rules th { padding: 3px 8px; border-bottom: 1px solid var(--line); text-align: left; }
  .rules .ropt { display: flex; align-items: center; gap: 8px; margin: 6px 0; font-size: 13px; cursor: pointer; }
  .rules .plist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .rules .off { color: var(--sub); }
  .rules ul { margin: 4px 0 4px 18px; padding: 0; font-size: 13px; }
  #notice .newid { background: #3a2a10; border: 1px solid #ff9f1a; color: #ffd28a; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  #notice .newid button, .btn { appearance: none; border: 1px solid #6f84ad; background: var(--panel2); color: var(--text); padding: 4px 12px; border-radius: 6px; font: inherit; font-size: 12px; cursor: pointer; }
  header .hbtn { margin-left: 6px; }
  #stage[hidden], #gate[hidden], #hist[hidden], #theme[hidden] { display: none; }
  #gate { position: fixed; inset: 0; overflow: auto; background: var(--bg); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; z-index: 50; }
  #gate .card { width: min(560px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px 20px 16px; }
  #gate h1 { margin: 0 0 4px; font-size: 22px; letter-spacing: .04em; } #gate .tm { color: var(--sub); margin-bottom: 12px; font-size: 14px; }
  #gate label { display: block; margin: 10px 0 4px; font-size: 13px; color: var(--sub); }
  #gate input[type=password], #gate input[type=text] { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 10px; font: inherit; font-size: 16px; }
  #gate .pw, #hist .pw { position: relative; } #gate .pw input, #hist .pw input { padding-right: 64px; width: 100%; }
  #hist .danger { margin-top: 18px; border: 1px solid #ff3b52; border-radius: 8px; padding: 6px 12px 12px; font-size: 12.5px; line-height: 1.6; color: #ffc9ce; }
  #hist .danger label { display: block; margin: 8px 0 4px; }
  #hist .danger .del { margin-top: 10px; background: #c0182d; color: #fff; border: 0; border-radius: 6px; padding: 7px 16px; cursor: pointer; font: inherit; font-weight: 700; }

  /* ロック：太い字・斜めに切った形・ひっかき傷・ときどき走る光 */

  html[data-style="rock"] #pal, html[data-style="rock"] .box, html[data-style="rock"] .rules .sec, html[data-style="rock"] #hist .card, html[data-style="rock"] #theme .card, html[data-style="rock"] #gate .card {
    border-radius: 0; border-left: 5px solid var(--ac); clip-path: polygon(0 0, 100% 0, 100% calc(100% - 16px), calc(100% - 16px) 100%, 0 100%); }
  html[data-style="rock"] nav button { border-radius: 0; transform: skewX(-12deg); font-weight: 400; letter-spacing: .04em; }
  html[data-style="rock"] nav button.on { background: var(--ac); color: var(--ac-on); box-shadow: none; }

  html[data-style="rock"] #stage::before { display: block; inset: 0; background: repeating-linear-gradient(115deg, color-mix(in srgb, var(--fg0) 5%, transparent) 0 1px, transparent 1px 9px), repeating-linear-gradient(62deg, color-mix(in srgb, var(--fg0) 3%, transparent) 0 1px, transparent 1px 23px); }
  html[data-style="rock"] #stage::after { display: block; top: 0; bottom: 0; left: -30%; width: 28%; will-change: transform; transform: skewX(-20deg) translateX(-150%); animation: ro-slash 7s ease-in infinite;
    background: linear-gradient(100deg, transparent, color-mix(in srgb, var(--ac) 22%, transparent) 50%, transparent); }
  @keyframes ro-slash { 0%, 70% { transform: skewX(-20deg) translateX(-150%); } 100% { transform: skewX(-20deg) translateX(520%); } }
  @keyframes ro-punch { 0%, 90%, 100% { transform: scale(1); } 94% { transform: scale(1.08); } }

  /* シンプル：すっきりした、ガラスのようなパネル。細い線がゆっくり伸びる */
  html[data-style="simple"] header h1 { font-weight: 600; letter-spacing: .04em; }

  /* 背景が明るい色のとき（data-tone="light"）：濃い色の地に白い字の名札、読みにくい色の見出し、などを直す */

  html[data-tone="light"] .drop.over { background: color-mix(in srgb, var(--ac) 22%, transparent); border-color: var(--ac); }
  html[data-tone="light"] .drop.off { background: repeating-linear-gradient(45deg, color-mix(in srgb, var(--bg0) 92%, var(--fg0)), color-mix(in srgb, var(--bg0) 92%, var(--fg0)) 8px, color-mix(in srgb, var(--bg0) 85%, var(--fg0)) 8px, color-mix(in srgb, var(--bg0) 85%, var(--fg0)) 16px); }

  html[data-tone="light"] #gate .consent .links a { color: #1f5fb4; }

  html[data-tone="light"][data-style="cute"] #pal, html[data-tone="light"][data-style="cute"] .box, html[data-tone="light"][data-style="cute"] .rules .sec, html[data-tone="light"][data-style="cute"] .corner,
  html[data-tone="light"][data-style="cute"] #hist .card, html[data-tone="light"][data-style="cute"] #theme .card, html[data-tone="light"][data-style="cute"] #gate .card { background: color-mix(in srgb, var(--panel) 25%, #fff); }
  html[data-tone="light"] input, html[data-tone="light"] textarea, html[data-tone="light"] select { background: color-mix(in srgb, var(--panel2) 35%, #fff); }
  html[data-tone="light"] nav button { background: color-mix(in srgb, var(--panel) 30%, #fff); }
  html[data-tone="light"] nav button.on { background: var(--panel2); }
  html[data-tone="light"][data-style="cute"] nav button.on { background: var(--ac); }

  @media (prefers-reduced-motion: reduce) { #stage::before, #stage::after, header h1, header h1::after, header::after, #gate::before { animation: none !important; } }

  /* ───── BAN/PICKの入力ページ（LABと同じ作り：左＝名札置き場／右＝目線の枠。足りないものだけ、足す） ───── */
  #notice .bar.info { background: var(--panel); border: 1px solid var(--line); color: var(--text); }
  #notice .bar.my { background: #4a3d0a; border: 1px solid var(--gold); color: #ffe48a; }
  #notice .bar b.s { color: #7db4ff; } #notice .bar b.h { color: #ff8a99; }
  #work { touch-action: none; overscroll-behavior: contain; }
  main.view #pal { display: none; }
  #pal .palbox.m { border-top: 2px solid var(--gold); }
  #pal .palbox.m .tag { width: 66px; } .tag.m { border-color: var(--gold); background: linear-gradient(180deg, #3a3210, #6a5a14); } .tag.m .face { width: 56px; height: 56px; font-size: 12px; padding: 2px; display: flex; align-items: center; justify-content: center; line-height: 1.1; }
  .tag.gray { cursor: not-allowed; } .tag.picked { opacity: .35; }

  .drop.col0 { min-height: 84px; }
  .cbar { flex: none; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 8px 16px 10px; border-top: 1px solid var(--line); background: var(--bg); }
  .cbar .btn { padding: 13px 40px; font-size: 18px; } .cbar .btn.go { background: var(--ac); color: var(--ac-on); border-color: var(--ac); font-weight: 800; } .cbar .btn[disabled] { opacity: .5; }
  #status.ok { color: var(--ok); } #status.warn { color: var(--gold); } #status.ng { color: #ff7a85; font-weight: 700; }
  #late { margin: 4px 16px; padding: 9px 14px; border-radius: 6px; background: #4a1219; border: 1px solid #ff3b52; color: #ffb3bb; font-weight: 700; font-size: 15px; animation: blink 1s steps(2, start) infinite; }
  #late[hidden] { display: none; }
  html.rot #late { margin: 2px 12px; padding: 5px 10px; font-size: 14px; }
  #shell { height: 100%; display: flex; flex-direction: column; min-height: 0; }
  /* BAN/PICKが終わったら、画面が、デザインごとの消え方で、シャットダウンする */
  #shell.off { animation: bp-off-simple .9s ease-in forwards; pointer-events: none; }
  html[data-style="cyber"] #shell.off { animation-name: bp-off-cyber; }
  html[data-style="cute"] #shell.off { animation-name: bp-off-cute; }
  html[data-style="gothic"] #shell.off { animation-name: bp-off-gothic; animation-duration: 1.6s; }
  html[data-style="rock"] #shell.off { animation-name: bp-off-rock; animation-duration: .7s; }
  @keyframes bp-off-simple { 0% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes bp-off-cyber { 0% { transform: scale(1, 1); filter: brightness(1); opacity: 1; } 55% { transform: scale(1, .006); filter: brightness(4); opacity: 1; } 85% { transform: scale(.02, .006); filter: brightness(6); opacity: 1; } 100% { transform: scale(0, 0); filter: brightness(0); opacity: 0; } }
  @keyframes bp-off-cute { 0% { transform: scale(1) rotate(0); opacity: 1; } 25% { transform: scale(1.06) rotate(1deg); opacity: 1; } 100% { transform: scale(0) rotate(-14deg); opacity: 0; } }
  @keyframes bp-off-gothic { 0% { opacity: 1; filter: none; } 15% { opacity: .55; } 25% { opacity: .95; } 45% { opacity: .35; } 55% { opacity: .6; } 100% { opacity: 0; filter: blur(8px) brightness(.3); } }
  @keyframes bp-off-rock { 0% { transform: none; opacity: 1; } 30% { transform: translateX(-12px) skewX(4deg); opacity: 1; } 100% { transform: translateX(110%) skewX(-24deg); opacity: 0; } }
  .shutmsg.plain { animation-delay: 0s; animation-duration: .01s; }
  .shutmsg { position: absolute; inset: 0; z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; padding: 20px; opacity: 0; animation: bp-msgin 1s ease-out 1s forwards; }
  .shutmsg .t1 { font-size: 40px; font-weight: 800; color: var(--ac); letter-spacing: .08em; }
  .shutmsg .t2 { font-size: 20px; color: var(--fg0); line-height: 1.7; }
  html.rot .shutmsg .t1 { font-size: 34px; } html.rot .shutmsg .t2 { font-size: 18px; }
  @keyframes bp-msgin { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: none; } }
  /* 名札を入れたときの演出（体験会では出さない）：弾む・光が走る・「○○ PICK！」の吹き出し */
  .tag { position: relative; }
  .tag.ins { animation: bp-ins .6s cubic-bezier(.2, 1.6, .4, 1) both; z-index: 6; }
  .tag.ins.ban { animation-name: bp-ins-ban; }
  .tag .shine { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: inherit; }
  .tag .shine::before { content: ""; position: absolute; top: -10%; bottom: -10%; width: 45%; left: -60%; background: linear-gradient(105deg, transparent, rgba(255, 255, 255, .95), transparent); transform: skewX(-18deg); animation: bp-shine .7s .12s ease-out forwards; }
  .tag .pop { position: absolute; left: 50%; top: -4px; transform: translate(-50%, -100%); white-space: nowrap; padding: 3px 10px; border-radius: 12px; font-weight: 800; font-size: 13px; background: var(--gold); color: #1a1400; box-shadow: 0 0 14px color-mix(in srgb, var(--gold) 70%, transparent); animation: bp-pop 1.4s ease-out forwards; pointer-events: none; z-index: 8; }
  .tag.ban .pop { background: var(--h); color: #fff; box-shadow: 0 0 14px color-mix(in srgb, var(--h) 70%, transparent); }
  @keyframes bp-ins { 0% { transform: scale(.2) rotate(-14deg); opacity: 0; filter: brightness(3); } 55% { transform: scale(1.3) rotate(4deg); opacity: 1; filter: brightness(1.8); } 100% { transform: none; filter: none; } }
  @keyframes bp-ins-ban { 0% { transform: scale(1.8) rotate(8deg); opacity: 0; filter: brightness(2) saturate(2); } 55% { transform: scale(.85) rotate(-3deg); opacity: 1; filter: brightness(1.4); } 75% { transform: translateX(-4px); } 100% { transform: none; filter: none; } }
  @keyframes bp-shine { 0% { left: -60%; } 100% { left: 130%; } }
  @keyframes bp-pop { 0% { opacity: 0; transform: translate(-50%, -60%) scale(.4); } 18% { opacity: 1; transform: translate(-50%, -110%) scale(1.15); } 70% { opacity: 1; transform: translate(-50%, -125%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -160%) scale(1); } }
  .tag .xcut { position: absolute; left: -6%; width: 112%; top: 48%; height: 3px; background: #ff3b52; box-shadow: 0 0 8px #ff3b52; transform: rotate(-35deg) scaleX(0); transform-origin: left center; animation: bp-xcut 1.3s .2s ease-out forwards; z-index: 7; pointer-events: none; }
  @keyframes bp-xcut { 0% { transform: rotate(-35deg) scaleX(0); opacity: 1; } 25% { transform: rotate(-35deg) scaleX(1); opacity: 1; } 100% { transform: rotate(-35deg) scaleX(1); opacity: 0; } }
  /* サイバー：ブツッと映る（走査線がずれて、色がにじむ）。吹き出しは、角ばったネオン */
  html[data-style="cyber"] .tag.ins, html[data-style="cyber"] .tag.ins.ban { animation-name: bp-ins-cyber; animation-duration: .6s; animation-timing-function: steps(14, end); }
  html[data-style="cyber"] .tag .shine::before { background: linear-gradient(105deg, transparent, rgba(120, 255, 255, .95), transparent); }
  html[data-style="cyber"] .tag .pop { font-family: "Consolas", "Menlo", monospace; border-radius: 0; background: var(--ac); color: var(--ac-on); text-shadow: 2px 0 #f0f, -2px 0 #0ff; clip-path: polygon(0 0, 100% 0, 95% 100%, 5% 100%); padding: 3px 14px; }
  html[data-style="cyber"] .tag.ban .pop { background: var(--h); color: #fff; }
  @keyframes bp-ins-cyber { 0% { opacity: 0; transform: scaleY(.04) scaleX(1.5); filter: brightness(3) hue-rotate(40deg); } 30% { opacity: 1; transform: scaleY(1.15); } 45% { transform: translateX(-5px); filter: hue-rotate(-50deg) brightness(1.6); } 60% { transform: translateX(5px); } 80% { transform: translateX(-2px); filter: none; } 100% { transform: none; filter: none; } }
  /* キュート：ぽよんと跳ねる。キラキラが舞う。吹き出しは、ピンクの丸 */
  html[data-style="cute"] .tag.ins, html[data-style="cute"] .tag.ins.ban { animation-name: bp-ins-cute; animation-duration: .75s; }
  html[data-style="cute"] .tag .shine::before { content: "✨"; background: none; width: auto; top: -10px; left: auto; right: -8px; font-size: 20px; transform: none; animation: bp-twinkle .9s ease-out forwards; }
  html[data-style="cute"] .tag .shine::after { content: "✨"; position: absolute; left: -6px; bottom: -8px; font-size: 16px; animation: bp-twinkle .9s .2s ease-out forwards; opacity: 0; }
  html[data-style="cute"] .tag .pop { border-radius: 999px; background: #ff7ab8; color: #fff; box-shadow: 0 3px 0 #d94a8c; } html[data-style="cute"] .tag .pop::before { content: "♡ "; }
  html[data-style="cute"] .tag.ban .pop { background: #ff5a6a; box-shadow: 0 3px 0 #c93a48; }
  @keyframes bp-ins-cute { 0% { transform: scale(0) rotate(-28deg); opacity: 0; } 45% { transform: scale(1.4) rotate(9deg); opacity: 1; } 65% { transform: scale(.88) rotate(-5deg); } 82% { transform: scale(1.08) rotate(2deg); } 100% { transform: none; } }
  @keyframes bp-twinkle { 0% { opacity: 0; transform: scale(.2) rotate(0); } 40% { opacity: 1; transform: scale(1.3) rotate(40deg); } 100% { opacity: 0; transform: scale(.8) rotate(90deg); } }
  /* ゴシック：闇からゆっくり浮かぶ。血の色の光がにじむ。吹き出しは、明朝の金の縁 */
  html[data-style="gothic"] .tag.ins, html[data-style="gothic"] .tag.ins.ban { animation-name: bp-ins-goth; animation-duration: 1s; animation-timing-function: ease-out; }
  html[data-style="gothic"] .tag .shine::before { background: linear-gradient(105deg, transparent, rgba(255, 70, 70, .6), transparent); animation-duration: 1s; }
  html[data-style="gothic"] .tag .pop { font-family: "Yu Mincho", "Hiragino Mincho ProN", "Noto Serif JP", serif; letter-spacing: .12em; border-radius: 2px; background: #2a0a10; color: #f3d9a4; border: 1px solid #b89657; box-shadow: 0 0 14px #b01020; animation-duration: 1.8s; }
  html[data-style="gothic"] .tag.ban .pop { background: #4a0a14; color: #ffb8b8; border-color: #b01020; }
  html[data-style="gothic"] .tag .xcut { background: #b01020; box-shadow: 0 0 10px #b01020; height: 2px; }
  @keyframes bp-ins-goth { 0% { opacity: 0; transform: translateY(-22px) scale(1.12); filter: blur(10px) brightness(.4); } 55% { opacity: 1; filter: blur(0) brightness(1.1) drop-shadow(0 0 12px #b01020); } 100% { transform: none; filter: none; } }
  /* ロック：ドンッと叩きつける。画面が揺れるような衝撃。吹き出しは、黄色に黒の縁 */
  html[data-style="rock"] .tag.ins, html[data-style="rock"] .tag.ins.ban { animation-name: bp-ins-rock; animation-duration: .5s; }
  html[data-style="rock"] .tag .shine::before { background: linear-gradient(105deg, transparent, rgba(255, 232, 90, .95), transparent); animation-duration: .35s; }
  html[data-style="rock"] .tag .pop { border-radius: 0; background: #ffe14a; color: #111; font-weight: 900; border: 2px solid #111; box-shadow: 3px 3px 0 #111; clip-path: polygon(6% 0, 100% 0, 94% 100%, 0 100%); padding: 3px 14px; animation-duration: 1.2s; }
  html[data-style="rock"] .tag.ban .pop { background: #e8203a; color: #fff; }
  html[data-style="rock"] .tag .xcut { height: 6px; background: #fff; box-shadow: 0 0 0 2px #111; }
  @keyframes bp-ins-rock { 0% { transform: translateY(-130px) scale(2) rotate(-10deg); opacity: 0; } 40% { transform: translateY(0) scale(1.18, .8) rotate(1deg); opacity: 1; } 55% { transform: translate(-5px, 3px) scale(.95, 1.06); } 70% { transform: translate(5px, -3px); } 100% { transform: none; } }
  /* シンプル：すっと出る。吹き出しは、控えめ */
  html[data-style="simple"] .tag.ins, html[data-style="simple"] .tag.ins.ban { animation-name: bp-ins-simple; animation-duration: .35s; animation-timing-function: ease-out; }
  html[data-style="simple"] .tag .shine { display: none; }
  html[data-style="simple"] .tag .pop { background: var(--fg0); color: var(--bg0); box-shadow: none; border-radius: 6px; font-weight: 700; animation-duration: 1.1s; }
  html[data-style="simple"] .tag.ban .pop { background: var(--h); color: #fff; }
  @keyframes bp-ins-simple { 0% { opacity: 0; transform: scale(.92); } 100% { opacity: 1; transform: none; } }
  /* BAN/PICKのあとの案内（スクショ・確認待ち・カウントダウン・試合中） */
  .sp .card { max-width: 680px; width: 100%; max-height: 94%; overflow-y: auto; touch-action: none; }
  .sp .big { font-size: 28px; font-weight: 800; color: var(--ac); letter-spacing: .06em; text-align: center; }
  .sp .sub2 { text-align: center; color: var(--sub); font-size: 13px; margin: 4px 0 10px; }
  .sp ol { margin: 8px 0 12px; padding: 0; list-style: none; counter-reset: s; font-size: 14px; line-height: 1.6; }
  .sp li { counter-increment: s; margin: 5px 0; padding: 6px 10px 6px 38px; position: relative; border: 1px solid var(--line); border-radius: 8px; }
  .sp li::before { content: counter(s); position: absolute; left: 9px; top: 6px; width: 21px; height: 21px; line-height: 21px; text-align: center; border-radius: 50%; background: var(--ac); color: var(--ac-on); font-weight: 800; font-size: 12px; }
  .sp .warn { margin: 8px 0; padding: 8px 12px; border: 1px solid var(--gold); border-radius: 8px; background: color-mix(in srgb, var(--gold) 12%, transparent); color: var(--gold); font-size: 13.5px; }
  .sp .row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }

    ask("「" + names + "」で確定します。確定すると、取り消せません。よろしいですか？", function () { sendNow(stepNo, picked, wasHidden); });
  }
  function ask(text, ok) {                                                                 // ページの中の確認（標準のダイアログは使わない）
    var ov = el("div", "ask"), card = el("div", "card"), row = el("div", "row");
    card.appendChild(el("div", "q", text));
    var no = el("button", "btn", "やめる"), yes = el("button", "btn go", "確定する"); no.type = "button"; yes.type = "button";
    no.addEventListener("click", function () { ov.remove(); });
    yes.addEventListener("click", function () { ov.remove(); ok(); });
    row.appendChild(no); row.appendChild(yes); card.appendChild(row); ov.appendChild(card); $("stage").appendChild(ov);
    yes.focus();
  }
  function sendNow(stepNo, picked, wasHidden) {
    if (BUSY) return;
    BUSY = true; render(); msg("", "送信しています…");
    var nonce = Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
    fetch(INBOX_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ nonce: nonce, at: Date.now(), assignments: { _bp: { side: SIDE, uid: UID, tok: TOK, ids: SEL } } }) })
      .then(function (r) { if (!r.ok) throw new Error("送れませんでした（" + r.status + "）"); return waitResult(nonce, 25); })
      .then(function (res) {
        BUSY = false;
        if (res && res.ok) { if (wasHidden) remember(stepNo, picked); SEL = []; msg("ok", "✅ 確定しました。Discordのボードにも反映されます。"); }
        else msg("ng", "⚠ " + ((res && res.error) || "BOTからの返事がありません。しばらくして、画面を確かめてください。"));
        return refresh();
      }).catch(function (e) { BUSY = false; msg("ng", "⚠ " + (e.message || "つながりませんでした。")); render(); });
  }
  function waitResult(nonce, tries) {
    return new Promise(function (resolve) {
      (function tick(n) {
        getJson(DATA_URL + "?t=" + Date.now()).then(function (d) {
          if (d && d.result && d.result.nonce === nonce) { resolve(d.result); }
          else if (n <= 0) resolve(null); else setTimeout(function () { tick(n - 1); }, 1200);
        });
      })(tries || 20);
    });
  }
  function refresh() {
    return getJson(DATA_URL + "?t=" + Date.now()).then(function (d) {
      if (!d || d.kind !== "bp") { stopped(); return; }
      var changed = !S || d.cur !== S.cur || d.n !== S.n || d.status !== S.status || d.stage !== S.stage || d.confirmed !== S.confirmed || d.start_at !== S.start_at || d.costume_pending !== S.costume_pending;
      if (changed) { SEL = []; NEWSTEP = true; }
      S = d; buildCH(d);
      if (changed || !$("work").firstChild) render();
    });
  }
  function stopped() {
    clearInterval(timer);
    document.querySelector("main").classList.add("view"); $("notice").textContent = ""; $("bar").textContent = "";
    var w = $("work"); w.textContent = "";
    var b = el("div", "stop"); b.appendChild(el("h2", "", "このBAN/PICKは、ブラウザでは入力できません"));
    b.appendChild(el("div", "", "終わったか、中止されたか、管理者が「Discordのボタンで進める」に切り替えました。Discordのボードの、案内に従ってください。"));
    w.appendChild(b);
  }
  function start() {
    if (!key || !BASE) { stopped(); return; }
    Promise.all([getJson(ASSET + "face_positions.json"), getJson(ASSET + "assets/face_positions.json")]).then(function (r) {
      FACES = (r[0] && r[0].faces) || (r[1] && r[1].faces) || {};
    }).then(refresh).then(function () {
      timer = setInterval(function () { if (!document.hidden && !BUSY) refresh(); }, 2500);          // 見ていないときは、取りに行かない
    });
  }
  if (window.BP_DEMO) window.BPX = {                                                     // 確認用のHTML（見る専門）からの操作。本番のページでは、使われない
    style: function (st) { BPX_LOCK = true; applyStyle(st); }, refresh: function () { return refresh(); },
    insert: function (kind) { PANEL_MIN = true; buildPanel(); var ids = Object.keys(CH).filter(function (k) { return CH[k].f === "s"; }), id = +ids[Math.floor(Math.random() * ids.length)], blk = document.querySelectorAll(".blk .drop"), dr = blk[Math.floor(Math.random() * blk.length)];
      if (!dr) return; var t0 = makeTag(CH[id], "locked"); flair(t0, CH[id], { a: kind === "b" ? "b" : "p" }); dr.appendChild(t0); setTimeout(function () { t0.remove(); }, 2200); },
    burst: function () { burst(); }, shutdown: function () { SHUT = false; var o = $("sp"); if (o) o.remove(); shutdown(); }, reset: function () { SHUT = false; PLAY_AT = 0; $("shell").classList.remove("off"); var m = document.querySelector(".shutmsg"); if (m) m.remove(); PANEL_MIN = false; buildPanel(); }
  };
  start();
})();

</script>
