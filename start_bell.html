<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>配信開始の鈴</title>
<!--
  配信開始の鈴（OBSのブラウザソース用。音だけ・背景は透明で、何も映りません）。
  配信開始の時刻（BOTが「配信開始の1分前」のお知らせでカウントダウンしている、0になる時刻）になると、
  「ちりん」と鈴の音を、間をあけて3回鳴らします。配信者が、配信を始める合図に使います。
  - URLは、配信用の画面（live.html）と同じ12文字（?t=…）。BOTが書く配信用のデータの、open_at（秒）を読みます。
    配信を始めたあと・中止したときは、open_at が空になるので、鳴りません。時刻を変えたときは、新しい時刻に鳴ります。
  - 鈴の音は、このページが作ります（音のファイルは、いりません）。ページを開いたとき、時刻をもう10秒以上過ぎていたら、鳴らしません。
  - 音量：&vol=0.8（0〜1。標準 0.8）。確認：&test=1 を付けると、開いてすぐ（ふつうのブラウザでは、画面をクリックしてから）鳴らします。&debug=1 で、左上に状態を出します。
  - OBSでは、ブラウザソースの「OBSで音声を制御」にチェックを入れると、OBSのミキサーで音量を調整できます。
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #st { display: none; position: fixed; left: 8px; top: 8px; font: 14px/1.4 sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 4px; }
  html.debug #st { display: block; }
</style>
</head>
<body>
<script>window.TOURNAMENT_DATA_BASE = "https://idv-tournament-bot-realtime-default-rtdb.asia-southeast1.firebasedatabase.app/tournament/"; window.PAGE_KIND = "bell";</script>
<div id="st"></div>
<script>
(function () {
  var params = new URLSearchParams(location.search);
  var VOL = Math.min(1, Math.max(0, parseFloat(params.get("vol") || "0.8") || 0.8));
  var POLL_MS = 2000, LATE_MS = 10000;
  var RINGS = 3, GAP = 1.8;                                         // 鈴を鳴らす回数／鳴らし始めから次の鳴らし始めまでの間（秒）
  if (params.get("debug")) document.documentElement.className = "debug";
  var st = document.getElementById("st");
  function status(t) { st.textContent = t; }

  // ── 鈴の音：高い金属音を、2つ重ねる「ち」「りん」。倍音は、整数倍ではない（鈴らしい響き）。すぐ鳴り始めて、ゆっくり消える ──
  var ctx = null;
  function audio() {
    if (!ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; ctx = new AC(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function ping(c, t, f, len) {
    var master = c.createGain();
    master.gain.setValueAtTime(0.0001, t);
    master.gain.exponentialRampToValueAtTime(VOL * 0.5, t + 0.004);
    master.gain.exponentialRampToValueAtTime(0.0001, t + len);
    master.connect(c.destination);
    [[1, 1], [2.76, 0.5], [5.4, 0.25], [8.9, 0.1]].forEach(function (p) {          // [倍率, 大きさ]：高い倍音ほど、早く消える
      var o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(f * p[0], t);
      g.gain.setValueAtTime(p[1], t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + len / (1 + p[0] * 0.35));
      o.connect(g); g.connect(master);
      o.start(t); o.stop(t + len + 0.05);
    });
  }
  function ring(c, t) { ping(c, t, 1760, 0.35); ping(c, t + 0.13, 2093, 1.3); }      // 「ち」→「りん」
  function ringAt(delaySec) {                                                          // いまから delaySec 秒あとに、3回
    var c = audio();
    if (!c) { status("音を出せません"); return false; }
    var t0 = c.currentTime + Math.max(0.02, delaySec);
    for (var i = 0; i < RINGS; i++) ring(c, t0 + i * GAP);
    return true;
  }

  // ── 時刻：BOTのデータの open_at（秒）。この時刻に、鳴らす。ページを開いたとき、時刻をもう過ぎすぎていたら、鳴らさない ──
  var armed = null, timer = null, rungFor = null;
  // 時刻ちょうどに鳴らすため、300ミリ秒前に起こして、残りは、音の側の時計で合わせる
  function arm(at) {
    if (at == null) { armed = null; clearTimeout(timer); status("鳴らす予定はありません"); return; }
    if (armed === at) return;
    armed = at; clearTimeout(timer);
    var wait = at * 1000 - Date.now();
    if (wait < -LATE_MS) { status("時刻を過ぎています：" + new Date(at * 1000).toLocaleTimeString()); return; }
    status("鳴らす時刻：" + new Date(at * 1000).toLocaleTimeString());
    audio();
    timer = setTimeout(function () {
      if (rungFor === at) return;
      rungFor = at;
      if (ringAt(Math.max(0, at - Date.now() / 1000))) status("鳴らしました：" + new Date().toLocaleTimeString());
    }, Math.max(0, wait - 300));
  }

  function load() {
    var base = window.TOURNAMENT_DATA_BASE, key = params.get("t") || "";
    if (!base || !/^[A-Za-z0-9]{12}$/.test(key)) { status("このページは、大会のURL（主催者から案内されたもの）から開いてください。"); return; }
    var path = key + ".json";
    function tick() {
      fetch(base + path + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) { arm(d && typeof d.open_at === "number" ? d.open_at : null); })
        .catch(function () { status("データを読み込めませんでした"); });
    }
    tick();
    setInterval(tick, POLL_MS);
    try {
      var es = new EventSource(base + path), last = 0;                                  // 変わった瞬間に読み直す
      var nudge = function () { var n = Date.now(); if (n - last > 150) { last = n; tick(); } };
      es.addEventListener("put", nudge); es.addEventListener("patch", nudge);
    } catch (e) { /* 使えない環境では、数秒おきの読み直しだけ */ }
  }

  // ふつうのブラウザは、画面をクリックするまで、音を出せない（OBSのブラウザソースは、すぐ出せる）
  ["pointerdown", "keydown"].forEach(function (ev) { window.addEventListener(ev, function () { audio(); }, { once: false }); });
  if (params.get("test")) {                                                              // 確認用：いま、鳴らす（クリックでも）
    status("確認：クリックすると、鳴ります");
    var once = function () { ringAt(0.05); status("確認で、鳴らしました"); };
    window.addEventListener("pointerdown", once, { once: true });
    setTimeout(function () { if (audio() && ctx.state === "running") { window.removeEventListener("pointerdown", once); once(); } }, 400);
  } else {
    load();
  }
})();
</script>
</body>
</html>
