<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAN/PICK</title>
<meta name="robots" content="noindex,nofollow">
<style>
  :root {
    --bg: #0b1230; --panel: #121a3d; --panel2: #1a2450; --text: #eceff6; --sub: #98a1b5;
    --line: #3a4a86; --accent: #ffb020; --chip: #2c3a70; --glow: #1f2c66;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
               font-family: "Yu Gothic UI", "Hiragino Sans", "Meiryo", system-ui, sans-serif; }
  html[data-bg="transparent"], html[data-bg="transparent"] body { background: transparent; }

  /* 表示は2種類：
     stage … 横長の画面（OBSの1920x1080など）でのBAN/PICKの画面。1920x1080の固定ステージを、画面に合わせて拡縮する（スクロールなし）
     flow  … ルール表示と、縦長・狭い画面（スマホ）。画面の幅に合わせて文字の大きさ・並びが変わり、はみ出したらスクロールできる */
  html.stage, html.stage body { height: 100%; overflow: hidden; }
  html.flow { font-size: clamp(15px, 1.5vw, 32px); }
  html.flow, html.flow body { min-height: 100%; overflow-x: hidden; overflow-y: auto; }
  @media (max-width: 900px) { html.flow { font-size: clamp(16px, 4.3vw, 22px); } }

  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; }
  html.flow #stage { position: relative; width: auto; height: auto; transform: none !important; left: auto !important;
                     top: auto !important; overflow: visible; min-height: 100vh; }
  #bg { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 35%, var(--glow), var(--bg) 72%); }
  html[data-bg="transparent"] #bg { display: none; }
  #bgmedia { position: absolute; inset: 0; overflow: hidden; }
  #bgmedia > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; border: 0; pointer-events: none; }
  html.flow #bg, html.flow #bgmedia { position: fixed; z-index: 0; }
  #screen { position: absolute; inset: 0; z-index: 2; }
  html.flow #screen { position: relative; inset: auto; z-index: 2; }
  #msg { position: absolute; left: 0; right: 0; bottom: 14px; text-align: center; font-size: 22px; color: var(--sub); z-index: 2; }
  html.flow #msg { position: relative; bottom: auto; padding: 1em; font-size: .9em; }

  /* ═══ stage：BAN/PICK の画面（1920x1080） ═══ */
  .hdr { position: absolute; height: 78px; display: flex; align-items: center; justify-content: center;
         background: var(--panel); border: 2px solid var(--line); font-size: 40px; font-weight: 800; letter-spacing: .04em; }
  .sq { position: absolute; width: 78px; height: 78px; background: var(--panel); border: 2px solid var(--line);
        display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .sq img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .sq.used img, .sq.used .emo { filter: grayscale(1) brightness(.85); }
  .sq .lock { font-size: 30px; opacity: .55; }
  .sq .emo { font-size: 44px; }

  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 296px; display: flex; gap: 8px; padding: 0 4px 0 0; }
  .surv { flex: 0 0 760px; display: flex; gap: 6px; }
  .hunt { flex: 1; display: flex; }
  .card { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column;
          background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 3px double var(--accent); }
  .card .art { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .card .art img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .card .art .emo { font-size: 110px; }
  .card .art .q { font-size: 90px; color: var(--sub); opacity: .5; }
  .card .cap { height: 52px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 24px;
               font-weight: 700; border-top: 2px solid var(--accent); background: var(--panel); white-space: nowrap;
               overflow: hidden; text-overflow: ellipsis; padding: 0 6px; }
  /* ハンターは体が小さく見えやすいので、少し拡大して、上のほう（顔・上半身）に合わせて見せる */
  .hunt .card .art { align-items: flex-start; }
  .hunt .card .art img { object-fit: contain; object-position: 50% 0; transform: scale(1.4); transform-origin: 50% 0; }

  .center { flex: 0 0 412px; background: linear-gradient(180deg, var(--panel2), var(--panel)); border: 3px double var(--accent);
            display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 8px 12px; }
  .center .ttl { font-size: 38px; font-weight: 800; letter-spacing: .04em; line-height: 1.1; }
  .center .st { font-size: 34px; font-weight: 800; color: var(--accent); letter-spacing: .08em; margin-bottom: 8px; }
  .center .vs { display: flex; align-items: center; justify-content: space-between; width: 100%; font-size: 40px; font-weight: 800; }
  .center .vs .tm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .center .vs .mid { flex: none; padding: 0 12px; font-size: 44px; font-style: italic; }
  .center .role { display: flex; width: 100%; justify-content: space-between; font-size: 15px; color: var(--sub); letter-spacing: .12em; }
  .center .sc { display: flex; width: 100%; justify-content: space-between; margin-top: 4px; }
  .center .sc div { flex: 1; font-size: 64px; font-weight: 900; line-height: 1; }
  .center .sc small { display: block; font-size: 22px; font-weight: 800; letter-spacing: .06em; margin-top: 2px; }
  .center .map { margin-top: 8px; font-size: 22px; color: var(--sub); }
  .center .map b { color: var(--text); }

  /* キャラに対応する画像・動画：他の要素よりも**下の層**に、画面の背景として出す。縦横の比率は変えずに、画面を埋めるまで拡大する
     （長いほうの辺に合わせて拡大。はみ出した分は切る）。カードなどの表示は、この上に重なる */
  #media { position: absolute; inset: 0; overflow: hidden; display: flex; align-items: center; justify-content: center;
           transition: opacity .5s; opacity: 0; pointer-events: none; z-index: 1; }
  #media.on { opacity: 1; }
  #media > * { width: 100%; height: 100%; object-fit: cover; border: 0; }
  html.flow #media { position: fixed; inset: 0; }
  html.flow #media:not(.on) { display: none; }
  /* YouTube：独自のプレーヤー枠（YouTubeの再生画面は、そのまま出さない）。16:9のまま画面に収まる最大の大きさにして、枠より外は切る。
     中のYouTubeの画面は、少し拡大して、上のタイトル・チャンネルのアイコン／下の透かしなどが出る縁を、枠の外に押し出す。
     再生中以外（読み込み・一時停止・終了）は、黒い幕で全部隠す。クリックも受け付けない */
  .ytwrap { position: relative; width: 100%; height: 100%; overflow: hidden; background: transparent; pointer-events: none; }
  .ytbox { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 100%; aspect-ratio: 16 / 9;
           overflow: hidden; background: #000; }
  html.flow .ytbox { width: max(100vw, calc(100vh * 16 / 9)); }               /* 画面を埋めるまで拡大（長辺に合わせる）。はみ出しは切る */
  .ytbox iframe, .ytbox .ythost { position: absolute; left: 0; top: 0; width: 100%; height: 100%; border: 0; pointer-events: none;
                                   transform: scale(var(--ytzoom, 1.2)); transform-origin: 50% 50%; }
  .ytcover { position: absolute; inset: 0; background: #000; opacity: 1; transition: opacity .7s; pointer-events: none; z-index: 2; }
  .ytcover.off { opacity: 0; }
  /* ═══ flow：スマホなど狭い画面のBAN/PICKの画面（幅に合わせて並べる） ═══ */
  .cp { max-width: 70em; margin: 0 auto; padding: .8em; display: flex; flex-direction: column; gap: .8em; }
  .cp .box { background: var(--panel); border: 2px double var(--accent); padding: .7em .9em; }
  .cp .head { text-align: center; }
  .cp .head .ttl { font-size: 1.5em; font-weight: 800; letter-spacing: .04em; }
  .cp .head .st { font-size: 1.1em; font-weight: 800; color: var(--accent); letter-spacing: .08em; }
  .cp .vs { display: flex; align-items: center; justify-content: space-between; gap: .5em; margin-top: .4em; font-size: 1.5em; font-weight: 800; }
  .cp .vs .tm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .cp .vs .mid { flex: none; font-style: italic; }
  .cp .role { display: flex; justify-content: space-between; font-size: .7em; color: var(--sub); letter-spacing: .12em; }
  .cp .sc { display: flex; justify-content: space-between; }
  .cp .sc div { flex: 1; font-size: 2.6em; font-weight: 900; line-height: 1.1; text-align: center; }
  .cp .sc small { display: block; font-size: .38em; font-weight: 800; letter-spacing: .06em; }
  .cp .map { margin-top: .3em; text-align: center; color: var(--sub); }
  .cp .map b { color: var(--text); }
  .cp h3 { margin: 0 0 .45em; font-size: 1em; color: var(--accent); letter-spacing: .08em; }
  .cp .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(4.4em, 1fr)); gap: .5em; }
  .cp .hunt1 { max-width: 14em; }
  .cp .card { aspect-ratio: 3 / 4.4; min-width: 0; }
  .cp .card .art .emo { font-size: 3.4em; }
  .cp .card .art .q { font-size: 2.6em; }
  .cp .card .cap { height: auto; min-height: 2em; font-size: .85em; white-space: normal; padding: .2em .3em; text-align: center; }
  .cp .hunt1 .card .art { align-items: flex-start; }
  .cp .hunt1 .card .art img { object-fit: contain; object-position: 50% 0; transform: scale(1.4); transform-origin: 50% 0; }
  .cp .bans { margin-bottom: .5em; }
  .cp .smalls { display: flex; flex-wrap: wrap; gap: .4em; }
  .cp .fsq { width: 3.6em; height: 3.6em; background: var(--panel2); border: 2px solid var(--line);
             display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .cp .fsq img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
  .cp .fsq.used img, .cp .fsq.used .emo { filter: grayscale(1) brightness(.85); }
  .cp .fsq .lock { font-size: 1.2em; opacity: .55; }
  .cp .fsq .emo { font-size: 1.8em; }
  .cp .two { display: grid; grid-template-columns: 1fr 1fr; gap: .8em; }
  @media (max-width: 600px) { .cp .two { grid-template-columns: 1fr; } }

  /* ═══ flow：ルール表示（待機中） ═══ */
  .rv { max-width: 96em; margin: 0 auto; padding: 1em; }
  .rv .box { background: var(--panel); border: 3px double var(--accent); padding: 1em 1.3em; }
  .rv .head { display: flex; flex-wrap: wrap; align-items: center; gap: .5em .8em; }
  .rv .head h1 { margin: 0; font-size: 2.6em; line-height: 1.1; letter-spacing: .04em; }
  .rv .pill { font-size: 1.1em; font-weight: 800; padding: .1em .8em; border-radius: 999px; border: 2px solid var(--accent);
              color: var(--accent); white-space: nowrap; }
  .rv .pill.mode { margin-left: auto; color: var(--text); border-color: var(--line); background: var(--chip); }
  .rv .vs { margin-top: .3em; font-size: 1.5em; font-weight: 800; overflow-wrap: anywhere; }
  .rv .vs small { font-size: .6em; color: var(--sub); font-weight: 600; margin-left: .7em; }
  .rv .note { margin-top: .6em; padding: .45em .8em; line-height: 1.45; border-left: .3em solid var(--accent); background: var(--chip); }
  .rv .tabs { display: flex; flex-wrap: wrap; gap: .4em; margin-bottom: .8em; }
  .rv .tabs button { font: inherit; font-weight: 800; cursor: pointer; padding: .35em .9em; border-radius: .6em;
                     border: 2px solid var(--line); background: var(--chip); color: var(--text); }
  .rv .tabs button.on { background: var(--accent); border-color: var(--accent); color: #111; }
  .rv .tabs .hint { align-self: center; font-size: .8em; color: var(--sub); }
  .rv .cols { margin-top: .9em; display: grid; gap: .6em 1.6em; grid-template-columns: 1.15fr 1fr;
              grid-template-areas: "global steps" "round steps"; align-items: start; }
  .rv .c-global { grid-area: global; } .rv .c-round { grid-area: round; } .rv .c-steps { grid-area: steps; }
  @media (max-width: 900px) {
    .rv .cols { grid-template-columns: 1fr; grid-template-areas: "global" "round" "steps"; }
    .rv .head h1 { font-size: 2em; }
    .rv .pill { white-space: normal; text-align: center; }
    .rv .pill.mode { margin-left: 0; }
    .rv .tabs button { padding: .3em .7em; }
    .rv .row { flex-direction: column; gap: .05em; padding: .4em 0; }            /* スマホでは、タイトル（ラベル）と内容を横に並べず、改行して縦に並べる */
    .rv .row .lb { min-width: 0; }
  }
  .rv h2 { margin: 0 0 .35em; font-size: 1.1em; color: var(--accent); letter-spacing: .08em; border-bottom: 2px solid var(--line); padding-bottom: .15em; }
  .rv .sec { margin-bottom: .5em; }
  .rv .row { display: flex; gap: .8em; align-items: baseline; padding: .25em 0; line-height: 1.45; }
  .rv .row .lb { flex: none; min-width: 6.5em; font-weight: 800; color: var(--accent); }
  .rv .row .tx { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .rv ol { margin: 0; padding: 0 0 0 1.6em; }
  .rv ol li { line-height: 1.55; }
  .rv .none { color: var(--sub); }
  /* ═══ アニメーション ═══ */
  @keyframes popIn { 0% { transform: scale(.4); opacity: 0; filter: brightness(2.2); } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); opacity: 1; filter: none; } }
  .pop { animation: popIn .6s ease-out both; }
  @keyframes bpIn { from { opacity: 0; } to { opacity: 1; } }       /* transform は使わない（absolute の子の基準が、高さ0の枠に変わってしまうため） */
  .bpwrap { animation: bpIn .6s ease-out both; }
  /* 終わりのアニメーション：BAN/PICKの画面が、上へ流れて消え、背景も透明になる。そのあとは、すべて透明（後ろのゲーム画面が見える） */
  @keyframes wipeOut { to { transform: translateY(-110%); opacity: 0; } }
  html.leaving #screen { animation: wipeOut 1s ease-in both; }
  html.leaving #bg, html.leaving #bgmedia, html.leaving #media { opacity: 0; transition: opacity 1s .2s; }
  html.clear #bg, html.clear #bgmedia, html.clear #media, html.clear #screen, html.clear #msg { display: none; }
  html.clear, html.clear body { background: transparent; }

  /* ═══ 成績の画面（TODAY'S RESULT） ═══ */
  .rs { position: absolute; inset: 0; --ta: #6aa84f; --tb: #8a63b5; }
  html.flow .rs { position: relative; inset: auto; padding: .8em; max-width: 60em; margin: 0 auto; }
  .rs-title { position: absolute; left: 0; right: 0; top: 40px; text-align: center; font-size: 120px; font-weight: 900; letter-spacing: .02em;
              color: var(--accent); text-shadow: 0 4px 20px rgba(0,0,0,.5); }
  .rs-board { position: absolute; left: 170px; right: 170px; top: 235px; bottom: 150px; display: grid;
              grid-template-columns: 400px 1fr 400px; border: 3px solid rgba(255,255,255,.12); }
  .rs-team { display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 36px 10px 20px; text-align: center; }
  .rs-team.a { background: var(--ta); } .rs-team.b { background: var(--tb); }
  .rs-team .logo { width: 170px; height: 170px; border-radius: 50%; border: 6px solid rgba(255,255,255,.9); display: flex; align-items: center;
                   justify-content: center; font-size: 56px; font-weight: 900; color: #fff; overflow: hidden; }
  .rs-team .logo img { width: 100%; height: 100%; object-fit: cover; }
  .rs-team .tn { font-size: 64px; font-weight: 800; color: #fff; line-height: 1.1; overflow-wrap: anywhere; }
  .rs-team .wl { font-size: 84px; font-weight: 900; min-height: 1.1em; color: #fff; }
  .rs-team .wl.win { color: #ffd27a; } .rs-team .wl.lose { color: #fff; }
  .rs-team .pt { font-size: 190px; font-weight: 900; color: #fff; line-height: 1; }
  .rs-rows { display: grid; grid-template-rows: repeat(4, 1fr); background: #0a0f1f; }
  .rs-row { display: flex; flex-direction: column; align-items: center; justify-content: center; border-bottom: 3px solid rgba(255,255,255,.18);
            background: linear-gradient(90deg, rgba(0,0,0,.55), rgba(40,50,80,.35), rgba(0,0,0,.55)); }
  .rs-row:last-child { border-bottom: 0; }
  .rs-row .lb { font-size: 40px; font-weight: 800; color: #fff; letter-spacing: .02em; }
  .rs-row .sc { font-size: 110px; font-weight: 900; color: #fff; line-height: 1.05; }
  .rs-next { position: absolute; right: 60px; bottom: 44px; font-size: 48px; font-weight: 900; color: var(--accent); letter-spacing: .04em;
             text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  @keyframes inL { from { transform: translateX(-120%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes inR { from { transform: translateX(120%); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes drop { from { transform: translateY(-80px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: scaleY(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes fadeUp { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
  .rs.enter .rs-title { animation: drop .7s ease-out both; }
  .rs.enter .rs-team.a { animation: inL .9s cubic-bezier(.2,.8,.2,1) both; }
  .rs.enter .rs-team.b { animation: inR .9s cubic-bezier(.2,.8,.2,1) both; }
  .rs.enter .rs-row { animation: rise .6s ease-out both; }
  .rs.enter .rs-next { animation: fadeUp .8s 1s ease-out both; }
  /* 縦長・狭い画面：成績を縦に並べる（チーム2つを横に、その下にセットごとの得点） */
  html.flow .rs-title, html.flow .rs-board, html.flow .rs-next { position: static; }
  html.flow .rs-title { font-size: 2em; padding: .3em 0 .4em; }
  html.flow .rs-board { display: grid; grid-template-columns: 1fr 1fr; grid-template-areas: "a b" "rows rows"; gap: 0; }
  html.flow .rs-team.a { grid-area: a; } html.flow .rs-team.b { grid-area: b; } html.flow .rs-rows { grid-area: rows; grid-template-rows: none; }
  html.flow .rs-team { padding: .8em .4em; gap: .3em; }
  html.flow .rs-team .logo { width: 3.6em; height: 3.6em; font-size: 1.1em; border-width: 3px; }
  html.flow .rs-team .tn { font-size: 1.3em; } html.flow .rs-team .wl { font-size: 1.5em; } html.flow .rs-team .pt { font-size: 3.6em; }
  html.flow .rs-row { padding: .4em 0; } html.flow .rs-row .lb { font-size: .9em; } html.flow .rs-row .sc { font-size: 2.2em; }
  html.flow .rs-next { text-align: right; font-size: 1.2em; padding: .8em .2em 0; }
  .idle { padding: 30vh 1em 0; text-align: center; font-size: 1.8em; font-weight: 800; letter-spacing: .08em; color: var(--sub); }
</style>
</head>
<body>
<script>window.TOURNAMENT_DATA_BASE = "https://idv-tournament-bot-realtime-default-rtdb.asia-southeast1.firebasedatabase.app/tournament/"; window.PAGE_KIND = "live";</script>
<div id="stage">
  <div id="bg"></div>
  <div id="bgmedia"></div>
  <div id="screen"></div>
  <div id="media"></div>
  <div id="msg"></div>
</div>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  if (params.get("bg") === "transparent") document.documentElement.setAttribute("data-bg", "transparent");
  var POLL_MS = 2000, MEDIA_MS = 10000;
  var root = document.documentElement;
  var stageEl = document.getElementById("stage");
  var screenEl = document.getElementById("screen");
  var mediaBox = document.getElementById("media");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function arr(x) { return Array.isArray(x) ? x : (x && typeof x === "object" ? Object.keys(x).map(function (k) { return x[k]; }) : []); }

  // ── 表示の種類：BAN/PICKの画面で、横長なら stage（1920x1080を拡縮）／ルール表示・縦長・狭い画面は flow ──
  var lastData = null, kind = "flow";
  function wantKind(data) {
    var big = data && (data.state === "play" || data.state === "result");                  // BAN/PICKの画面・成績の画面
    if (params.get("layout") === "stage" && big) return "stage";      // 確認用：URLに &layout=stage を付けると、画面の形に関係なく1920x1080の表示にする
    if (big && window.innerWidth / Math.max(1, window.innerHeight) >= 1.25) return "stage";
    return "flow";
  }
  function fit() {
    if (kind !== "stage") return;
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stageEl.style.transform = "scale(" + s + ")";
    stageEl.style.left = Math.max(0, (window.innerWidth - 1920 * s) / 2) + "px";
    stageEl.style.top = Math.max(0, (window.innerHeight - 1080 * s) / 2) + "px";
  }
  window.addEventListener("resize", function () {
    if (lastData && wantKind(lastData) !== kind) render(lastData, true); else fit();
  });

  // ── 大会のテーマカラー：ベース色（背景）とアクセント色から、パネル・線・文字の色を作る（未設定なら標準の色） ──
  function hex2rgb(h) { var n = parseInt(h.replace("#", ""), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
  function rgb2css(c) { return "rgb(" + c.map(function (v) { return Math.round(v); }).join(",") + ")"; }

  // 時間は、「試合開始」の時刻（play_started_at）から、このブラウザの時計で数える（BOTの操作に合わせてリアルタイムには出ない）。
  var STEP_MS = 5000, LAST_MS = 10000, EXIT_MS = 1200;
  var replay = null;
  function replayTotal(n) { return STEP_MS * Math.max(0, n - 1) + LAST_MS; }

      if (it && it.media && it.s <= k) {

  function tickReplay() {

      if (r.phase !== "clear") { r.phase = "clear"; setPhase("clear"); setMedia([]); screenEl.replaceChildren(); }
      return;
    }
    if (elapsed >= total) {                                    // 終わりのアニメーション（最後の手順の画面が、流れて消える）
      if (r.phase !== "exit") {

  }
  function startReplay(lv) {

    replay = { key: lv.key, start: isNaN(start) ? Date.now() : start, lv: lv, step: -2, phase: "" };
    if (!replay.timer) replay.timer = setInterval(tickReplay, 250);

    if (replay && replay.timer) clearInterval(replay.timer);
    replay = null;
    setPhase(null);
  }

  var lastSig = null;
  function render(data, force) {
    if (!data) data = { state: "idle" };
    if (window.PAGE_KIND === "rules" && data.state !== "rules") data = { state: "idle", title: data.title };    // ルールだけのページには、ルール以外は出さない
    var sig = JSON.stringify(data, function (k, v) { return k === "generated_at" ? undefined : v; });
    if (sig === lastSig && !force) return;
    lastSig = sig;
    lastData = data;
    applyTheme(data.theme);
    setBackground(data.bg);
    kind = wantKind(data);
    root.className = kind;
    document.getElementById("msg").textContent = "";
    if (data.state === "play" && data.live) {
      if (replay && replay.key === data.live.key) {            // 同じ試合開始：時間は、そのまま数え続ける（画面の形が変わったときなどは、描き直す）
        replay.lv = data.live;
        replay.step = -2; replay.phase = replay.phase === "clear" || replay.phase === "exit" ? replay.phase : "";
        if (replay.phase === "exit") { renderPlayStep(replay.lv, (replay.lv.n_steps || 1) - 1); setPhase("leaving"); }
        if (replay.phase === "clear") setPhase("clear");
        tickReplay();
      } else {
        stopReplay();
        root.className = kind;
        startReplay(data.live);
      }
      return;
    }
    stopReplay();
    root.className = kind;
    var media = [];
    if (data.state === "result") renderResult(data.result || {});
    else if (data.state === "rules") renderRules(data.rules || {});
    else renderIdle(data);
    stageEl.appendChild(mediaBox);
    setMedia(media);
    fit();
  }
  // ── データの読み込み：URLの ?t=（大会ごとの12文字）の大会だけ、数秒おきに読み直す ──
  function load() {
    var base = window.TOURNAMENT_DATA_BASE;
    var key = params.get("t") || "";
    if (!/^[A-Za-z0-9]{12}$/.test(key)) {
      document.getElementById("msg").textContent = "このページは、大会のURL（主催者から案内されたもの）から開いてください。";
      return false;
    }
    // ページの種類：rules＝ルールだけの公開ページ（公開用の12文字の rules を読む）／live＝配信用の画面（配信専用の12文字の場所を読む）
    var path = window.PAGE_KIND === "rules" ? key + "/rules.json" : key + ".json";
    function tick() {
      fetch(base + path + "?t=" + Date.now(), { cache: "no-store" })
        .then(function (r) { return r.json(); })
        .then(function (d) { render(d); })
        .catch(function () {
          if (lastSig === null) document.getElementById("msg").textContent = "データを読み込めませんでした。しばらくしてからもう一度開いてください。";
        });
    }
    tick();
    setInterval(tick, POLL_MS);
    return true;
  }

  root.className = "flow";
  if (window.BANPICK_DATA_EMBEDDED) render(window.BANPICK_DATA_EMBEDDED);      // 動作確認用（データを直接埋め込んだとき）
  else if (window.TOURNAMENT_DATA_BASE) load();
  else document.getElementById("msg").textContent = "データの場所が設定されていません。";
})();
</script>
</body>
</html>
