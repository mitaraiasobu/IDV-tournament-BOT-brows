<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャスター表示</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@500;800;900&display=swap">
<!--
  キャスターの表示（OBSのブラウザソースに入れる、背景が透明のページ）。BAN/PICKの配信用の画面（live.html）とは別のページ。
  - キャスターのDiscordのアイコンとニックネーム、アイコンにつける装飾（任意）を映す。
  - 装飾は、**画像**（透明なPNG。正方形：1024×1024px）。アイコンを入れる**透明な丸い穴**を作っておく
    （基準画像：GitHubの icon/icon_deco_standard.png。穴の直径は382px。アイコンは小さめ・装飾は大きめに飾れる）。
    穴の位置と大きさは、ページが画像から**自動で見つけて**、**穴の大きさが、装飾なしのときのアイコンの大きさと同じ**になるように、装飾の画像を拡大して重ねる
    （アイコンの位置・大きさは、装飾の有無で変えない。装飾の画像が、アイコンのまわりに、はみ出して広がる）。
    装飾の画像は、アイコンより**上の層**に重ねる（アイコンの、はみ出した分は、装飾の下に隠れる）。
  - 発言しているときは、アイコンが通常の明るさで、ゆっくり、ぴょこぴょこ動く。発言していないときは、暗くなって、動かない。
  - BAN/PICKの表示中とゲームプレイ中は、画面の左下に小さく。それ以外のときは、下の中央に大きめに。
  - データは、BOTが、配信用の画面と同じ場所（配信専用の12文字）に書く。公開サイトでは、URLの ?t=（配信専用の12文字）で読む。
    確認用：?demo=1（BOTなしで、見本を表示。&scene=small／large で、置き場所を固定。付けないと、10秒ごとに切り替わる。
    &deco=装飾の画像のURL で、別の装飾を試せる。&nodeco=1 で、2人目の装飾なし。&one=1 で、1人だけ）
-->
<style>
  :root { --uw: 380px; --av: .88; }                  /* --av：アイコンの大きさ（枠の幅に対する割合）。装飾の有無で変えない。装飾は、穴がこの大きさになるように拡大する */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; font-family: "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif; }
  #stage { position: fixed; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; pointer-events: none; }
  /* 置き場所：large＝下の中央に大きめ／small＝左下に小さく（画面の端。ゲームの邪魔にならないように） */
  #casters { position: absolute; bottom: 20px; display: flex; align-items: flex-end; justify-content: center;
             transition: left .7s cubic-bezier(.3, .7, .2, 1), transform .7s cubic-bezier(.3, .7, .2, 1), gap .7s, bottom .7s; }
  #casters.large { --uw: 380px; left: 50%; transform: translateX(-50%); gap: 70px; }
  #casters.small { --uw: 150px; left: 24px; transform: translateX(0); gap: 14px; bottom: 16px; }
  .cast { width: var(--uw); transition: width .7s cubic-bezier(.3, .7, .2, 1), opacity .5s; opacity: 0; animation: castIn .6s ease-out forwards; }
  @keyframes castIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .cast .body { position: relative; width: 100%; aspect-ratio: 1 / 1; transform-origin: 50% 100%;
                filter: brightness(.38) saturate(.6); transition: filter .35s ease; }
  .cast.speaking .body { filter: none; animation: hop 1.7s ease-in-out infinite; }              /* 発言中：ゆっくり、ぴょこぴょこ */
  @keyframes hop {
    0%, 100% { transform: translateY(0) scale(1, 1); }
    20% { transform: translateY(-5%) scale(.98, 1.03); }
    38% { transform: translateY(0) scale(1.03, .97); }
    52% { transform: translateY(-2%) scale(.99, 1.01); }
    66% { transform: translateY(0) scale(1, 1); }
  }
  .cast .av { position: absolute; border-radius: 50%; object-fit: cover; background: #222; display: block; }
  .cast.plain .av { left: 6%; top: 6%; width: 88%; height: 88%; box-shadow: 0 0 0 4px rgba(255, 255, 255, .85), 0 6px 18px rgba(0, 0, 0, .55); }
  /* 装飾つき：アイコン（.av）は、装飾なしと同じ中心（枠の中央）で、大きさだけ0.8倍（88% × 0.8 ＝ 70.4%）。穴の大きさ（下のAV）は、そのまま。
     装飾（.dc）の大きさと位置だけを、装飾の画像から、下のスクリプトが計算して、書き込む（穴の中心を、アイコンの中心に、穴の大きさを、アイコンの大きさに合わせる）。
     装飾は、アイコンより上の層。計算が終わるまで、アイコンは隠しておく。 */
  .cast.deco .av { z-index: 1; left: 14.8%; top: 14.8%; width: 70.4%; height: 70.4%; visibility: hidden; }
  .cast.deco.ready .av { visibility: visible; }
  .cast.deco .dc { position: absolute; z-index: 2; max-width: none; pointer-events: none; }
  .cast.deco .nm { position: relative; z-index: 3; }
  .cast .nm { margin-top: calc(var(--uw) * .02); text-align: center; color: #fff; font-weight: 900; letter-spacing: .04em;
              font-size: calc(var(--uw) * .105); line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
              text-shadow: 0 2px 0 rgba(0, 0, 0, .7), 0 0 12px rgba(0, 0, 0, .8); transition: opacity .35s, font-size .7s; opacity: .55; }
  .cast.speaking .nm { opacity: 1; }
</style>
</head>
<body>
<script>window.TOURNAMENT_DATA_BASE = "https://idv-tournament-bot-realtime-default-rtdb.asia-southeast1.firebasedatabase.app/tournament/"; window.PAGE_KIND = "caster";</script>
<div id="stage"><div id="casters" class="large"></div></div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var stage = document.getElementById("stage"), box = document.getElementById("casters");
  var POLL_MS = 1000;

  // 装飾（アイコンにつける飾り）：名前 → 画像のURL（と、画像の中で使う範囲 crop。省略すると、画像ぜんぶ）。
  // データの deco は、ここの名前でも、画像のURL（https:// か data:image/）でも、よい。
  var STANDARD = "https://raw.githubusercontent.com/mitaraiasobu/IDV-tournament-BOT-brows/main/icon/icon_deco_standard.png";   // 基準画像（確認用）
  var DECOS = {
    standard: { url: STANDARD, crop: null }
  };
  function decoOf(v) {
    if (!v) return null;
    if (DECOS[v]) return DECOS[v];
    if (/^(https:\/\/|data:image\/)/.test(v)) return { url: v, crop: null };
    return null;
  }

  function fit() {
    var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    stage.style.transform = "scale(" + s + ")";
  }
  window.addEventListener("resize", fit);
  fit();

  // ── 装飾の画像から、アイコンを入れる「透明な丸い穴」を、自動で見つける ──
  // 画像のふちにつながっていない、透明な部分のうち、いちばん大きいものを、穴とする。その外接する四角の中心と、大きいほうの辺（直径）を返す。
  // 穴が見つからなければ、画像の中央に、画像の短い辺の半分の丸があるものとする。座標は、画像そのもの（ピクセル）で返す。
  function findHole(img) {
    var W = img.naturalWidth, H = img.naturalHeight, s = Math.min(1, 512 / Math.max(W, H));
    var w = Math.max(1, Math.round(W * s)), h = Math.max(1, Math.round(H * s));
    var cv = document.createElement("canvas"); cv.width = w; cv.height = h;
    var cx = cv.getContext("2d", { willReadFrequently: true });
    cx.drawImage(img, 0, 0, w, h);
    var data;
    try { data = cx.getImageData(0, 0, w, h).data; } catch (e) { data = null; }        // 別の場所の画像で、読み取りが許されないとき
    var fallback = { cx: W / 2, cy: H / 2, d: Math.min(W, H) / 2 };
    if (!data) return fallback;
    var seen = new Uint8Array(w * h), stack = new Int32Array(w * h), best = null;
    function empty(i) { return data[i * 4 + 3] < 24; }
    for (var start = 0; start < w * h; start++) {
      if (seen[start] || !empty(start)) continue;
      var sp = 0, minx = w, miny = h, maxx = -1, maxy = -1, size = 0, border = false;
      stack[sp++] = start; seen[start] = 1;
      while (sp) {
        var i = stack[--sp], x = i % w, y = (i - x) / w;
        size++;
        if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) border = true;
        if (x > 0 && !seen[i - 1] && empty(i - 1)) { seen[i - 1] = 1; stack[sp++] = i - 1; }
        if (x < w - 1 && !seen[i + 1] && empty(i + 1)) { seen[i + 1] = 1; stack[sp++] = i + 1; }
        if (y > 0 && !seen[i - w] && empty(i - w)) { seen[i - w] = 1; stack[sp++] = i - w; }
        if (y < h - 1 && !seen[i + w] && empty(i + w)) { seen[i + w] = 1; stack[sp++] = i + w; }
      }
      if (!border && size > 20 && (!best || size > best.size)) best = { size: size, minx: minx, miny: miny, maxx: maxx, maxy: maxy };
    }
    if (!best) return fallback;
    return { cx: (best.minx + best.maxx + 1) / 2 / s, cy: (best.miny + best.maxy + 1) / 2 / s,
             d: Math.max(best.maxx - best.minx + 1, best.maxy - best.miny + 1) / s };
  }
  var decoCache = {};                                              // 画像のURL → {W, H, hole}（同じ装飾は、1回だけ調べる）
  function decoInfo(url) {
    if (!decoCache[url]) {
      decoCache[url] = new Promise(function (resolve) {
        var img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = function () { resolve({ W: img.naturalWidth, H: img.naturalHeight, hole: findHole(img) }); };
        img.onerror = function () { resolve(null); };
        img.src = url;
      });
    }
    return decoCache[url];
  }
  // 装飾の画像と、その穴の位置から、装飾の大きさと位置を決める（枠＝正方形に対する割合）。
  // 穴の大きさ＝装飾なしのときのアイコンの大きさ（AV）、穴の中心＝アイコンの中心（枠の中央）になるように、画像を拡大して、ずらす。
  var AV = 0.88;
  function layoutDeco(el, deco, info) {
    var dc = el.querySelector(".dc");
    var k = AV / info.hole.d;                                      // 画像の1ピクセルが、枠の幅の何割にあたるか
    dc.style.width = (info.W * k * 100) + "%";
    dc.style.left = ((0.5 - info.hole.cx * k) * 100) + "%";
    dc.style.top = ((0.5 - info.hole.cy * k) * 100) + "%";
    el.classList.add("ready");
  }

  var shown = {};                      // 名前の順番（行）ごとに、作った要素を覚えておく（毎回作り直すと、動きが途切れるので）
  function render(data) {
    var c = (data && data.casters) || null;
    var items = (c && c.items) || [];
    var scene = (c && c.scene) === "small" ? "small" : "large";
    box.className = scene;
    var keep = {};
    items.forEach(function (it, i) {
      var key = i + ":" + (it.name || "") + ":" + (it.deco || "");
      keep[key] = true;
      var el = shown[key];
      if (!el) {
        el = document.createElement("div");
        var deco = decoOf(it.deco);
        el.className = "cast " + (deco ? "deco" : "plain");
        var body = document.createElement("div"); body.className = "body";
        var av = document.createElement("img"); av.className = "av"; av.alt = "";
        body.appendChild(av);
        if (deco) {
          var dc = document.createElement("img"); dc.className = "dc"; dc.alt = ""; dc.src = deco.url; body.appendChild(dc);
          decoInfo(deco.url).then(function (info) { if (info) layoutDeco(el, deco, info); else el.classList.add("ready"); });
        }
        var nm = document.createElement("div"); nm.className = "nm";
        el.appendChild(body); el.appendChild(nm);
        shown[key] = el;
      }
      var av2 = el.querySelector(".av");
      if (it.avatar && av2.getAttribute("data-src") !== it.avatar) { av2.setAttribute("data-src", it.avatar); av2.src = it.avatar; }
      el.querySelector(".nm").textContent = it.name || "";
      el.classList.toggle("speaking", !!it.speaking);                    // 発言中：明るく・動く／発言していない：暗く・動かない
      if (box.children[i] !== el) box.insertBefore(el, box.children[i] || null);       // 並び順をそろえる（すでに合っているものは、動かさない：動かすと、アニメーションがやり直しになる）
    });
    Object.keys(shown).forEach(function (k) { if (!keep[k]) { shown[k].remove(); delete shown[k]; } });
  }

  // ── 見本（BOTなしで、見た目の確認用）：?demo=1 ──
  function demoAvatar(label, c1, c2) {
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='" + c1 +
              "'/><stop offset='1' stop-color='" + c2 + "'/></linearGradient></defs><rect width='256' height='256' fill='url(#g)'/><text x='128' y='160' font-size='110' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>" +
              label + "</text></svg>";
    return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
  }
  if (q.get("demo")) {
    var t0 = Date.now(), fixed = q.get("scene"), deco = q.get("deco") || "standard";
    var A = demoAvatar("A", "#5b6cff", "#9b5bff"), B = demoAvatar("B", "#ff7a5b", "#ffb35b");
    function demo() {
      var sec = (Date.now() - t0) / 1000;
      var data = { casters: { scene: fixed || (Math.floor(sec / 10) % 2 === 0 ? "large" : "small"), items: [
        { name: "夜の番人BOT", avatar: A, speaking: Math.floor(sec / 5) % 2 === 0, deco: deco },
        { name: "ゲスト", avatar: B, speaking: Math.floor(sec / 3) % 2 === 1, deco: q.get("nodeco") ? null : deco }] } };
      if (q.get("one")) data.casters.items.length = 1;
      render(data);
    }
    demo();
    setInterval(demo, 500);
    return;
  }

  // ── データの読み込み ──
  // 公開サイト：URLの ?t=（配信専用の12文字）を見て、window.TOURNAMENT_DATA_BASE の下の＜12文字＞.json を読む（BAN/PICKの配信用の画面と同じ場所）。
  // ?data=URL：そのURLのJSONを読む。どちらでもなければ、同じ場所の caster.json（Botを動かしているPCから見るとき）。
  function load() {
    var url = q.get("data");
    if (!url && window.TOURNAMENT_DATA_BASE) {
      var key = q.get("t") || "";
      if (!/^[A-Za-z0-9]{12}$/.test(key)) return;
      url = window.TOURNAMENT_DATA_BASE + key + ".json";
    }
    if (!url) url = "caster.json";
    fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (d) { if (d) render(d); })
      .catch(function () { /* 読めなくても、いまの表示を、そのまま */ });
  }
  load();
  setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
