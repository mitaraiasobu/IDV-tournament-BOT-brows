<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>キャスター表示</title>
<meta name="robots" content="noindex,nofollow">
<!--
  キャスター表示（OBSのブラウザソース用。背景は透明）。幅1920・高さ1080が目安だが、ブラウザの幅に合わせて、比例して大きさが変わる。
  - だれがボイスチャンネルにいて、だれが話しているか：BOTが、キャスター用のボイスチャンネルに（人がいるときだけ）接続して、Discordから「だれが話しているか」の通知
    だけを受け取り（音声は聞かない・話さない）、公開データのライブ用の場所（データの中の "live"）に書く。このページは、そこを、ストリーム（EventSource）で、すぐに受け取る
    （受け取れないときは、1.5秒おきに読み直す）。BOTがつながっていないとき（落ちている・接続に失敗した）も、いる人は映る（発言中の光だけ、出ない）。
  - 予備：配信PCで動かす中継プログラム（tools/caster_relay.py）が動いていれば、そこから、WebSocket（既定 ws://127.0.0.1:8778）で受け取ることもできる
    （BOTのライブデータが無い・古いときだけ使う）。
  - 場面（待機／BAN/PICK・試合／戦績画面）・場面ごとの配置・装飾・追加のCSS：BOTが公開データ（URLの ?t=（12文字）の場所）に出している。3秒おきに読み、
    場面が変わったら、再読み込みなしで、すぐに切り替える。
  - 複数人の並べ方：横並び（名前は、上か下）／縦並び（名前は、右か左）。基本は2人ぶんの枠の大きさで、3人以上になったら、その枠からはみ出ないよう、アイコンを小さくする。
  - 位置調整：URLに &edit=（割り当て用の12文字。管理者だけに伝える）を付けて開くと、位置調整のページになる。枠をドラッグして位置を決め、大きさ・並べ方・名前の位置を選んで、
    「保存」を押すと、BOTに送られる（割り当て用ページと同じ、Firebaseの受け箱 …_inbox/＜12文字＞ に書く。BOTが数秒以内に検査して、保存する）。
  - ?debug=1 を付けると、つながりの状態を左上に出す。?relay=ws://… で、中継プログラムの場所を変えられる。
-->
<style>
  html, body { margin: 0; background: transparent; overflow: hidden; }
  #stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; }
  #status { position: fixed; left: 8px; top: 8px; font: 13px/1.5 sans-serif; color: #fff; background: rgba(0,0,0,.6); padding: 4px 8px; border-radius: 6px; display: none; z-index: 9; }
  .debug #status { display: block; }
  ul.voice_states { list-style: none; margin: 0; padding: 0; }
  /* 位置調整ページ */
  body.edit { background: #14171f; color: #eef1f8; font: 14px/1.6 "Noto Sans JP", "Yu Gothic", "Meiryo", sans-serif; overflow: auto; }
  body.edit #wrap { display: flex; height: 100vh; }
  body.edit #panel { display: block; }
  #panel { display: none; width: 280px; flex: none; padding: 10px 12px; background: #1d222d; border-right: 1px solid #38405a; box-sizing: border-box; overflow-y: auto; }
  #panel h1 { font-size: 16px; margin: 0 0 10px; }
  #panel .sec { margin: 9px 0; }
  #panel .sec > label.t { display: block; color: #9aa3bd; font-size: 12px; margin-bottom: 3px; }
  #panel .tabs { display: flex; gap: 4px; flex-wrap: wrap; }
  #panel button { font: inherit; color: #eef1f8; background: #262c3a; border: 1px solid #38405a; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  #panel button.on { background: #5b8cff; border-color: #5b8cff; font-weight: 700; }
  #panel button.save { background: #3fbf7f; border-color: #3fbf7f; color: #04210f; font-weight: 800; width: 100%; padding: 10px; margin-top: 6px; }
  #panel input[type=range] { width: 100%; }
  #panel .row { display: flex; align-items: center; gap: 8px; }
  #panel .row input[type=number] { width: 70px; background: #14171f; color: #eef1f8; border: 1px solid #38405a; border-radius: 6px; padding: 3px 6px; }
  #panel .opt { display: flex; gap: 12px; }
  #panel .small { color: #9aa3bd; font-size: 12px; line-height: 1.5; }
  #msg { margin-top: 6px; min-height: 1.4em; font-size: 13px; }
  #msg.ok { color: #3fbf7f; } #msg.bad { color: #ff6b6b; }
  #area { display: contents; }
  body.edit #area { display: flex; flex: 1; min-width: 0; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; }
  body.edit #stage { position: relative; left: auto; top: auto; right: auto; bottom: auto; overflow: hidden; background-color: #2a2f3a;
    background-image: linear-gradient(45deg, #333a49 25%, transparent 25%, transparent 75%, #333a49 75%), linear-gradient(45deg, #333a49 25%, transparent 25%, transparent 75%, #333a49 75%);
    background-size: 40px 40px; background-position: 0 0, 20px 20px; outline: 2px solid #5b8cff; }
  body.edit ul.voice_states { outline: 2px dashed #ffb54a; outline-offset: 8px; cursor: move; touch-action: none; }
  body.edit #guide { position: absolute; left: 50%; top: 0; bottom: 0; width: 0; border-left: 1px dashed rgba(255,255,255,.25); pointer-events: none; }
</style>
<style id="data-css"></style>
</head>
<body>
<script>window.TOURNAMENT_DATA_BASE = "https://idv-tournament-bot-realtime-default-rtdb.asia-southeast1.firebasedatabase.app/tournament/"; window.PAGE_KIND = "overlay";</script>
<div id="status"></div>
<div id="wrap">
  <div id="panel">
    <div class="tabs" id="tabs"></div>
    <div class="sec"><label class="t">ほかの場面と同じにする</label><div class="tabs" id="copy"></div></div>
    <div class="sec"><label class="t">アイコンの大きさ</label>
      <div class="row"><input type="range" id="d" min="30" max="400" step="1"><input type="number" id="dn" min="30" max="400"></div></div>
    <div class="sec"><label class="t">アイコンの間隔</label>
      <div class="row"><input type="range" id="g" min="-400" max="400" step="1"><input type="number" id="gn" min="-400" max="400"></div></div>
    <div class="sec"><label class="t">透明度（％。0＝透明で見えない・100＝そのまま）</label>
      <div class="row"><input type="range" id="op" min="0" max="100" step="1"><input type="number" id="opn" min="0" max="100"></div></div>
    <div class="sec"><label class="t">並べ方</label><div class="opt" id="orient"></div></div>
    <div class="sec"><label class="t">名前の位置</label><div class="opt" id="name"></div></div>
    <div class="sec"><label class="t">装飾つきアイコンの大きさ</label>
      <div class="row"><input type="range" id="k" min="0.5" max="1.2" step="0.01"><input type="number" id="kn" min="0.5" max="1.2" step="0.01"></div></div>
    <div class="sec"><label class="t">装飾つきの名前を近づける</label>
      <div class="row"><input type="range" id="ng" min="-1.5" max="0.5" step="0.01"><input type="number" id="ngn" min="-1.5" max="0.5" step="0.01"></div></div>
    <div class="sec"><label class="t">見本の人数</label>
      <div class="opt" id="count"></div>
      <label class="small"><input type="checkbox" id="speak"> 1人目が話している</label></div>
    <button class="save" id="save">💾 保存</button>
    <button id="reset" style="margin-top:6px;width:100%">↩ 元に戻す</button>
    <div id="msg"></div>
  </div>
  <div id="area"><div id="stage"><div id="guide"></div><ul class="voice_states o-row n-bottom" id="list"></ul></div></div>
</div>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);
  var KEY = params.get("t") || "";
  var EDIT_KEY = params.get("edit") || "";
  var EDIT = /^[A-Za-z0-9]{12}$/.test(EDIT_KEY);
  var RELAY = params.get("relay") || "ws://127.0.0.1:8778";
  var POLL_MS = 3000;
  var LABELS = { hidden: "非表示（配信の開始前・開会の演出・終了後）", wait: "試合待機", intro_caster: "キャスター紹介", intro_player: "選手紹介", banpick: "BAN/PICK", play: "試合中", result: "戦績画面", champion: "優勝発表" };
  var SCENES = ["wait", "intro_caster", "intro_player", "banpick", "play", "result", "champion"];
  function nowScene() {                                                  // BOTのデータの「場面の切り替わり」を、このブラウザの時計で数える（時刻で進む場面（紹介・BAN/PICKの表示）は、データが変わらなくても切り替わる）
    var plan = data && data.plan, now = Date.now() / 1000, sc = (data && data.scene) || "wait";
    if (plan && plan.length) { sc = "wait"; plan.forEach(function (p) { if (p[0] <= now) sc = p[1]; }); }
    return sc;
  }
  var NAMES = { row: [["bottom", "下"], ["top", "上"]], column: [["right", "右"], ["left", "左"]] };
  var $ = function (id) { return document.getElementById(id); };
  var stage = $("stage"), ul = $("list");
  var st = { relay: "未接続", data: "読み込み中", scene: "—", members: 0 };
  if (params.get("debug")) document.documentElement.className = "debug";
  if (EDIT) document.body.className = "edit";
  function status() { $("status").textContent = (st.live || "BOT：—") + " ／ 予備の中継：" + st.relay + " ／ データ：" + st.data + " ／ 場面：" + st.scene + " ／ " + st.members + "人"; }

  var data = null;                 // BOTのデータ（scene, layouts, deco_scale, css, samples, live）
  var members = [];                // 表示する人（id, name, avatar, mute, speaking）
  var relayMembers = [], liveTree = null, liveKey = "";   // 予備の中継プログラムの人／BOTのライブデータ（Firebaseのストリームで受け取る）／その場所の12文字
  var work = null, workK = 1.02, workNG = -0.5, editScene = "wait", previewCount = 2;     // 位置調整中の、保存前の値

  // ── 配置の反映 ──
  function curLayout() {
    var s = EDIT ? editScene : nowScene();
    var src = EDIT ? work : (data && data.layouts);
    var lay = (src && src[s]) || { x: 50, y: 70, d: 150, gap: 15, orient: "row", name: "bottom" };
    ul.style.display = !EDIT && s === "hidden" ? "none" : "";                                 // 配信の開始前・開会の演出・終了のあとは、キャスターを出さない
    ul.style.opacity = (lay.opacity == null ? 100 : lay.opacity) / 100;                       // 場面ごとの透明度（0＝透明）
    return lay;
  }
  function applyLayout() {
    var l = curLayout();
    var u = stage.clientWidth / 1920;
    var dset = (data && data.deco_ids) || [];
    var hasDeco = members.some(function (m) { return dset.indexOf(m.id) >= 0; });             // 装飾のある人が1人でもいれば、全員の枠を装飾の大きさにそろえる（名前の座標がずれない）
    ul.className = "voice_states o-" + l.orient + " n-" + l.name + (hasDeco ? " x-deco" : "");
    ul.style.setProperty("--x", l.x); ul.style.setProperty("--y", l.y); ul.style.setProperty("--d", l.d); ul.style.setProperty("--gp", l.gap != null ? l.gap : 15);
    ul.style.setProperty("--u", u + "px");
    ul.style.setProperty("--k", EDIT ? workK : (data && data.deco_scale) || 1.02);
    ul.style.setProperty("--ng", EDIT ? workNG : (data && data.name_gap != null ? data.name_gap : -0.5));
    fit();
  }
  // 3人以上になったら、2人ぶんの枠からはみ出ないよう、アイコンを小さくする（1人目・2人目で作る枠の長さに、全員が収まる倍率）
  function fit() {
    ul.style.setProperty("--fit", 1);
    var lis = ul.children;
    if (lis.length <= 2) return;
    var col = ul.classList.contains("o-column");
    var size = function (el) { return col ? el.offsetHeight : el.offsetWidth; };
    var gap = (curLayout().gap || 0) * (stage.clientWidth / 1920);                    // 間隔（マイナスもある）
    var two = size(lis[0]) + size(lis[1]) + gap, all = (lis.length - 1) * gap;
    for (var i = 0; i < lis.length; i++) all += size(lis[i]);
    ul.style.setProperty("--fit", all > two ? (two / all).toFixed(4) : 1);
  }

  // ── 人の表示 ──
  var items = {};
  function render() {
    var seen = {};
    members.forEach(function (m) {
      seen[m.id] = true;
      var li = items[m.id];
      if (!li) {
        li = document.createElement("li");
        li.setAttribute("data-userid", m.id);
        var box = document.createElement("div"); box.className = "voice_box";
        var img = document.createElement("img"); img.className = "voice_avatar"; img.alt = "";
        box.appendChild(img);
        var nm = document.createElement("div"); nm.className = "voice_username"; nm.appendChild(document.createElement("span"));
        li.appendChild(box); li.appendChild(nm);
        items[m.id] = li;
      }
      var cls = "voice_state" + (m.speaking ? " wrapper_speaking" : "") + (m.mute ? " mute self_mute" : "") + (m.deaf ? " deaf self_deaf" : "");
      if (li.className !== cls) li.className = cls;
      var im = li.firstChild.firstChild; if (im.getAttribute("src") !== m.avatar) im.setAttribute("src", m.avatar);
      var sp = li.lastChild.firstChild; if (sp.textContent !== m.name) sp.textContent = m.name;
      ul.appendChild(li);                                                    // 並びを、members の順にそろえる
    });
    Object.keys(items).forEach(function (id) { if (!seen[id]) { items[id].remove(); delete items[id]; } });
    st.members = members.length; status();
    applyLayout();
  }

  // ── BOTのデータ（場面・配置・装飾）──
  function load(first) {
    if (!/^[A-Za-z0-9]{12}$/.test(KEY) || !window.TOURNAMENT_DATA_BASE) { st.data = "URLが正しくありません"; status(); return; }
    fetch(window.TOURNAMENT_DATA_BASE + KEY + ".json?t=" + Date.now(), { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) {
        if (!d || !d.layouts) throw new Error("データがありません");
        data = d;
        if (d.css !== $("data-css").textContent) $("data-css").textContent = d.css;
        st.data = "最新";
        st.scene = LABELS[nowScene()] || d.scene;
        if (EDIT && (first || !work)) { work = JSON.parse(JSON.stringify(d.layouts)); workK = d.deco_scale; workNG = d.name_gap != null ? d.name_gap : -0.5; buildPanel(); sample(); }
        applyLayout(); status();
        if (!EDIT && d.live && d.live !== liveKey) startLive(d.live);
      })
      .catch(function () { st.data = "読み込めません"; status(); });
  }

  // ── BOTのライブデータ（いる人・発言中。Firebaseのストリームで、変わった瞬間に受け取る）──
  var lastT = 0, lastLiveAt = 0;
  function setIn(parts, val) {
    if (!parts.length) { liveTree = val; return; }
    if (liveTree === null || typeof liveTree !== "object") liveTree = {};
    var cur = liveTree;
    for (var i = 0; i < parts.length - 1; i++) {
      if (cur[parts[i]] === null || typeof cur[parts[i]] !== "object" || cur[parts[i]] === undefined) cur[parts[i]] = {};
      cur = cur[parts[i]];
    }
    if (val === null) delete cur[parts[parts.length - 1]]; else cur[parts[parts.length - 1]] = val;
  }
  function applyEvent(type, d) {
    var parts = String(d.path || "/").split("/").filter(Boolean);
    if (type === "put") setIn(parts, d.data);
    else for (var k in (d.data || {})) setIn(parts.concat(k), d.data[k]);
    useLive();
  }
  function toArray(v) { return (Array.isArray(v) ? v : Object.keys(v || {}).map(function (k) { return v[k]; })).filter(Boolean); }
  function useLive() {
    if (liveTree && liveTree.t !== lastT) { lastT = liveTree.t; lastLiveAt = Date.now(); }     // 書き込みのたびに t が変わる（BOTが生きていると分かる）
    recompute();
  }
  function liveActive() { return !!(liveTree && liveTree.active && Date.now() - lastLiveAt < 60000); }
  function recompute() {
    var src = [];
    if (liveActive()) { st.live = liveTree.listening ? "BOT：つながっています" : "BOT：接続中（発言の光は、まだ出ません）"; src = toArray(liveTree.members); }
    else { st.live = liveTree ? "BOT：待機中" : "BOT：未接続"; if (relayMembers.length) src = relayMembers; }
    members = src; render();
  }
  function startLive(key) {
    liveKey = key; liveTree = null;
    var url = window.TOURNAMENT_DATA_BASE + key + ".json";
    function poll() {                                                          // 保険：ストリームが止まっても、古い表示が残らないよう、3秒おきに読み直す（新しい書き込みのときだけ反映）
      fetch(url + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (d) {
        if (d && (!liveTree || (d.t || 0) >= (liveTree.t || 0))) { liveTree = d; useLive(); } else if (!d && liveTree) { liveTree = null; useLive(); }
      }).catch(function () {});
    }
    try {
      var es = new EventSource(url);
      es.addEventListener("put", function (e) { try { applyEvent("put", JSON.parse(e.data)); } catch (x) {} });
      es.addEventListener("patch", function (e) { try { applyEvent("patch", JSON.parse(e.data)); } catch (x) {} });
    } catch (e) {}
    setInterval(poll, 3000); poll();
  }

  // ── 中継プログラムから（OBSの表示のとき）──
  function connect() {
    var ws;
    try { ws = new WebSocket(RELAY); } catch (e) { st.relay = "アドレスが正しくありません"; status(); return; }
    ws.onopen = function () { st.relay = "接続中"; status(); };
    ws.onmessage = function (ev) { try { var m = JSON.parse(ev.data); if (m.type === "state") { relayMembers = m.members; recompute(); } } catch (e) {} };
    ws.onclose = function () { st.relay = "未使用（予備）"; status(); relayMembers = []; recompute(); setTimeout(connect, 5000); };
    ws.onerror = function () {};
  }

  // ── 位置調整ページ ──
  var COLORS = ["e66", "36c", "3a6", "c93", "93c"];
  function sample() {                                                        // 見本の人（装飾のある人のIDを使うと、装飾も見える）
    var ids = (data && data.samples) || [];
    members = [];
    for (var i = 0; i < previewCount; i++) {
      var svg = "<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><rect width='256' height='256' fill='#" + COLORS[i % COLORS.length] + "'/></svg>";
      members.push({ id: ids[i] || ("90000000000000000" + i), name: "キャスター" + String.fromCharCode(65 + i),
        avatar: "data:image/svg+xml;utf8," + encodeURIComponent(svg), mute: false, deaf: false, speaking: i === 0 && $("speak").checked });
    }
    render();
  }
  function radios(host, name, opts, cur, onPick) {
    host.textContent = "";
    opts.forEach(function (o) {
      var lab = document.createElement("label");
      var r = document.createElement("input"); r.type = "radio"; r.name = name; r.value = o[0]; r.checked = o[0] === cur;
      r.onchange = function () { onPick(o[0]); };
      lab.appendChild(r); lab.appendChild(document.createTextNode(" " + o[1]));
      host.appendChild(lab);
    });
  }
  function buildPanel() {
    var tabs = $("tabs"); tabs.textContent = "";
    SCENES.forEach(function (s) {
      var b = document.createElement("button"); b.textContent = LABELS[s]; b.className = s === editScene ? "on" : "";
      b.onclick = function () { editScene = s; buildPanel(); applyLayout(); };
      tabs.appendChild(b);
    });
    var cp = $("copy"); cp.textContent = "";
    SCENES.forEach(function (s) {
      if (s === editScene) return;
      var b = document.createElement("button"); b.textContent = LABELS[s] + "と同じ";
      b.onclick = function () { work[editScene] = JSON.parse(JSON.stringify(work[s])); buildPanel(); applyLayout(); msg("「" + LABELS[editScene] + "」を、「" + LABELS[s] + "」と同じにしました。"); };
      cp.appendChild(b);
    });
    var l = work[editScene];
    $("d").value = l.d; $("dn").value = l.d; $("g").value = l.gap; $("gn").value = l.gap; $("k").value = workK; $("kn").value = workK; $("ng").value = workNG; $("ngn").value = workNG;
    $("op").value = l.opacity == null ? 100 : l.opacity; $("opn").value = $("op").value;
    radios($("orient"), "orient", [["row", "横並び"], ["column", "縦並び"]], l.orient, function (v) {
      work[editScene].orient = v;
      if (NAMES[v].map(function (n) { return n[0]; }).indexOf(work[editScene].name) < 0) work[editScene].name = NAMES[v][0][0];
      buildPanel(); applyLayout();
    });
    radios($("name"), "name", NAMES[l.orient], l.name, function (v) { work[editScene].name = v; applyLayout(); });
    var cnt = $("count"); cnt.textContent = "";
    [1, 2, 3, 4, 5].forEach(function (n) {
      var b = document.createElement("button"); b.textContent = n + "人"; b.className = n === previewCount ? "on" : "";
      b.onclick = function () { previewCount = n; buildPanel(); sample(); applyLayout(); };
      cnt.appendChild(b);
    });
  }
  function setOp(v) { v = Math.max(0, Math.min(100, Math.round(+v) || 0)); work[editScene].opacity = v; $("op").value = v; $("opn").value = v; applyLayout(); }
  function setD(v) { v = Math.max(30, Math.min(400, Math.round(+v) || 150)); work[editScene].d = v; $("d").value = v; $("dn").value = v; applyLayout(); }
  function setNG(v) { v = Math.max(-1.5, Math.min(0.5, isNaN(+v) ? -0.5 : +v)); workNG = Math.round(v * 100) / 100; $("ng").value = workNG; $("ngn").value = workNG; applyLayout(); }
  function setG(v) { v = Math.max(-400, Math.min(400, Math.round(+v) || 0)); work[editScene].gap = v; $("g").value = v; $("gn").value = v; applyLayout(); }
  function setK(v) { v = Math.max(0.5, Math.min(1.2, +v || 1.02)); workK = Math.round(v * 100) / 100; $("k").value = workK; $("kn").value = workK; applyLayout(); }
  function msg(text, cls) { $("msg").textContent = text; $("msg").className = cls || ""; }

  function save() {
    var base = String(window.TOURNAMENT_DATA_BASE).replace(/\/?$/, "");
    var nonce = Math.random().toString(36).slice(2) + Date.now().toString(36);
    msg("保存しています…");
    $("save").disabled = true;
    fetch(base + "_inbox/" + EDIT_KEY + ".json", { method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ nonce: nonce, assignments: { _layout: { scenes: work, deco_scale: workK, name_gap: workNG } } }) })
      .then(function (r) { if (!r.ok) throw new Error("送れませんでした（" + r.status + "）"); return waitResult(nonce, 25); })
      .then(function (res) {
        if (res && res.ok) { msg("✅ 保存しました。", "ok"); load(false); }
        else msg("保存できませんでした：" + ((res && res.error) || "BOTから返事がありません（しばらくしてからもう一度）"), "bad");
      })
      .catch(function (e) { msg("保存できませんでした：" + (e && e.message || e), "bad"); })
      .then(function () { $("save").disabled = false; });
  }
  function waitResult(nonce, tries) {
    return fetch(window.TOURNAMENT_DATA_BASE + EDIT_KEY + ".json?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.json(); }).catch(function () { return null; })
      .then(function (d) {
        if (d && d.result && d.result.nonce === nonce) return d.result;
        if (tries <= 0) return null;
        return new Promise(function (ok) { setTimeout(ok, 1500); }).then(function () { return waitResult(nonce, tries - 1); });
      });
  }

  function startEdit() {
    $("op").oninput = function () { setOp(this.value); }; $("opn").onchange = function () { setOp(this.value); };
    $("d").oninput = function () { setD(this.value); }; $("dn").onchange = function () { setD(this.value); };
    $("g").oninput = function () { setG(this.value); }; $("gn").onchange = function () { setG(this.value); };
    $("k").oninput = function () { setK(this.value); }; $("kn").onchange = function () { setK(this.value); };
    $("ng").oninput = function () { setNG(this.value); }; $("ngn").onchange = function () { setNG(this.value); };
    $("speak").onchange = function () { sample(); };
    $("save").onclick = save;
    $("reset").onclick = function () { work = null; load(true); msg("元に戻しました。"); };
    // 2人ぶんの枠のドラッグ（画面の中心の近くでは、中央にそろえる）
    var drag = null;
    ul.addEventListener("pointerdown", function (e) {
      var r = stage.getBoundingClientRect(), l = work[editScene];
      drag = { dx: e.clientX - (r.left + r.width * l.x / 100), dy: e.clientY - (r.top + r.height * l.y / 100) };
      ul.setPointerCapture(e.pointerId); e.preventDefault();
    });
    ul.addEventListener("pointermove", function (e) {
      if (!drag) return;
      var r = stage.getBoundingClientRect(), l = work[editScene];
      var x = (e.clientX - drag.dx - r.left) / r.width * 100, y = (e.clientY - drag.dy - r.top) / r.height * 100;
      x = Math.max(0, Math.min(100, x)); y = Math.max(0, Math.min(100, y));
      if (Math.abs(x - 50) < 1.2) x = 50;
      l.x = Math.round(x * 10) / 10; l.y = Math.round(y * 10) / 10;
      applyLayout();
    });
    var end = function () { drag = null; };
    ul.addEventListener("pointerup", end); ul.addEventListener("pointercancel", end);
    function size() {                                                        // 位置調整のステージを、16:9で、空いている場所いっぱいにする
      var a = $("area"), w = a.clientWidth - 28, h = a.clientHeight - 28;
      var sw = Math.max(200, Math.min(w, h * 16 / 9));
      stage.style.width = sw + "px"; stage.style.height = (sw * 9 / 16) + "px";
      applyLayout();
    }
    window.addEventListener("resize", size); size();
  }

  window.addEventListener("resize", applyLayout);
  status();
  if (EDIT) { startEdit(); load(true); }
  else {
    load(true); setInterval(function () { load(false); }, POLL_MS); connect();
    var lastScene = null;
    setInterval(function () {                                                // 時刻で進む場面（紹介・BAN/PICKの表示）の切り替わり：データが変わらなくても、1秒ごとに確かめる
      var s = nowScene();
      if (s !== lastScene) { lastScene = s; st.scene = LABELS[s] || s; applyLayout(); status(); }
    }, 1000);
  }
})();
</script>
</body>
</html>
