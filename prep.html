<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>作戦ボード</title>
<!-- 作戦ボード：チーム専用チャンネルにピン留めして使う、試合前の準備のページ（みんなで同時に編集できる）。
     ・「常用キャラ」タブ：選手ごとの得意キャラ。キャラの名札を、選手の枠へドラッグして入れる（同じ枠に同じキャラは入らない。選手が違えば同じキャラでもよい）。
     ・ラウンドのタブ → セットのタブ：右がハンターコーナー、中央がサバイバーコーナー。BAN・PICK・GLOBAL BAN の枠に名札を入れて作戦を立てる。
       GLOBAL BAN は、適用されるものがBOTから自動で入る。BANやPICKができないセットは、その枠が使えない。必須キャラは黄色、使用禁止キャラが入ると赤く点滅して知らせる。
     ・データは Firebase の <node>_prep/＜このチームの12文字＞ にある。meta＝BOTが書く（選手・キャラ・ルール）。state＝このページが1操作ごとに書く（作戦・メモ）。
     ・URLの ?t= の12文字を知っている人だけが開ける（チーム専用チャンネルにだけ載せる）。 -->
<style>
  :root { --bg: #0f1218; --panel: #181d27; --panel2: #202735; --line: #2f394d; --text: #e8ecf4; --sub: #93a0b8;
          --h: #d8334a; --h2: #7d1b29; --s: #2f7be0; --s2: #173d73; --gold: #ffd23f; --ok: #3ecf8e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif; }
  body { min-height: 100vh; }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding: 10px 16px 6px; }
  header h1 { margin: 0; font-size: 20px; }
  header .sub { color: var(--sub); font-size: 13px; }
  #status { margin-left: auto; font-size: 12px; color: var(--sub); }
  #status.ok { color: var(--ok); } #status.ng { color: #ff7a85; }
  nav { display: flex; gap: 6px; flex-wrap: wrap; padding: 4px 16px; }
  nav button { appearance: none; border: 1px solid var(--line); background: var(--panel); color: var(--text); padding: 7px 14px; border-radius: 8px 8px 0 0;
               font: inherit; font-size: 14px; cursor: pointer; }
  nav button.on { background: var(--panel2); border-color: #6f84ad; border-bottom-color: var(--panel2); font-weight: 700; }
  #tabs2 button { font-size: 13px; padding: 5px 12px; }
  #notice { margin: 4px 16px; font-size: 13px; }
  #notice .bar { padding: 6px 10px; border-radius: 6px; margin-bottom: 4px; }
  #notice .bad { background: #4a1219; border: 1px solid #ff3b52; color: #ffb3bb; animation: blink 1s steps(2, start) infinite; }
  #notice .req { background: #4a3d0a; border: 1px solid var(--gold); color: #ffe48a; }
  #notice .err { background: #3a2a10; border: 1px solid #e0a030; color: #ffd28a; }
  main { display: flex; gap: 12px; padding: 8px 16px 40px; align-items: flex-start; }
  #pal { flex: 0 0 330px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; position: sticky; top: 8px;
         max-height: calc(100vh - 16px); overflow-y: auto; }
  #pal.drop-ok { outline: 2px dashed var(--sub); }
  #pal h3 { margin: 6px 2px 4px; font-size: 13px; color: var(--sub); }
  #pal input { width: 100%; background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; font: inherit; font-size: 13px; }
  #work { flex: 1; min-width: 0; }
  .grid { display: flex; flex-wrap: wrap; gap: 5px; }
  /* 名札：顔 + 名前 を、枠で囲む。ハンターは赤、サバイバーは青 */
  .tag { width: 66px; border: 2px solid; border-radius: 8px; padding: 3px 2px 2px; text-align: center; cursor: grab; user-select: none; -webkit-user-select: none;
         touch-action: pan-y; position: relative; background: var(--panel2); }
  .tag.h { border-color: var(--h); background: linear-gradient(180deg, #3a1219, var(--h2)); }
  .tag.s { border-color: var(--s); background: linear-gradient(180deg, #11274a, var(--s2)); }
  .tag .face { width: 56px; height: 56px; margin: 0 auto; border-radius: 6px; background-repeat: no-repeat; background-color: rgba(0,0,0,.35);
               display: flex; align-items: center; justify-content: center; font-size: 26px; }
  .tag .nm { font-size: 10.5px; line-height: 1.15; margin-top: 2px; word-break: break-all; min-height: 24px; display: flex; align-items: center; justify-content: center; }
  .tag.sel { outline: 3px solid #fff; }
  .tag.req { border-color: var(--gold); box-shadow: 0 0 0 2px var(--gold), 0 0 12px 2px rgba(255,210,63,.75); }
  .tag.req .nm { color: var(--gold); font-weight: 700; }
  .tag.bad { border-color: #ff2b45; animation: blinkTag .8s steps(2, start) infinite; }
  .tag.locked { cursor: default; opacity: .92; }
  .tag.dim { opacity: .35; }
  .tag .x { position: absolute; right: -6px; top: -7px; width: 18px; height: 18px; line-height: 16px; border-radius: 50%; background: #000; color: #fff; border: 1px solid #888;
            font-size: 11px; padding: 0; cursor: pointer; display: none; }
  .tag:hover .x, .tag.sel .x { display: block; }
  @media (hover: none) { .tag .x { display: block; } }
  @keyframes blink { 50% { opacity: .35; } }
  @keyframes blinkTag { 50% { background: #ff2b45; box-shadow: 0 0 14px 4px #ff2b45; } }
  .ghost { position: fixed; z-index: 99999; pointer-events: none; opacity: .9; transform: translate(-50%, -60%) scale(1.08); }
  /* 常用キャラ */
  .players { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 120px; }
  .box h4 { margin: 0 0 6px; font-size: 14px; display: flex; justify-content: space-between; gap: 8px; }
  .box h4 small { color: var(--sub); font-weight: 400; }
  .drop { min-height: 84px; border-radius: 8px; padding: 4px; background: rgba(255,255,255,.03); border: 1px dashed var(--line); }
  .drop.over { background: rgba(255,255,255,.12); border-color: #fff; }
  .drop.off { background: repeating-linear-gradient(45deg, #1a1f29, #1a1f29 8px, #141820 8px, #141820 16px); border-style: solid; color: var(--sub); font-size: 12px; text-align: center; padding-top: 28px; }
  .drop.empty::before { content: attr(data-hint); color: #5d6a82; font-size: 12px; }
  /* セット */
  #corners { display: flex; gap: 12px; flex-wrap: wrap; }
  .corner { flex: 1 1 360px; background: var(--panel); border: 2px solid; border-radius: 12px; padding: 8px 10px 10px; min-width: 0; }
  .corner.s { border-color: var(--s); } .corner.h { border-color: var(--h); }
  .corner > h3 { margin: 0 0 6px; font-size: 16px; }
  .corner.s > h3 { color: #7eb4ff; } .corner.h > h3 { color: #ff8896; }
  .blk { margin-top: 8px; }
  .blk h4 { margin: 0 0 4px; font-size: 13px; display: flex; gap: 8px; align-items: baseline; }
  .blk h4 .cnt { margin-left: auto; font-weight: 400; color: var(--sub); font-size: 12px; }
  .blk h4 .cnt.over { color: #ff7a85; font-weight: 700; }
  .blk.gb .drop { background: rgba(160,120,255,.07); border-color: #6b57a8; }
  #memo { margin-top: 12px; }
  #memo textarea { width: 100%; min-height: 110px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: inherit; resize: vertical; }
  .hint { color: var(--sub); font-size: 12px; margin: 4px 0; }
  .empty-msg { color: var(--sub); padding: 30px; text-align: center; }
  @media (max-width: 820px) {
    main { flex-direction: column; }
    #pal { position: static; flex: none; width: 100%; max-height: 38vh; }
  }
</style>
</head>
<body>
<script>window.TOURNAMENT_DATA_BASE = "https://idv-tournament-bot-realtime-default-rtdb.asia-southeast1.firebasedatabase.app/tournament/"; window.PAGE_KIND = "prep";</script>
<header>
  <h1 id="ttl">作戦ボード</h1><span class="sub" id="sub"></span><span id="status">接続中…</span>
</header>
<nav id="tabs1"></nav>
<nav id="tabs2"></nav>
<div id="notice"></div>
<main>
  <aside id="pal"></aside>
  <section id="work"></section>
</main>
<script>
(function () {
  "use strict";
  var key = new URLSearchParams(location.search).get("t") || "";
  var BASE = (window.TOURNAMENT_DATA_BASE || "").replace(/\/?$/, "") + "_prep/";
  var $ = function (id) { return document.getElementById(id); };
  var META = null, STATE = {}, CH = {}, PLAYERS = [];
  var cur = { tab: "fav", set: "1" };                       // tab："fav"（常用キャラ）か ラウンド番号。set：セットのキー
  var FACES = {};
  var sel = null;                                            // クリックで持ち上げている名札 { id, from }

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function setStatus(txt, cls) { var s = $("status"); s.textContent = txt; s.className = cls || ""; }
  function imgUrl(p) { return p.split("/").map(encodeURIComponent).join("/"); }
  function obj(o) { return o && typeof o === "object" ? o : {}; }

  if (!/^[A-Za-z0-9]{12}$/.test(key)) {
    $("work").appendChild(el("div", "empty-msg", "このページのURLが正しくありません。チーム専用チャンネルのピン留めから開いてください。"));
    setStatus("URLが正しくありません", "ng");
    return;
  }

  // ───────── Firebase（読み：ストリーム、書き：1操作ごとのPATCH） ─────────
  function setPath(root, path, val) {
    if (path === "/" || path === "") return val;
    var segs = path.split("/").filter(Boolean);
    if (root === null || typeof root !== "object") root = {};
    var node = root;
    for (var i = 0; i < segs.length - 1; i++) {
      if (node[segs[i]] === null || typeof node[segs[i]] !== "object") node[segs[i]] = {};
      node = node[segs[i]];
    }
    var last = segs[segs.length - 1];
    if (val === null) delete node[last]; else node[last] = val;
    return root;
  }
  function stream(name, onData) {
    var data = null, url = BASE + key + "/" + name + ".json", es = null, poll = null;
    function emit() { onData(data); }
    function startPoll() {                                  // ストリームが使えないときは、数秒おきに読む
      if (poll) return;
      poll = setInterval(function () {
        fetch(url + "?t=" + Date.now(), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) { data = j; emit(); setStatus("● 同期中（ポーリング）", "ok"); }).catch(function () { setStatus("× つながっていません", "ng"); });
      }, 3000);
    }
    if (!window.EventSource) { startPoll(); return; }
    function open() {
      es = new EventSource(url);
      es.addEventListener("put", function (e) { var d = JSON.parse(e.data); data = setPath(data, d.path, d.data); emit(); setStatus("● 同期中", "ok"); });
      es.addEventListener("patch", function (e) {
        var d = JSON.parse(e.data);
        Object.keys(d.data || {}).forEach(function (k) { data = setPath(data, (d.path === "/" ? "" : d.path) + "/" + k, d.data[k]); });
        emit();
      });
      es.addEventListener("cancel", function () { setStatus("× 読み取りが許可されていません", "ng"); });
      es.addEventListener("auth_revoked", function () { setStatus("× 読み取りが許可されていません", "ng"); });
      es.onerror = function () { setStatus("再接続中…", "ng"); if (es.readyState === 2) { es.close(); startPoll(); } };
    }
    open();
  }
  var writeFailed = false;
  function write(ops) {
    Object.keys(ops).forEach(function (p) { STATE = setPath(STATE, p, ops[p]); });
    fill();
    fetch(BASE + key + "/state.json", { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ops) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); writeFailed = false; showNotice(); })
      .catch(function (e) { writeFailed = true; showNotice(); });
  }

  // ───────── 画像（顔の切り出し） ─────────
  var IMGS = {};
  function loadImg(src, cb) {
    var c = IMGS[src];
    if (c) { if (c.done) cb(c); else c.cbs.push(cb); return; }
    c = IMGS[src] = { cbs: [cb], done: false };
    var im = new Image();
    im.onload = function () { c.done = true; c.ok = true; c.w = im.naturalWidth; c.h = im.naturalHeight; c.cbs.forEach(function (f) { f(c); }); c.cbs = []; };
    im.onerror = function () { c.done = true; c.ok = false; c.cbs.forEach(function (f) { f(c); }); c.cbs = []; };
    im.src = imgUrl(src);
  }
  function paintFace(box, ch, S) {
    if (!ch.i) { box.textContent = ch.e || ch.n.slice(0, 1); return; }
    loadImg(ch.i, function (c) {
      if (!c.ok) { box.textContent = ch.e || ch.n.slice(0, 1); return; }
      var f = FACES[ch.i], L, cx, cy;
      if (f) { L = Math.max(1, f.r * c.h * 2.5); cx = f.cx * c.w; cy = f.cy * c.h; }       // 登録された頭の円を中心に切り出す
      else { L = c.h * 0.42; cx = c.w / 2; cy = c.h * 0.2; }                                // 登録がなければ、上のほうの真ん中
      var sc = S / L;
      box.textContent = "";
      box.style.backgroundImage = 'url("' + imgUrl(ch.i) + '")';
      box.style.backgroundSize = (c.w * sc) + "px " + (c.h * sc) + "px";
      box.style.backgroundPosition = (S / 2 - cx * sc) + "px " + (S / 2 - cy * sc) + "px";
    });
  }
  function makeTag(ch, opt) {
    opt = opt || {};
    var t = el("div", "tag " + ch.f);
    t.setAttribute("data-id", ch.id);
    var face = el("div", "face");
    t.appendChild(face);
    t.appendChild(el("div", "nm", ch.n));
    paintFace(face, ch, 56);
    if (opt.req) t.classList.add("req");
    if (opt.bad) t.classList.add("bad");
    if (opt.locked) t.classList.add("locked");
    if (opt.onRemove) {
      var x = el("button", "x", "×");
      x.title = "外す";
      x.addEventListener("pointerdown", function (e) { e.stopPropagation(); });
      x.addEventListener("click", function (e) { e.stopPropagation(); opt.onRemove(); });
      t.appendChild(x);
    }
    return t;
  }

  // ───────── 現在のラウンド・セット ─────────
  function curRound() { return META && cur.tab !== "fav" ? (META.rounds || []).filter(function (r) { return String(r.no) === String(cur.tab); })[0] : null; }
  function curSet() { var r = curRound(); return r ? (r.sets || []).filter(function (s) { return s.k === cur.set; })[0] || r.sets[0] : null; }
  function setId() { var r = curRound(), s = curSet(); return r && s ? r.no + "_" + s.k : null; }
  function setState() { return obj(obj(STATE.sets)[setId()]); }

  // ───────── タブ ─────────
  function buildTabs() {
    var t1 = $("tabs1"); t1.textContent = "";
    function tab(label, on, fn) { var b = el("button", on ? "on" : "", label); b.addEventListener("click", fn); return b; }
    t1.appendChild(tab("⭐ 常用キャラ", cur.tab === "fav", function () { go("fav"); }));
    (META.rounds || []).forEach(function (r) { t1.appendChild(tab(r.name, String(cur.tab) === String(r.no), function () { go(r.no); })); });
    var t2 = $("tabs2"); t2.textContent = "";
    var r = curRound();
    if (r) (r.sets || []).forEach(function (s) { t2.appendChild(tab(s.label, s.k === (curSet() || {}).k, function () { go(r.no, s.k); })); });
  }
  function go(tab, set) {
    cur.tab = tab;
    if (set) cur.set = set; else if (tab !== "fav") { var r = curRound(); cur.set = r && r.sets[0] ? r.sets[0].k : "1"; }
    try { sessionStorage.setItem("prep_tab_" + key, JSON.stringify(cur)); } catch (e) { /* 無視 */ }
    sel = null;
    buildAll();
  }

  // ───────── 名札のドラッグ ─────────
  var drag = null;
  function dropTargetAt(x, y) {
    var e = document.elementFromPoint(x, y);
    return e ? e.closest("[data-drop],#pal") : null;
  }
  function attachTag(node, ch, from) {
    node.addEventListener("pointerdown", function (e) {
      if (e.button != null && e.button > 0) return;
      var st = { ch: ch, from: from, x: e.clientX, y: e.clientY, started: false, node: node, pid: e.pointerId, touch: e.pointerType === "touch", timer: null, ghost: null };
      drag = st;
      if (st.touch) st.timer = setTimeout(function () { if (drag === st) begin(st, st.x, st.y); }, 280);
    });
  }
  function begin(st, x, y) {
    st.started = true;
    var g = st.node.cloneNode(true);
    g.className = g.className + " ghost";
    st.ghost = g;
    document.body.appendChild(g);
    moveGhost(st, x, y);
    document.body.classList.add("dragging");
  }
  function moveGhost(st, x, y) { st.ghost.style.left = x + "px"; st.ghost.style.top = y + "px"; }
  function highlight(x, y) {
    var all = document.querySelectorAll(".over");
    for (var i = 0; i < all.length; i++) all[i].classList.remove("over");
    var t = dropTargetAt(x, y);
    if (t && t.id !== "pal") t.classList.add("over");
    $("pal").classList.toggle("drop-ok", !!(drag && drag.from && drag.from.kind !== "pal" && t && t.id === "pal"));
  }
  document.addEventListener("pointermove", function (e) {
    var st = drag;
    if (!st) return;
    if (!st.started) {
      var d = Math.abs(e.clientX - st.x) + Math.abs(e.clientY - st.y);
      if (st.touch) { if (d > 12) { clearTimeout(st.timer); drag = null; } return; }          // タッチは、長押しで持ち上げる（動いたらスクロール）
      if (d > 6) begin(st, e.clientX, e.clientY); else return;
    }
    moveGhost(st, e.clientX, e.clientY);
    highlight(e.clientX, e.clientY);
  });
  document.addEventListener("touchmove", function (e) { if (drag && drag.started) e.preventDefault(); }, { passive: false });
  function finish(e, cancelled) {
    var st = drag;
    if (!st) return;
    drag = null;
    clearTimeout(st.timer);
    var all = document.querySelectorAll(".over");
    for (var i = 0; i < all.length; i++) all[i].classList.remove("over");
    $("pal").classList.remove("drop-ok");
    document.body.classList.remove("dragging");
    if (!st.started) {                                       // 動かさずに離した：クリック（持ち上げる／置く）
      if (!cancelled) clickTag(st);
      return;
    }
    if (st.ghost) st.ghost.remove();
    if (cancelled) return;
    var t = dropTargetAt(e.clientX, e.clientY);
    if (t) dropOn(st.ch, st.from, t);
  }
  document.addEventListener("pointerup", function (e) { finish(e, false); });
  document.addEventListener("pointercancel", function (e) { finish(e, true); });
  function clickTag(st) {
    var same = sel && sel.id === st.ch.id && sameFrom(sel.from, st.from);
    var zone = st.node.closest ? st.node.closest("[data-drop]") : null;
    if (sel && !same && zone) { dropOn(sel.ch, sel.from, zone); return; }          // 持ち上げている名札を、この枠に置く
    sel = same ? null : { id: st.ch.id, ch: st.ch, from: st.from };
    fill();
  }
  $("pal").addEventListener("click", function (e) {                                  // 持ち上げている名札を、名札置き場へ（枠から外す）
    if (sel && sel.from.kind !== "pal" && !(e.target.closest && e.target.closest(".tag"))) dropOn(sel.ch, sel.from, $("pal"));
  });
  function sameFrom(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

  // 置き先（data-drop）：fav:選手ID ／ set:f:b（f＝h|s、b＝ban|pick）
  function dropPath(spec) {
    var p = spec.split(":");
    if (p[0] === "fav") return "fav/" + p[1];
    var sid = setId();
    return sid ? "sets/" + sid + "/" + p[1] + "/" + p[2] : null;
  }
  function pathOfFrom(from, id) {
    if (!from || from.kind === "pal") return null;
    var base = dropPath(from.spec);
    return base ? base + "/" + id : null;
  }
  function dropOn(ch, from, target) {
    var ops = {}, old = pathOfFrom(from, ch.id);
    if (target.id === "pal") {                               // 名札置き場へ戻す：外す
      if (old) { ops[old] = null; write(ops); }
      sel = null; fill();
      return;
    }
    var spec = target.getAttribute("data-drop");
    if (target.classList.contains("off")) return;
    var parts = spec.split(":");
    if (parts[0] === "set" && parts[1] !== ch.f) { flash("ハンターの名札は右のハンターコーナー、サバイバーの名札は中央のサバイバーコーナーに入れてください。"); return; }
    var path = dropPath(spec);
    if (!path) return;
    var dest = path + "/" + ch.id;
    if (dest === old) { sel = null; fill(); return; }
    if (obj(getAt(path))[ch.id]) { if (old) { ops[old] = null; write(ops); } sel = null; fill(); return; }     // すでに入っている（同じ枠に同じ名札は入らない）
    ops[dest] = true;
    if (old) ops[old] = null;
    sel = null;
    write(ops);
  }
  function getAt(path) {
    var node = STATE, segs = path.split("/");
    for (var i = 0; i < segs.length; i++) { if (node == null || typeof node !== "object") return null; node = node[segs[i]]; }
    return node;
  }
  var flashTimer = null;
  function flash(msg) { var n = $("notice"); n.setAttribute("data-flash", msg); showNotice(); clearTimeout(flashTimer); flashTimer = setTimeout(function () { n.removeAttribute("data-flash"); showNotice(); }, 3500); }

  function onDropClick(spec, node) {                         // 持ち上げている名札を、クリックで置く
    if (!sel) return;
    var st = sel;
    dropOn(st.ch, st.from, node);
  }

  // ───────── 描画 ─────────
  function buildAll() {
    if (!META) return;
    buildTabs();
    buildPalette();
    buildWork();
    fill();
  }
  var palFilter = "";
  function buildPalette() {
    var pal = $("pal"); pal.textContent = "";
    var q = el("input"); q.type = "search"; q.placeholder = "キャラを探す"; q.value = palFilter;
    q.addEventListener("input", function () { palFilter = q.value; fillPalette(); });
    pal.appendChild(q);
    pal.appendChild(el("div", "hint", "名札を右の枠へドラッグ（スマホは、長押ししてから動かす／タップして選び、置きたい枠をタップ）。枠から外すときは、ここへ戻すか ×。"));
    pal.appendChild(el("h3", "", "ハンター"));
    var gh = el("div", "grid"); gh.id = "palH"; pal.appendChild(gh);
    pal.appendChild(el("h3", "", "サバイバー"));
    var gs = el("div", "grid"); gs.id = "palS"; pal.appendChild(gs);
    fillPalette();
  }
  function reqIds() {
    var s = curSet(), out = {};
    if (s) ["h", "s"].forEach(function (f) { (s.req && s.req[f] || []).forEach(function (r) { out[r.id] = r.g || "req"; }); });
    return out;
  }
  function gbIds() {
    var s = curSet(), out = {};
    if (s) ["h", "s"].forEach(function (f) { (s.gb && s.gb[f] || []).forEach(function (id) { out[id] = true; }); });
    return out;
  }
  function fillPalette() {
    var q = palFilter.trim().toLowerCase(), req = cur.tab === "fav" ? {} : reqIds();
    [["palH", "h"], ["palS", "s"]].forEach(function (pair) {
      var box = $(pair[0]); box.textContent = "";
      ((META.chars || {})[pair[1]] || []).forEach(function (c) {
        if (q && (c.n + (c.e || "")).toLowerCase().indexOf(q) < 0) return;
        var ch = CH[c.id];
        var t = makeTag(ch, { req: !!req[c.id] });
        if (sel && sel.id === c.id && sel.from.kind === "pal") t.classList.add("sel");
        attachTag(t, ch, { kind: "pal" });
        box.appendChild(t);
      });
    });
  }
  function buildWork() {
    var w = $("work"); w.textContent = "";
    if (cur.tab === "fav") {
      w.appendChild(el("div", "hint", "選手ごとの得意キャラです。名札を選手の枠に入れてください（同じ枠に同じキャラは入りません。選手が違えば、同じキャラでも入れられます）。"));
      var g = el("div", "players");
      if (!PLAYERS.length) w.appendChild(el("div", "empty-msg", "選手が登録されると、ここに並びます。"));
      PLAYERS.forEach(function (p) {
        var b = el("div", "box");
        var h = el("h4", "", p.n); b.appendChild(h);
        var d = el("div", "drop"); d.setAttribute("data-drop", "fav:" + p.id); d.setAttribute("data-hint", "ここに名札を入れる");
        d.addEventListener("click", function () { onDropClick("fav:" + p.id, d); });
        b.appendChild(d); g.appendChild(b);
      });
      w.appendChild(g);
      return;
    }
    var s = curSet();
    if (!s) { w.appendChild(el("div", "empty-msg", "このラウンドの情報がありません。")); return; }
    var r = curRound();
    w.appendChild(el("div", "hint", r.name + "（" + r.fmt + "）／" + s.label + "　BAN：サバイバー" + s.ban.s + "・ハンター" + s.ban.h + "　PICK：サバイバー" + s.pick.s + "・ハンター" + s.pick.h
      + "。GLOBAL BANは、自動で入ります（外せません）。"));
    var cs = el("div"); cs.id = "corners";
    [["s", "サバイバーコーナー"], ["h", "ハンターコーナー"]].forEach(function (pair) {       // 中央がサバイバー、右がハンター
      var f = pair[0], c = el("div", "corner " + f); c.appendChild(el("h3", "", pair[1]));
      [["ban", "BAN"], ["pick", "PICK"], ["gb", "GLOBAL BAN（自動）"]].forEach(function (bk) {
        var b = bk[0], blk = el("div", "blk " + b);
        var h = el("h4", "", bk[1]); var cnt = el("span", "cnt"); cnt.id = "cnt-" + f + "-" + b; h.appendChild(cnt); blk.appendChild(h);
        var d = el("div", "drop");
        d.id = "blk-" + f + "-" + b;
        if (b === "gb") { d.setAttribute("data-hint", s.gbOn[f] ? "適用されるキャラはありません" : "このセットはGLOBAL BANなし"); }
        else {
          var cap = (s[b] || {})[f] || 0;
          if (cap === 0) { d.classList.add("off"); d.textContent = (b === "ban" ? "BAN" : "PICK") + "はできないセットです"; }
          else { d.setAttribute("data-drop", "set:" + f + ":" + b); d.setAttribute("data-hint", "ここに名札を入れる"); d.addEventListener("click", (function (spec, node) { return function () { onDropClick(spec, node); }; })("set:" + f + ":" + b, d)); }
        }
        blk.appendChild(d); c.appendChild(blk);
      });
      cs.appendChild(c);
    });
    w.appendChild(cs);
    var memo = el("div"); memo.id = "memo";
    memo.appendChild(el("h4", "", "メモ（戦略・メモなど。みんなで同時に書けます）"));
    var ta = el("textarea"); ta.maxLength = 2000; ta.placeholder = "自由に書いてください";
    var timer = null, sid = setId();
    ta.addEventListener("input", function () {
      clearTimeout(timer);
      timer = setTimeout(function () { var o = {}; o["sets/" + sid + "/memo"] = ta.value || null; writeQuiet(o); }, 500);
    });
    ta.id = "memoText";
    memo.appendChild(ta); w.appendChild(memo);
  }
  function writeQuiet(ops) {                                 // メモ：自分の入力欄を作り直さずに書く
    Object.keys(ops).forEach(function (p) { STATE = setPath(STATE, p, ops[p]); });
    fetch(BASE + key + "/state.json", { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(ops) })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); writeFailed = false; showNotice(); })
      .catch(function () { writeFailed = true; showNotice(); });
  }
  function fill() {
    if (!META) return;
    fillPalette();
    if (cur.tab === "fav") {
      PLAYERS.forEach(function (p) {
        var d = document.querySelector('[data-drop="fav:' + p.id + '"]');
        if (!d) return;
        d.textContent = "";
        var ids = Object.keys(obj(obj(STATE.fav)[p.id])).map(Number).filter(function (id) { return CH[id]; });
        ids.sort(function (a, b) { return (CH[a].f === CH[b].f ? 0 : CH[a].f === "h" ? -1 : 1) || a - b; });
        d.classList.toggle("empty", !ids.length);
        ids.forEach(function (id) {
          var t = makeTag(CH[id], { onRemove: function () { var o = {}; o["fav/" + p.id + "/" + id] = null; write(o); } });
          if (sel && sel.id === id && sel.from.spec === "fav:" + p.id) t.classList.add("sel");
          attachTag(t, CH[id], { kind: "blk", spec: "fav:" + p.id });
          d.appendChild(t);
        });
      });
    } else {
      var s = curSet();
      if (s) {
        var req = reqIds(), gb = gbIds(), st = setState();
        [["s"], ["h"]].forEach(function (fa) {
          var f = fa[0];
          ["ban", "pick"].forEach(function (b) {
            var d = $("blk-" + f + "-" + b);
            if (!d) return;
            var cap = (s[b] || {})[f] || 0, ids = Object.keys(obj(obj(st[f])[b])).map(Number).filter(function (id) { return CH[id]; });
            d.textContent = "";
            d.classList.toggle("empty", !ids.length && cap > 0);
            ids.forEach(function (id) {
              var spec = "set:" + f + ":" + b;
              var t = makeTag(CH[id], { req: !!req[id], bad: !!gb[id], onRemove: function () { var o = {}; o[dropPath(spec) + "/" + id] = null; write(o); } });
              if (sel && sel.id === id && sel.from.spec === spec) t.classList.add("sel");
              attachTag(t, CH[id], { kind: "blk", spec: spec });
              d.appendChild(t);
            });
            var c = $("cnt-" + f + "-" + b);
            if (c) { c.textContent = cap ? ids.length + " / " + cap : ""; c.className = "cnt" + (ids.length > cap ? " over" : ""); }
          });
          var g = $("blk-" + f + "-gb");
          if (g) {
            g.textContent = "";
            var gl = ((s.gb || {})[f] || []).filter(function (id) { return CH[id]; });
            g.classList.toggle("empty", !gl.length);
            gl.forEach(function (id) { g.appendChild(makeTag(CH[id], { locked: true })); });
          }
        });
        var ta = $("memoText");
        if (ta) { var v = String(obj(st).memo || ""); if (document.activeElement !== ta && ta.value !== v) ta.value = v; }
      }
    }
    showNotice();
  }
  function showNotice() {
    var n = $("notice"); n.textContent = "";
    var flashMsg = n.getAttribute("data-flash");
    if (flashMsg) n.appendChild(el("div", "bar err", flashMsg));
    if (writeFailed) n.appendChild(el("div", "bar err", "保存できませんでした（通信が切れている、または Firebase のルールに作戦ボードの許可がありません）。管理者に伝えてください。"));
    if (!META || cur.tab === "fav") return;
    var s = curSet(), st = setState(), gb = gbIds();
    var bad = [], placed = {};
    ["h", "s"].forEach(function (f) {
      ["ban", "pick"].forEach(function (b) {
        Object.keys(obj(obj(st[f])[b])).forEach(function (id) {
          id = Number(id);
          if (b === "pick") placed[id] = true;
          if (gb[id] && CH[id]) bad.push(CH[id].n + "（" + (b === "ban" ? "BAN" : "PICK") + "）");
        });
      });
    });
    if (bad.length) n.appendChild(el("div", "bar bad", "⚠ 使用禁止のキャラが入っています：" + bad.join("、")));
    var reqs = [];
    ["h", "s"].forEach(function (f) { ((s && s.req && s.req[f]) || []).forEach(function (r) { if (CH[r.id]) reqs.push(CH[r.id].n + (r.g ? "（組" + r.g + "）" : "") + (placed[r.id] ? " ✓" : " （まだPICKしていません）")); }); });
    if (reqs.length) n.appendChild(el("div", "bar req", "★ このセットの必須キャラ：" + reqs.join("、")));
  }

  // ───────── 読み込み ─────────
  function onMeta(m) {
    if (!m) { if (!META) setStatus("データを待っています…（BOTが準備すると表示されます）", ""); return; }
    META = m;
    CH = {};
    ["h", "s"].forEach(function (f) { ((m.chars || {})[f] || []).forEach(function (c) { CH[c.id] = { id: c.id, n: c.n, e: c.e, i: c.i, f: f }; }); });
    PLAYERS = (m.players || []).filter(function (p) { return p && p.id != null; });
    $("ttl").textContent = "🧠 作戦ボード｜" + (m.team || "");
    $("sub").textContent = m.tour || "";
    document.title = "作戦ボード｜" + (m.team || "");
    if (cur.tab !== "fav" && !curRound()) cur = { tab: "fav", set: "1" };
    if (cur.tab !== "fav" && !curSet()) cur.set = (curRound().sets[0] || {}).k;
    var memoFocused = document.activeElement && document.activeElement.id === "memoText";
    if (memoFocused) { buildTabs(); buildPalette(); fill(); } else buildAll();
  }
  function onState(s) { STATE = s || {}; fill(); }
  try { var saved = JSON.parse(sessionStorage.getItem("prep_tab_" + key) || "null"); if (saved && saved.tab) cur = saved; } catch (e) { /* 無視 */ }
  function getJson(u) { return fetch(u, { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  Promise.all([getJson("face_positions.json"), getJson("assets/face_positions.json")]).then(function (r) {
    FACES = (r[0] && r[0].faces) || (r[1] && r[1].faces) || {};
  }).then(function () {
    stream("meta", onMeta);
    stream("state", onState);
  });
})();
</script>
</body>
</html>
